name: Bug report
description: Something does not work as documented.
labels: [needs-triage, bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps, request or code that shows it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Server version (`flagnetic version`) or SDK and its version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, PostgreSQL version, how you run it (binary, Docker, Kubernetes), browser if it is the console.
