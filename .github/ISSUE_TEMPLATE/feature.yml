name: Feature request
description: Something Flagnetic should do.
labels: [needs-triage, enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to achieve and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Mention how other tools solve it if that helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
