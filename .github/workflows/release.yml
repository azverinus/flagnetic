name: release

# release-please keeps one release pull request open with the next versions
# and changelogs, computed from the Conventional Commits on main. Merging it
# tags the release; the jobs below then publish what was released.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      server_released: ${{ steps.release.outputs.release_created }}
      server_tag: ${{ steps.release.outputs.tag_name }}
      server_version: ${{ steps.release.outputs.version }}
      sdk_go_released: ${{ steps.release.outputs['sdks/go--release_created'] }}
      sdk_go_tag: ${{ steps.release.outputs['sdks/go--tag_name'] }}
      sdk_go_version: ${{ steps.release.outputs['sdks/go--version'] }}
      sdk_js_released: ${{ steps.release.outputs['sdks/js--release_created'] }}
      sdk_js_tag: ${{ steps.release.outputs['sdks/js--tag_name'] }}
      sdk_js_version: ${{ steps.release.outputs['sdks/js--version'] }}
    steps:
      # A GitHub App token makes the release pull request trigger CI; without
      # the app the built-in token still works, but CI must be run by hand.
      - name: App token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  server-image:
    name: server image
    needs: release-please
    if: needs.release-please.outputs.server_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.server_tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release-please.outputs.server_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # A Go module is published by its tag alone. The SDK reports its version in
  # every User-Agent and summary envelope, so the tagged tree's Version must
  # be the tag's; release-please keeps them in step, and this proves it.
  sdk-go-version:
    name: go sdk version
    needs: release-please
    if: needs.release-please.outputs.sdk_go_released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_go_tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Version equals the tag
        working-directory: sdks/go
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_go_version }}
        run: go test -count=1 -run 'TestVersionIsTheReleasedTagsVersion$' .

  # The JavaScript SDK goes to npm through trusted publishing: npm trusts
  # this workflow, in the npm environment, by its OIDC token, so no npm
  # token is stored anywhere, and the package carries a provenance
  # attestation. npm lets a package trust a workflow only once it exists,
  # so while `flagnetic` is not on npm the job stops at a dry run, and the
  # maintainer publishes the first version by hand from the tarball it
  # keeps (CONTRIBUTING.md).
  sdk-js-npm:
    name: npm (flagnetic)
    needs: release-please
    if: needs.release-please.outputs.sdk_js_released == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_js_tag }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm with trusted publishing
        run: npm install --global npm@11
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Version equals the tag
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_js_version }}
        run: pnpm exec vitest run --project node test/version.node.test.ts
      - name: Build
        run: pnpm build
      - name: Package
        run: pnpm check:package
      - name: Pack
        id: pack
        run: echo "tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Keep the tarball
        uses: actions/upload-artifact@v7
        with:
          name: flagnetic-${{ needs.release-please.outputs.sdk_js_version }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          retention-days: 30
      - name: Publish, or a dry run before the first version
        env:
          TARBALL: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          VERSION: ${{ needs.release-please.outputs.sdk_js_version }}
        run: |
          # Only npm's answer that the package does not exist means a first
          # version; any other failure to ask fails the job.
          if found="$(npm view flagnetic name 2>&1)"; then
            npm publish "$TARBALL" --access public
            echo "Published flagnetic@$VERSION to npm with provenance." >> "$GITHUB_STEP_SUMMARY"
          elif ! grep -q E404 <<< "$found"; then
            echo "$found" >&2
            exit 1
          else
            npm publish "$TARBALL" --access public --dry-run
            {
              echo "flagnetic is not on npm yet, so nothing was published."
              echo "Publish the tarball of the artifact flagnetic-$VERSION by hand, then configure trusted publishing (CONTRIBUTING.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
