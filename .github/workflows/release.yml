name: release

# release-please keeps one release pull request open with the next versions
# and changelogs, computed from the Conventional Commits on main. Merging it
# tags the release; the jobs below then publish what was released.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      server_released: ${{ steps.release.outputs.release_created }}
      server_tag: ${{ steps.release.outputs.tag_name }}
      server_version: ${{ steps.release.outputs.version }}
      sdk_go_released: ${{ steps.release.outputs['sdks/go--release_created'] }}
      sdk_go_tag: ${{ steps.release.outputs['sdks/go--tag_name'] }}
      sdk_go_version: ${{ steps.release.outputs['sdks/go--version'] }}
      sdk_js_released: ${{ steps.release.outputs['sdks/js--release_created'] }}
      sdk_js_tag: ${{ steps.release.outputs['sdks/js--tag_name'] }}
      sdk_js_version: ${{ steps.release.outputs['sdks/js--version'] }}
      sdk_python_released: ${{ steps.release.outputs['sdks/python--release_created'] }}
      sdk_python_tag: ${{ steps.release.outputs['sdks/python--tag_name'] }}
      sdk_python_version: ${{ steps.release.outputs['sdks/python--version'] }}
      sdk_ruby_released: ${{ steps.release.outputs['sdks/ruby--release_created'] }}
      sdk_ruby_tag: ${{ steps.release.outputs['sdks/ruby--tag_name'] }}
      sdk_ruby_version: ${{ steps.release.outputs['sdks/ruby--version'] }}
      sdk_ruby_openfeature_released: ${{ steps.release.outputs['sdks/ruby-openfeature--release_created'] }}
      sdk_ruby_openfeature_tag: ${{ steps.release.outputs['sdks/ruby-openfeature--tag_name'] }}
      sdk_ruby_openfeature_version: ${{ steps.release.outputs['sdks/ruby-openfeature--version'] }}
    steps:
      # A GitHub App token makes the release pull request trigger CI; without
      # the app the built-in token still works, but CI must be run by hand.
      - name: App token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  server-image:
    name: server image
    needs: release-please
    if: needs.release-please.outputs.server_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.server_tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release-please.outputs.server_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # A Go module is published by its tag alone. The SDK reports its version in
  # every User-Agent and summary envelope, so the tagged tree's Version must
  # be the tag's; release-please keeps them in step, and this proves it.
  sdk-go-version:
    name: go sdk version
    needs: release-please
    if: needs.release-please.outputs.sdk_go_released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_go_tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Version equals the tag
        working-directory: sdks/go
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_go_version }}
        run: go test -count=1 -run 'TestVersionIsTheReleasedTagsVersion$' .

  # The JavaScript SDK goes to npm through trusted publishing: npm trusts
  # this workflow, in the npm environment, by its OIDC token, so no npm
  # token is stored anywhere, and the package carries a provenance
  # attestation. npm lets a package trust a workflow only once it exists,
  # so while `flagnetic` is not on npm the job stops at a dry run, and the
  # maintainer publishes the first version by hand from the tarball it
  # keeps (CONTRIBUTING.md).
  sdk-js-npm:
    name: npm (flagnetic)
    needs: release-please
    if: needs.release-please.outputs.sdk_js_released == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_js_tag }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm with trusted publishing
        run: npm install --global npm@11
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Version equals the tag
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_js_version }}
        run: pnpm exec vitest run --project node test/version.node.test.ts
      - name: Build
        run: pnpm build
      - name: Package
        run: pnpm check:package
      - name: Pack
        id: pack
        run: echo "tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Keep the tarball
        uses: actions/upload-artifact@v7
        with:
          name: flagnetic-${{ needs.release-please.outputs.sdk_js_version }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          retention-days: 30
      - name: Publish, or a dry run before the first version
        env:
          TARBALL: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          VERSION: ${{ needs.release-please.outputs.sdk_js_version }}
        run: |
          # Only npm's answer that the package does not exist means a first
          # version; any other failure to ask fails the job.
          if found="$(npm view flagnetic name 2>&1)"; then
            npm publish "$TARBALL" --access public
            echo "Published flagnetic@$VERSION to npm with provenance." >> "$GITHUB_STEP_SUMMARY"
          elif ! grep -q E404 <<< "$found"; then
            echo "$found" >&2
            exit 1
          else
            npm publish "$TARBALL" --access public --dry-run
            {
              echo "flagnetic is not on npm yet, so nothing was published."
              echo "Publish the tarball of the artifact flagnetic-$VERSION by hand, then configure trusted publishing (CONTRIBUTING.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The Python SDK's wheel and sdist, built from the tag and checked like
  # every pull request checks them, after the tests prove the version is the
  # tag's. Building apart from the publishing job keeps the build's tools
  # away from the job that can publish.
  sdk-python-build:
    name: python wheel and sdist
    needs: release-please
    if: needs.release-please.outputs.sdk_python_released == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_python_tag }}
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Version equals the tag
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_python_version }}
        run: |
          uv sync --locked
          uv run pytest tests/test_version.py
      - name: Build
        run: uv build
      - name: Check the metadata and the contents
        run: |
          python3 scripts/check_dist.py dist
          uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: flagnetic-python-${{ needs.release-please.outputs.sdk_python_version }}
          path: sdks/python/dist/
          retention-days: 30

  # PyPI trusts this workflow, in the pypi environment, by its OIDC token
  # (trusted publishing), so no PyPI token is stored anywhere, and each file
  # is published with an attestation. PyPI accepts the token only from a
  # top-level job of the workflow it trusts, never from a reusable one. The
  # pending publisher is configured before the first release
  # (CONTRIBUTING.md), so the first version is published here too.
  sdk-python-pypi:
    name: PyPI (flagnetic)
    needs: [release-please, sdk-python-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flagnetic-python-${{ needs.release-please.outputs.sdk_python_version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  # The Ruby gems, each built from its tag and checked like every pull
  # request checks it, after its tests prove the version is the tag's.
  # Building apart from the publishing job keeps the build's tools away from
  # the job that can publish.
  sdk-ruby-gem:
    name: ruby gem (flagnetic)
    needs: release-please
    if: needs.release-please.outputs.sdk_ruby_released == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_ruby_tag }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Version equals the tag
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_ruby_version }}
        run: bundle exec ruby -Ilib -Itest test/version_test.rb
      - name: Build and check the gem
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/check-gem.sh" . flagnetic.gemspec "$RUNNER_TEMP/gem"
      - uses: actions/upload-artifact@v7
        with:
          name: flagnetic-ruby-${{ needs.release-please.outputs.sdk_ruby_version }}
          path: ${{ runner.temp }}/gem/
          retention-days: 30

  # RubyGems trusts this workflow, in the rubygems environment, by its OIDC
  # token (trusted publishing), so no RubyGems key is stored anywhere. The
  # pending publisher is configured before the first release
  # (CONTRIBUTING.md), so the first version is published here too.
  sdk-ruby-rubygems:
    name: RubyGems (flagnetic)
    needs: [release-please, sdk-ruby-gem]
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flagnetic-ruby-${{ needs.release-please.outputs.sdk_ruby_version }}
          path: gem/
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Publish
        env:
          VERSION: ${{ needs.release-please.outputs.sdk_ruby_version }}
        run: gem push "gem/flagnetic-$VERSION.gem"

  sdk-ruby-openfeature-gem:
    name: ruby gem (flagnetic-openfeature)
    needs: release-please
    if: needs.release-please.outputs.sdk_ruby_openfeature_released == 'true'
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/sdks/ruby-openfeature/tree.gemfile
    defaults:
      run:
        working-directory: sdks/ruby-openfeature
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_ruby_openfeature_tag }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: sdks/ruby-openfeature
      - name: Version equals the tag
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_ruby_openfeature_version }}
        run: bundle exec ruby -Ilib -Itest test/version_test.rb
      - name: Build and check the gem
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/check-gem.sh" . flagnetic-openfeature.gemspec "$RUNNER_TEMP/gem"
      - uses: actions/upload-artifact@v7
        with:
          name: flagnetic-openfeature-ruby-${{ needs.release-please.outputs.sdk_ruby_openfeature_version }}
          path: ${{ runner.temp }}/gem/
          retention-days: 30

  # The provider requires a released flagnetic, so when both are released in
  # one run, flagnetic is published first; a failed flagnetic build or
  # publish holds the provider back. The build is checked as well as the
  # publish because a failed build leaves the publish skipped, the result it
  # also has when flagnetic is not released at all.
  sdk-ruby-openfeature-rubygems:
    name: RubyGems (flagnetic-openfeature)
    needs: [release-please, sdk-ruby-openfeature-gem, sdk-ruby-gem, sdk-ruby-rubygems]
    if: >-
      always() &&
      needs.sdk-ruby-openfeature-gem.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.sdk-ruby-gem.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.sdk-ruby-rubygems.result)
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flagnetic-openfeature-ruby-${{ needs.release-please.outputs.sdk_ruby_openfeature_version }}
          path: gem/
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Publish
        env:
          VERSION: ${{ needs.release-please.outputs.sdk_ruby_openfeature_version }}
        run: gem push "gem/flagnetic-openfeature-$VERSION.gem"
