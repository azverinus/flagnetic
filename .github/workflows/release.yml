name: release

# release-please keeps one release pull request open with the next versions
# and changelogs, computed from the Conventional Commits on main. Merging it
# tags the release; the jobs below then publish what was released.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      server_released: ${{ steps.release.outputs.release_created }}
      server_tag: ${{ steps.release.outputs.tag_name }}
      server_version: ${{ steps.release.outputs.version }}
      sdk_go_released: ${{ steps.release.outputs['sdks/go--release_created'] }}
      sdk_go_tag: ${{ steps.release.outputs['sdks/go--tag_name'] }}
      sdk_go_version: ${{ steps.release.outputs['sdks/go--version'] }}
      sdk_js_released: ${{ steps.release.outputs['sdks/js--release_created'] }}
      sdk_js_tag: ${{ steps.release.outputs['sdks/js--tag_name'] }}
      sdk_js_version: ${{ steps.release.outputs['sdks/js--version'] }}
      sdk_python_released: ${{ steps.release.outputs['sdks/python--release_created'] }}
      sdk_python_tag: ${{ steps.release.outputs['sdks/python--tag_name'] }}
      sdk_python_version: ${{ steps.release.outputs['sdks/python--version'] }}
      sdk_ruby_released: ${{ steps.release.outputs['sdks/ruby--release_created'] }}
      sdk_ruby_tag: ${{ steps.release.outputs['sdks/ruby--tag_name'] }}
      sdk_ruby_version: ${{ steps.release.outputs['sdks/ruby--version'] }}
      sdk_ruby_openfeature_released: ${{ steps.release.outputs['sdks/ruby-openfeature--release_created'] }}
      sdk_ruby_openfeature_tag: ${{ steps.release.outputs['sdks/ruby-openfeature--tag_name'] }}
      sdk_ruby_openfeature_version: ${{ steps.release.outputs['sdks/ruby-openfeature--version'] }}
      sdk_dart_released: ${{ steps.release.outputs['sdks/dart--release_created'] }}
      sdk_dart_tag: ${{ steps.release.outputs['sdks/dart--tag_name'] }}
      sdk_flutter_released: ${{ steps.release.outputs['sdks/flutter--release_created'] }}
      sdk_flutter_tag: ${{ steps.release.outputs['sdks/flutter--tag_name'] }}
    steps:
      # A GitHub App token makes the release pull request trigger CI; without
      # the app the built-in token still works, but CI must be run by hand.
      - name: App token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  server-image:
    name: server image
    needs: release-please
    if: needs.release-please.outputs.server_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.server_tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release-please.outputs.server_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The chart of the same version goes to GHCR after the image it installs,
  # so a chart never points at an image that is not there yet. Its
  # permissions are this job's alone: the registry write and the attestation.
  # Artifact Hub reads the repository's metadata file from the chart's
  # `artifacthub.io` tag; the one-time registration is the maintainer's
  # (CONTRIBUTING.md).
  server-chart:
    name: helm chart
    needs: [release-please, server-image]
    if: needs.release-please.outputs.server_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      CHART_REPOSITORY: oci://ghcr.io/azverinus/charts
      CHART_REF: ghcr.io/azverinus/charts/flagnetic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.server_tag }}
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.18.6
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Chart version equals the release
        env:
          VERSION: ${{ needs.release-please.outputs.server_version }}
        run: |
          chart_version="$(sed -n 's/^version: \([^ ]*\).*/\1/p' deploy/helm/flagnetic/Chart.yaml)"
          app_version="$(sed -n 's/^appVersion: "\([^"]*\)".*/\1/p' deploy/helm/flagnetic/Chart.yaml)"
          if [ "$chart_version" != "$VERSION" ] || [ "$app_version" != "$VERSION" ]; then
            echo "Chart.yaml has version $chart_version and appVersion $app_version; the release is $VERSION." >&2
            exit 1
          fi
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login "$REGISTRY" --username "$ACTOR" --password-stdin <<< "$TOKEN"
          oras login "$REGISTRY" --username "$ACTOR" --password-stdin <<< "$TOKEN"
      - name: Package
        run: helm package deploy/helm/flagnetic --destination "$RUNNER_TEMP/chart"
      - name: Push
        id: push
        run: |
          # tee keeps helm's own error in the log when the push fails, and
          # pipefail still fails the step then.
          set -o pipefail
          helm push "$RUNNER_TEMP"/chart/flagnetic-*.tgz "$CHART_REPOSITORY" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/push.log")"
          if [ -z "$digest" ]; then
            echo "helm push printed no digest." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.CHART_REF }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Artifact Hub metadata
        working-directory: deploy/helm
        run: |
          oras push "$CHART_REF:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Summary
        env:
          VERSION: ${{ needs.release-please.outputs.server_version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Pushed $CHART_REF:$VERSION ($DIGEST) with a build attestation." >> "$GITHUB_STEP_SUMMARY"

  # A Go module is published by its tag alone. The SDK reports its version in
  # every User-Agent and summary envelope, so the tagged tree's Version must
  # be the tag's; release-please keeps them in step, and this proves it.
  sdk-go-version:
    name: go sdk version
    needs: release-please
    if: needs.release-please.outputs.sdk_go_released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_go_tag }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
      - name: Version equals the tag
        working-directory: sdks/go
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_go_version }}
        run: go test -count=1 -run 'TestVersionIsTheReleasedTagsVersion$' .

  # The JavaScript SDK goes to npm through trusted publishing: npm trusts
  # this workflow, in the npm environment, by its OIDC token, so no npm
  # token is stored anywhere, and the package carries a provenance
  # attestation. npm lets a package trust a workflow only once it exists,
  # so while `flagnetic` is not on npm the job stops at a dry run, and the
  # maintainer publishes the first version by hand from the tarball it
  # keeps (CONTRIBUTING.md).
  sdk-js-npm:
    name: npm (flagnetic)
    needs: release-please
    if: needs.release-please.outputs.sdk_js_released == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_js_tag }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm with trusted publishing
        run: npm install --global npm@11
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Version equals the tag
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_js_version }}
        run: pnpm exec vitest run --project node test/version.node.test.ts
      - name: Build
        run: pnpm build
      - name: Package
        run: pnpm check:package
      - name: Pack
        id: pack
        run: echo "tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Keep the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flagnetic-${{ needs.release-please.outputs.sdk_js_version }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          retention-days: 30
      - name: Publish, or a dry run before the first version
        env:
          TARBALL: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          VERSION: ${{ needs.release-please.outputs.sdk_js_version }}
        run: |
          # Only npm's answer that the package does not exist means a first
          # version; any other failure to ask fails the job.
          if found="$(npm view flagnetic name 2>&1)"; then
            npm publish "$TARBALL" --access public
            echo "Published flagnetic@$VERSION to npm with provenance." >> "$GITHUB_STEP_SUMMARY"
          elif ! grep -q E404 <<< "$found"; then
            echo "$found" >&2
            exit 1
          else
            npm publish "$TARBALL" --access public --dry-run
            {
              echo "flagnetic is not on npm yet, so nothing was published."
              echo "Publish the tarball of the artifact flagnetic-$VERSION by hand, then configure trusted publishing (CONTRIBUTING.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The Python SDK's wheel and sdist, built from the tag and checked like
  # every pull request checks them, after the tests prove the version is the
  # tag's. Building apart from the publishing job keeps the build's tools
  # away from the job that can publish.
  sdk-python-build:
    name: python wheel and sdist
    needs: release-please
    if: needs.release-please.outputs.sdk_python_released == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_python_tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Version equals the tag
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_python_version }}
        run: |
          uv sync --locked
          uv run pytest tests/test_version.py
      - name: Build
        run: uv build
      - name: Check the metadata and the contents
        run: |
          python3 scripts/check_dist.py dist
          uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flagnetic-python-${{ needs.release-please.outputs.sdk_python_version }}
          path: sdks/python/dist/
          retention-days: 30

  # PyPI trusts this workflow, in the pypi environment, by its OIDC token
  # (trusted publishing), so no PyPI token is stored anywhere, and each file
  # is published with an attestation. PyPI accepts the token only from a
  # top-level job of the workflow it trusts, never from a reusable one. The
  # pending publisher is configured before the first release
  # (CONTRIBUTING.md), so the first version is published here too.
  sdk-python-pypi:
    name: PyPI (flagnetic)
    needs: [release-please, sdk-python-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: flagnetic-python-${{ needs.release-please.outputs.sdk_python_version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  # The Ruby gems, each built from its tag and checked like every pull
  # request checks it, after its tests prove the version is the tag's.
  # Building apart from the publishing job keeps the build's tools away from
  # the job that can publish.
  sdk-ruby-gem:
    name: ruby gem (flagnetic)
    needs: release-please
    if: needs.release-please.outputs.sdk_ruby_released == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_ruby_tag }}
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Version equals the tag
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_ruby_version }}
        run: bundle exec ruby -Ilib -Itest test/version_test.rb
      - name: Build and check the gem
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/check-gem.sh" . flagnetic.gemspec "$RUNNER_TEMP/gem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flagnetic-ruby-${{ needs.release-please.outputs.sdk_ruby_version }}
          path: ${{ runner.temp }}/gem/
          retention-days: 30

  # RubyGems trusts this workflow, in the rubygems environment, by its OIDC
  # token (trusted publishing), so no RubyGems key is stored anywhere, and
  # the gem is pushed with a sigstore attestation. The
  # pending publisher is configured before the first release
  # (CONTRIBUTING.md), so the first version is published here too.
  sdk-ruby-rubygems:
    name: RubyGems (flagnetic)
    needs: [release-please, sdk-ruby-gem]
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: flagnetic-ruby-${{ needs.release-please.outputs.sdk_ruby_version }}
          path: gem/
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "4.0"
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish
        env:
          VERSION: ${{ needs.release-please.outputs.sdk_ruby_version }}
        run: |
          # The attestation is signed with this job's OIDC identity, so the
          # gem page and `gem push` tie the file to this workflow.
          gem exec sigstore-cli:0.2.1 sign "gem/flagnetic-$VERSION.gem" --bundle "$RUNNER_TEMP/flagnetic.sigstore.json"
          gem push "gem/flagnetic-$VERSION.gem" --attestation "$RUNNER_TEMP/flagnetic.sigstore.json"

  sdk-ruby-openfeature-gem:
    name: ruby gem (flagnetic-openfeature)
    needs: release-please
    if: needs.release-please.outputs.sdk_ruby_openfeature_released == 'true'
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/sdks/ruby-openfeature/tree.gemfile
    defaults:
      run:
        working-directory: sdks/ruby-openfeature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sdk_ruby_openfeature_tag }}
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: sdks/ruby-openfeature
      - name: Version equals the tag
        env:
          FLAGNETIC_RELEASE_VERSION: ${{ needs.release-please.outputs.sdk_ruby_openfeature_version }}
        run: bundle exec ruby -Ilib -Itest test/version_test.rb
      - name: Build and check the gem
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/check-gem.sh" . flagnetic-openfeature.gemspec "$RUNNER_TEMP/gem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flagnetic-openfeature-ruby-${{ needs.release-please.outputs.sdk_ruby_openfeature_version }}
          path: ${{ runner.temp }}/gem/
          retention-days: 30

  # The provider requires a released flagnetic, so when both are released in
  # one run, flagnetic is published first; a failed flagnetic build or
  # publish holds the provider back. The build is checked as well as the
  # publish because a failed build leaves the publish skipped, the result it
  # also has when flagnetic is not released at all.
  sdk-ruby-openfeature-rubygems:
    name: RubyGems (flagnetic-openfeature)
    needs: [release-please, sdk-ruby-openfeature-gem, sdk-ruby-gem, sdk-ruby-rubygems]
    if: >-
      always() &&
      needs.sdk-ruby-openfeature-gem.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.sdk-ruby-gem.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.sdk-ruby-rubygems.result)
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: flagnetic-openfeature-ruby-${{ needs.release-please.outputs.sdk_ruby_openfeature_version }}
          path: gem/
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "4.0"
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish
        env:
          VERSION: ${{ needs.release-please.outputs.sdk_ruby_openfeature_version }}
        run: |
          gem exec sigstore-cli:0.2.1 sign "gem/flagnetic-openfeature-$VERSION.gem" --bundle "$RUNNER_TEMP/flagnetic-openfeature.sigstore.json"
          gem push "gem/flagnetic-openfeature-$VERSION.gem" --attestation "$RUNNER_TEMP/flagnetic-openfeature.sigstore.json"

  # pub.dev accepts a publish only from a run started by a tag push or by
  # workflow_dispatch on the tag, and the tags release-please creates start
  # no workflow, so this dispatches publish-dart.yml on each released pub
  # package's tag. That workflow checks and publishes the package, or stops
  # at a dry run before its first version (CONTRIBUTING.md).
  sdk-dart-pub-dev:
    name: pub.dev (dispatch)
    needs: release-please
    if: >-
      needs.release-please.outputs.sdk_dart_released == 'true' ||
      needs.release-please.outputs.sdk_flutter_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch publish-dart.yml on flagnetic's tag
        if: needs.release-please.outputs.sdk_dart_released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.sdk_dart_tag }}
        run: gh workflow run publish-dart.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
      - name: Dispatch publish-dart.yml on flagnetic_flutter's tag
        if: needs.release-please.outputs.sdk_flutter_released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.sdk_flutter_tag }}
        run: gh workflow run publish-dart.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
