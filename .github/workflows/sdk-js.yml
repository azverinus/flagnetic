name: sdk-js

# The JavaScript SDK: lint, types, the evaluator against the conformance
# suite on the supported Node releases and in a browser, the evaluation
# budget, the browser client in Chromium, Firefox and WebKit, and the built
# package with its size budget. ci.yml calls it when the SDK, the
# conformance suite, the SDK protocol or this workflow changes.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: sdks/js

jobs:
  # The package as a consumer gets it, and what only needs checking once.
  package:
    name: lint, types and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdks/js/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unicode tables are what Go generates
        run: pnpm check:unicode
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Package (entry points in ESM and CJS, types, no dependencies, publint)
        run: pnpm check:package
      - name: Size budget of flagnetic/client
        run: pnpm check:size
      # Last step: it removes the optional peers from node_modules. The
      # entry points must still load and the types still resolve without them.
      - name: Package again without the optional peers
        run: |
          rm -rf node_modules/react node_modules/react-dom node_modules/@openfeature
          pnpm check:package

  # The evaluator on every supported Node release.
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: sdks/js/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Conformance suite and unit tests
        env:
          FLAGNETIC_SCENARIO_REPORT: ${{ runner.temp }}/scenarios.json
        run: pnpm test
      - name: Behaviour matrix
        # The JavaScript column of docs/sdks/behaviour-matrix.md is what the
        # protocol runners report as passed in the run above; the server
        # mode and the browser client run in Node alike.
        if: matrix.node == 24
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/behaviour-matrix.sh" JavaScript "$RUNNER_TEMP/scenarios.json"
          git diff --exit-code -- "$GITHUB_WORKSPACE/docs/sdks/behaviour-matrix.md"
      # Timed alone: the other tests running beside it would distort it.
      - name: Evaluation p99 over 1,000 flags
        run: pnpm test:p99

  # The Playwright version the lockfile resolves, for the image the browser
  # jobs run in.
  playwright:
    name: playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            sdks/js/pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$("$GITHUB_WORKSPACE/.github/scripts/playwright-version.sh" pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"

  # The same suite in a browser, with the fixtures bundled: the evaluator's
  # conformance and the browser client's unit and protocol tests. The
  # Playwright image carries the browsers and their system libraries, so
  # nothing is downloaded or installed through apt.
  browser:
    name: browser (chromium)
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdks/js/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Conformance suite in Chromium
        run: pnpm test:browser

  # The browser client against a server on another origin, and the React
  # bindings mounting and hydrating, in each engine.
  browsers:
    name: browser client (${{ matrix.browser }})
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdks/js/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Browser client cross-origin, React in the DOM
        run: pnpm test:browsers
        env:
          FLAGNETIC_BROWSERS: ${{ matrix.browser }}
          # Firefox refuses to start as root under a home directory root does
          # not own, which the runner's /github/home is. The runner sets HOME
          # for every step, so it is overridden here rather than on the
          # container.
          HOME: /root
