name: ci

# A run checks what its change can break and nothing else. The `plan` job
# decides that from the changed paths with .github/scripts/ci-plan.sh, the
# script `task pr:check` reads too, and every other job runs when the plan
# asks for it. A pull request is checked against its own paths; main runs
# everything when the server or the console changed, and nightly always.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Everything, so a change that broke a check its paths do not ask for is
    # found within a day.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: golangci-lint
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0

  # The server's tests, under the race detector, in the jobs the plan splits
  # them into: the packages that take minutes each have jobs of their own.
  # A pull request runs the tests its change can reach, on the oldest
  # supported PostgreSQL; main and the nightly run add the newest, so a
  # feature newer than the minimum cannot slip in and neither can a
  # behaviour the newest release changed.
  test:
    name: go test (${{ matrix.shard.id }}, postgres ${{ matrix.postgres }})
    needs: plan
    if: needs.plan.outputs.test_shards != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.plan.outputs.postgres) }}
        shard: ${{ fromJSON(needs.plan.outputs.test_shards) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: flagnetic
          POSTGRES_USER: flagnetic
          POSTGRES_PASSWORD: flagnetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagnetic -d flagnetic"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://flagnetic:flagnetic@localhost:5432/flagnetic?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Test with the race detector
        env:
          PACKAGES: ${{ matrix.shard.packages }}
          FLAGS: ${{ matrix.shard.flags }}
          COVER: ${{ needs.plan.outputs.cover_packages }}
        run: |
          # shellcheck disable=SC2086
          go test -race -timeout 20m ${COVER:+-coverpkg="$COVER" -coverprofile=coverage.out} $FLAGS $PACKAGES
      # One PostgreSQL is enough for coverage: the first of the plan's list.
      - name: Keep the coverage profile
        if: needs.plan.outputs.cover_packages != '' && matrix.postgres == fromJSON(needs.plan.outputs.postgres)[0]
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.shard.id }}
          path: coverage.out
          retention-days: 1
          # A job run again replaces the profile of its earlier attempt.
          overwrite: true

  # The coverage floors, over the profiles of the test jobs put together: a
  # package is covered by the tests of the packages that depend on it, which
  # run in other jobs than its own.
  coverage:
    name: coverage floors
    needs: [plan, test]
    if: needs.plan.outputs.cover_packages != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-*
          path: profiles
      - name: One profile from the test jobs
        run: |
          # A block is listed once per test binary; its count is their sum.
          {
            echo "mode: atomic"
            cat profiles/*/coverage.out |
              awk '!/^mode:/ { n[$1 " " $2] += $3 } END { for (b in n) print b, n[b] }' | sort
          } > coverage.out
      - name: Coverage by layer
        run: |
          {
            echo "### Go coverage"
            .github/scripts/coverage-by-layer.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage floors
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.19.0 --config=.testcoverage.yml

  vuln:
    name: govulncheck
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Scan reachable code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The npm lockfiles, development dependencies included: the code
  # generators and test runners there execute on developer machines and in
  # CI. Unlike govulncheck this cannot tell reachable code from the rest,
  # so it fails on high and critical advisories only. It runs on every pull
  # request and nightly, as an advisory can appear without a change here.
  npm-audit:
    name: pnpm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [web, sdks/js]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: ${{ matrix.dir }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: No high or critical advisories
        run: pnpm audit --audit-level high

  tidy:
    name: go mod tidy and generate
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code

  # The console: the client generated from the management API is current,
  # the code typechecks, lints and tests, every string is translated and
  # the catalogs are what extraction gives, and it builds.
  console:
    name: console
    needs: plan
    if: needs.plan.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: |
          pnpm generate
          git diff --exit-code -- packages/api/src
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Test
        run: pnpm test
      - name: Catalogs are extracted and complete
        run: pnpm i18n:check
      - name: Build
        run: pnpm build

  # What this run checks. A pull request is compared with its base. A push
  # to main is compared with the last commit of main whose run passed, not
  # with the commit before it: a run that failed or was superseded leaves
  # its changes to the next one, so nothing reaches main unchecked. Every
  # other event, and a push with no earlier run to compare with, checks
  # everything.
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.plan.outputs.go }}
      server: ${{ steps.plan.outputs.server }}
      console: ${{ steps.plan.outputs.console }}
      console_e2e: ${{ steps.plan.outputs.console_e2e }}
      docker: ${{ steps.plan.outputs.docker }}
      sdk_e2e: ${{ steps.plan.outputs.sdk_e2e }}
      sdk_js: ${{ steps.plan.outputs.sdk_js }}
      sdk_python: ${{ steps.plan.outputs.sdk_python }}
      sdk_ruby: ${{ steps.plan.outputs.sdk_ruby }}
      dart: ${{ steps.plan.outputs.dart }}
      flutter: ${{ steps.plan.outputs.flutter }}
      workflows: ${{ steps.plan.outputs.workflows }}
      migrations: ${{ steps.plan.outputs.migrations }}
      helm: ${{ steps.plan.outputs.helm }}
      load: ${{ steps.plan.outputs.load }}
      upgrade: ${{ steps.plan.outputs.upgrade }}
      upgrade_gate: ${{ steps.gate.outputs.upgrade_gate }}
      modules: ${{ steps.plan.outputs.modules }}
      test_shards: ${{ steps.plan.outputs.test_shards }}
      cover_packages: ${{ steps.plan.outputs.cover_packages }}
      postgres: ${{ steps.plan.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$EVENT" in
            pull_request)
              set -- --mode pr --base "$BASE" --head-ref "$HEAD_REF" ;;
            push)
              green="$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)"
              if [ -n "$green" ]; then set -- --mode main --base "$green"; else set -- --mode full; fi ;;
            *)
              set -- --mode full ;;
          esac
          echo "ci-plan.sh $*"
          .github/scripts/ci-plan.sh "$@" > "$RUNNER_TEMP/plan"
          # Its last line: without it the plan is not whole, and the jobs
          # it would have named must not be taken for unneeded.
          grep -q '^postgres=\[' "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan (\`ci-plan.sh $*\`)"
            echo '```'
            cat "$RUNNER_TEMP/plan"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The rolling-upgrade test only reports until the server has released
      # v1.0.0, since 0.x promised nothing across versions; the tag turns the
      # gate on with no edit here.
      - id: gate
        run: |
          if git tag --list v1.0.0 | grep -q .; then gate=true; else gate=false; fi
          echo "upgrade_gate=$gate" >> "$GITHUB_OUTPUT"

  # The console end to end: on a pull request that touches the console, its
  # handlers or the suite; a change to the server behind it meets the suite
  # on main, on the server's release pull request and nightly. Playwright builds the binary
  # with the console embedded, runs it against PostgreSQL under the test
  # clock, and drives it in Chromium. It runs on the runner itself, not in a
  # container: the identity providers the specs sign in through (Dex) are
  # started by the harness with Docker on a loopback address, which is the
  # only place the instance accepts an http issuer, so they must share the
  # network of the instance and the browser.
  #
  # The specs run one after another against one instance, so the suite is
  # split by file over several jobs, each with an instance of its own.
  e2e:
    name: console end to end (${{ matrix.shard }}/3)
    needs: plan
    if: needs.plan.outputs.console_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flagnetic
          POSTGRES_USER: flagnetic
          POSTGRES_PASSWORD: flagnetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagnetic -d flagnetic"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://flagnetic:flagnetic@localhost:5432/flagnetic?sslmode=disable
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm e2e:install
      - name: Run the suite
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @flagnetic/e2e exec playwright test --shard="$SHARD/3"
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/e2e/playwright-report
          retention-days: 7

  # The Ruby gems: rubocop, the tests on every supported Ruby with the
  # conformance suite, the Unicode tables compared with Go's, and the
  # OpenFeature provider against the working tree and the released core,
  # when either gem, the conformance suite, the SDK contract or its workflow
  # changes.
  sdk-ruby:
    name: Ruby SDK
    needs: plan
    if: needs.plan.outputs.sdk_ruby == 'true'
    uses: ./.github/workflows/sdk-ruby.yml

  # The Python SDK, when it or the conformance suite changes.
  sdk-python:
    name: Python SDK
    needs: plan
    if: needs.plan.outputs.sdk_python == 'true'
    uses: ./.github/workflows/sdk-python.yml

  workflows:
    name: actionlint
    needs: plan
    if: needs.plan.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: ci-ok needs every job
        run: .github/scripts/check-ci-ok.sh

  docker:
    name: docker build
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: VERSION=ci

  # The Go modules of go.work besides the root one (the evaluator and the
  # SDKs) that the change affects: a module joins CI through its `use` line
  # alone. The end-to-end harness is left out: it is published nowhere,
  # builds the server, and runs in the sdk-e2e job.
  #
  # Each module is published on its own and promises to build with the oldest
  # Go release still supported, so it is checked on that release and on the
  # newest one, with the toolchain held to the one installed. The modules
  # resolve each other through a workspace of their own: the committed go.work
  # also holds the server, whose newer Go would refuse the oldest release.
  module:
    name: module ${{ matrix.dir }} (go ${{ matrix.go }})
    needs: plan
    if: needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.plan.outputs.modules) }}
        go: [oldstable, stable]
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.dir }}/go.mod
      - name: Workspace of the published modules
        working-directory: .
        run: |
          echo "GOWORK=$RUNNER_TEMP/go.work" >> "$GITHUB_ENV"
          export GOWORK="$RUNNER_TEMP/go.work"
          go work init
          # Every published module, not only the ones this run tests: they
          # require each other.
          for dir in $(go work edit -json "$GITHUB_WORKSPACE/go.work" | jq -r '.Use[].DiskPath | ltrimstr("./") | select(. != "." and . != "e2e")'); do
            go work use "$GITHUB_WORKSPACE/$dir"
          done
          # As in the committed go.work: v0.0.0, the version required before
          # a first release, resolves to the module's directory.
          go work edit -json "$GITHUB_WORKSPACE/go.work" |
            jq -r '.Replace[]? | select(.Old.Version == "v0.0.0") | "\(.Old.Path) \(.New.Path)"' |
            while read -r path target; do
              go work edit -replace="$path@v0.0.0=$GITHUB_WORKSPACE/${target#./}"
            done
          cat "$GOWORK"
      - name: go.mod is tidy
        run: '"$GITHUB_WORKSPACE/.github/scripts/check-tidy.sh" .'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.dir }}
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: Test with the race detector
        env:
          FLAGNETIC_SCENARIO_REPORT: ${{ runner.temp }}/scenarios.json
        # -count=1: the behaviour matrix below reads the report the tests
        # write, which a cached result would not write again.
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Behaviour matrix
        # The Go column of docs/sdks/behaviour-matrix.md is what the
        # protocol runners report as passed in the run above.
        if: matrix.dir == 'sdks/go'
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/behaviour-matrix.sh" Go "$RUNNER_TEMP/scenarios.json"
          git diff --exit-code -- "$GITHUB_WORKSPACE/docs/sdks/behaviour-matrix.md"
      - name: Coverage floors
        env:
          MODULE: ${{ matrix.dir }}
          GO: ${{ matrix.go }}
        run: |
          set -o pipefail
          {
            echo "### Coverage of $MODULE (go $GO)"
            "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" "$MODULE" coverage.out "$GITHUB_WORKSPACE/.github/coverage-floors"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Kill-switch propagation
        # The Go SDK promises that a kill switch reaches the change
        # callback within two seconds; the measured time goes next to it.
        if: matrix.dir == 'sdks/go'
        env:
          GO: ${{ matrix.go }}
        run: |
          set -o pipefail
          go test -count=1 -v -run 'TestEventAboveTheHeldVersionReachesTheChangeCallbackWithinTwoSeconds$' . |
            tee /dev/stderr | grep -o 'kill_switch_propagation_ms=[0-9]*' |
            sed "s/kill_switch_propagation_ms=/Kill-switch propagation (go $GO): /; s/\$/ ms (target 2000 ms)/" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluation p99
        # The race detector distorts timing, so the guarantee that an
        # evaluation stays under 1 ms at p99 is measured without it; the
        # test writes the numbers to the job summary.
        if: matrix.dir == 'sdks/go'
        run: go test -count=1 -run 'TestEvaluationStaysUnderAMillisecondAtP99$' .
      - name: Scan reachable code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # What go get gives a consumer: each published module built and tested
  # outside the workspace against the versions its go.mod requires. Skipped
  # while it requires a module of this repository at v0.0.0, and failing
  # when that skip would hide a broken release.
  released:
    name: released requirements ${{ matrix.dir }}
    needs: plan
    if: needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.plan.outputs.modules) }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: oldstable
          cache-dependency-path: ${{ matrix.dir }}/go.mod
      - name: Build and test against the released requirements
        run: .github/scripts/check-released-requirements.sh "$DIR"
        env:
          DIR: ${{ matrix.dir }}

  # The SDK end to end, when the server, a Go module, an SDK or the harness
  # changes: the real binary built from the checkout, two replicas on one
  # PostgreSQL, a project seeded through the management API, and the Go SDK
  # and its OpenFeature provider run against them; the kill-switch
  # propagation it measures goes to the job summary. The harness module is
  # linted, tidied and scanned here, since the module matrix leaves it out.
  # The harness and the Go SDK on every run; each other SDK's smoke against
  # the replicas `flagnetic-e2e up` brings up, when its paths changed.
  sdk-e2e:
    name: SDK end to end
    needs: plan
    if: needs.plan.outputs.sdk_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flagnetic
          POSTGRES_USER: flagnetic
          POSTGRES_PASSWORD: flagnetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagnetic -d flagnetic"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://flagnetic:flagnetic@localhost:5432/flagnetic?sslmode=disable
      FLAGNETIC_E2E: "1"
      RUBY_SMOKE: ${{ needs.plan.outputs.sdk_ruby }}
      SDK_JS: ${{ needs.plan.outputs.sdk_js }}
      SDK_PYTHON: ${{ needs.plan.outputs.sdk_python }}
      SDK_DART: ${{ needs.plan.outputs.dart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
      - name: go.mod is tidy
        run: .github/scripts/check-tidy.sh e2e
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          working-directory: e2e
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: Scan reachable code
        working-directory: e2e
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Run the harness and the Go SDK against two replicas
        working-directory: e2e
        run: go test -count=1 -v ./...
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        if: env.RUBY_SMOKE == 'true'
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Ruby SDK smoke against two replicas
        if: env.RUBY_SMOKE == 'true'
        run: |
          go build -o "$RUNNER_TEMP/flagnetic-e2e" ./e2e/cmd/flagnetic-e2e
          export FLAGNETIC_E2E_SEED="$RUNNER_TEMP/seed.json" FLAGNETIC_E2E_COMMAND="$RUNNER_TEMP/flagnetic-e2e"
          "$FLAGNETIC_E2E_COMMAND" up > "$RUNNER_TEMP/up.log" 2>&1 &
          up=$!
          trap 'kill "$up"; wait "$up" || true' EXIT
          for _ in $(seq 180); do
            [[ -s "$FLAGNETIC_E2E_SEED" ]] && break
            kill -0 "$up" 2>/dev/null || { cat "$RUNNER_TEMP/up.log"; exit 1; }
            sleep 1
          done
          [[ -s "$FLAGNETIC_E2E_SEED" ]] || { echo "no seed after 180 s"; cat "$RUNNER_TEMP/up.log"; exit 1; }
          (cd sdks/ruby && bundle exec rake e2e) || { cat "$RUNNER_TEMP/up.log"; exit 1; }
      # `up` seeds the same database again with new keys, revoking the
      # earlier ones, and serves until the job ends.
      - name: Bring up two replicas for the JavaScript SDK
        if: env.SDK_JS == 'true'
        run: |
          go build -o "$RUNNER_TEMP/flagnetic-e2e" ./e2e/cmd/flagnetic-e2e
          {
            echo "FLAGNETIC_E2E_CMD=$RUNNER_TEMP/flagnetic-e2e"
            echo "FLAGNETIC_E2E_SEED=$RUNNER_TEMP/seed.json"
            echo "FLAGNETIC_E2E_LOGS=$RUNNER_TEMP/replicas.log"
          } >> "$GITHUB_ENV"
          export FLAGNETIC_E2E_SEED="$RUNNER_TEMP/seed.json" FLAGNETIC_E2E_LOGS="$RUNNER_TEMP/replicas.log"
          nohup "$RUNNER_TEMP/flagnetic-e2e" up > "$RUNNER_TEMP/up.log" 2>&1 &
          for _ in $(seq 150); do
            [ -s "$FLAGNETIC_E2E_SEED" ] && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/up.log"
          exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        if: env.SDK_JS == 'true'
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: env.SDK_JS == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdks/js/pnpm-lock.yaml
      - name: Install the JavaScript SDK
        if: env.SDK_JS == 'true'
        working-directory: sdks/js
        run: pnpm install --frozen-lockfile
      # The browser smoke runs in the Chrome the runner image already has:
      # this job runs on the runner itself, beside the replicas, so it cannot
      # take the Playwright image, and installing Playwright's Chromium pulls
      # its system libraries through apt.
      - name: Run the JavaScript SDK in Node and in Chrome against two replicas
        if: env.SDK_JS == 'true'
        working-directory: sdks/js
        env:
          FLAGNETIC_BROWSER_CHANNEL: chrome
        run: |
          set -o pipefail
          pnpm test:e2e | tee "$RUNNER_TEMP/smoke.log"
          {
            echo "Kill-switch propagation of the JavaScript server mode (target 2000 ms):"
            # Not anchored: vitest colours its output in CI, so the line
            # starts with escape sequences.
            grep -o '{"sdk":"flagnetic-js","kill_switch_ms":-\?[0-9]*}' "$RUNNER_TEMP/smoke.log"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: env.SDK_PYTHON == 'true'
        with:
          python-version: 3.x
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: env.SDK_PYTHON == 'true'
      # Its own `up`, seeded again with new keys: the smokes before it end
      # by revoking theirs. The smoke writes its kill-switch line to the job
      # summary itself.
      - name: Python SDK smoke against two replicas
        if: env.SDK_PYTHON == 'true'
        run: |
          go build -o "$RUNNER_TEMP/flagnetic-e2e" ./e2e/cmd/flagnetic-e2e
          export FLAGNETIC_E2E_SEED="$RUNNER_TEMP/seed-python.json" FLAGNETIC_E2E_CMD="$RUNNER_TEMP/flagnetic-e2e"
          export FLAGNETIC_E2E_LOGS="$RUNNER_TEMP/replicas-python.log"
          "$FLAGNETIC_E2E_CMD" up > "$RUNNER_TEMP/up-python.log" 2>&1 &
          up=$!
          trap 'kill "$up"; wait "$up" || true' EXIT
          for _ in $(seq 180); do
            [[ -s "$FLAGNETIC_E2E_SEED" ]] && break
            kill -0 "$up" 2>/dev/null || { cat "$RUNNER_TEMP/up-python.log"; exit 1; }
            sleep 1
          done
          [[ -s "$FLAGNETIC_E2E_SEED" ]] || { echo "no seed after 180 s"; cat "$RUNNER_TEMP/up-python.log"; exit 1; }
          cd sdks/python
          uv sync --locked --python "$(command -v python)"
          uv run pytest e2e || { cat "$RUNNER_TEMP/up-python.log"; exit 1; }
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        if: env.SDK_DART == 'true'
        with:
          sdk: stable
      # Its own `up`, seeded again with new keys: the smokes before it end
      # by revoking theirs. The smoke writes its kill-switch percentile and
      # the evaluate burst of one change to the job summary itself.
      - name: Dart SDK smoke against two replicas
        if: env.SDK_DART == 'true'
        run: |
          go build -o "$RUNNER_TEMP/flagnetic-e2e" ./e2e/cmd/flagnetic-e2e
          export FLAGNETIC_E2E_SEED="$RUNNER_TEMP/seed-dart.json" FLAGNETIC_E2E_CMD="$RUNNER_TEMP/flagnetic-e2e"
          export FLAGNETIC_E2E_LOGS="$RUNNER_TEMP/replicas-dart.log"
          "$FLAGNETIC_E2E_CMD" up > "$RUNNER_TEMP/up-dart.log" 2>&1 &
          up=$!
          trap 'kill "$up"; wait "$up" || true' EXIT
          for _ in $(seq 180); do
            [[ -s "$FLAGNETIC_E2E_SEED" ]] && break
            kill -0 "$up" 2>/dev/null || { cat "$RUNNER_TEMP/up-dart.log"; exit 1; }
            sleep 1
          done
          [[ -s "$FLAGNETIC_E2E_SEED" ]] || { echo "no seed after 180 s"; cat "$RUNNER_TEMP/up-dart.log"; exit 1; }
          cd sdks/dart
          dart pub get
          echo "Kill-switch propagation of the Dart client mode (target 5000 ms at the 99th percentile) and the evaluates of one change:" >> "$GITHUB_STEP_SUMMARY"
          dart test -r expanded test/e2e_test.dart || { cat "$RUNNER_TEMP/up-dart.log"; exit 1; }
      - name: Keep the replicas' log
        if: failure() && (env.SDK_JS == 'true' || env.SDK_PYTHON == 'true' || env.SDK_DART == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk-e2e-replicas
          path: |
            ${{ runner.temp }}/replicas*.log
            ${{ runner.temp }}/up*.log
          retention-days: 7

  # The Dart SDK and the Flutter package, when what they are tested against
  # changes. The Flutter package resolves the Dart SDK from the working tree,
  # so a change to either one tests it.
  dart:
    name: dart
    needs: plan
    if: needs.plan.outputs.dart == 'true'
    uses: ./.github/workflows/sdk-dart.yml

  flutter:
    name: flutter
    needs: plan
    if: needs.plan.outputs.flutter == 'true'
    uses: ./.github/workflows/sdk-flutter.yml

  # The JavaScript SDK, when it, the conformance suite or the SDK API changes.
  sdk-js:
    name: sdk-js
    needs: plan
    if: needs.plan.outputs.sdk_js == 'true'
    uses: ./.github/workflows/sdk-js.yml

  # The migrations a pull request adds, linted with squawk so that a replica of
  # the previous minor keeps working against the new schema (expand/contract:
  # no rename, no drop, no blocking index, no NOT NULL without a default).
  # Released migrations are not linted. Other events only prove that the
  # rules still catch each deliberately bad fixture, which is the case after a
  # change to the rules or to the pinned squawk.
  migrations:
    name: migration lint
    needs: plan
    if: needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install squawk
        run: |
          .github/scripts/install-squawk.sh "$RUNNER_TEMP/squawk"
          echo "$RUNNER_TEMP/squawk" >> "$GITHUB_PATH"
      - name: The rules catch the bad fixtures
        run: .github/scripts/lint-migrations.sh --self-test
      - name: Lint the migrations the pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/lint-migrations.sh --base "$BASE"

  # The chart is checked without a cluster (lint, unit tests, kubeconform) with
  # the oldest and the newest Helm it supports, then installed in kind against
  # a test-only PostgreSQL: once with the migration hook, and with each of the
  # other migration modes.
  helm:
    name: helm chart (helm ${{ matrix.helm }})
    needs: plan
    if: needs.plan.outputs.helm == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.18.6, v4.3.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ matrix.helm }}
      - name: Install helm-unittest and kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          UNITTEST_VERSION: v1.2.1
        run: |
          # Helm 4 verifies plugin signatures and the plugin ships none; Helm 3
          # has no such flag and refuses an unknown one.
          verify=()
          case "$(helm version --short)" in v4*) verify=(--verify=false) ;; esac
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$UNITTEST_VERSION" "${verify[@]}"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint, unit tests and kubeconform
        run: .github/scripts/check-helm.sh
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: ct lint
        run: ct lint --config .github/ct.yaml --all
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          # The oldest Kubernetes minor the chart supports.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
      - name: PostgreSQL for the install
        run: |
          kubectl apply -f deploy/helm/test/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=120s
      # The chart's appVersion is the last release, whose image is published;
      # ct installs the chart once per ci/*-values.yaml file and runs helm test.
      - name: ct install
        run: ct install --config .github/ct.yaml --all

  # The SDK API's latency under load: two replicas of the real binary on
  # PostgreSQL 18, a project of 1,000 flags, and requests sent on a fixed
  # schedule (an open model, latency measured from the scheduled time) for
  # remote evaluation, the ruleset, events and a change's arrival on the
  # stream. The job fails when a scenario's p99 is above its ceiling in
  # e2e/load/profile.json, which are generous absolute numbers: a hosted
  # runner varies by more than a few percent, so this catches a regression of
  # a multiple. The numbers go to the job summary. It runs nightly, on the
  # server's release pull request and on pull requests and pushes to main
  # touching the SDK API.
  load:
    name: SDK API load
    needs: plan
    if: needs.plan.outputs.load == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flagnetic
          POSTGRES_USER: flagnetic
          POSTGRES_PASSWORD: flagnetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagnetic -d flagnetic"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://flagnetic:flagnetic@localhost:5432/flagnetic?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
      - name: Measure the SDK API against two replicas
        run: .github/scripts/load.sh

  # A rolling upgrade, as an operator does it: the head chart is installed in
  # kind with the image of the last server release, the instance is seeded
  # through the management API, and `helm upgrade` moves it to the image built
  # from this checkout while light SDK load and a streaming Go SDK are on it.
  # It fails on a failed migration hook, a 5xx or any failed request during
  # the rollout, an SDK that stopped evaluating, or one that did not receive a
  # change made afterwards: a pull request that would break the previous
  # release's replicas on the new schema, or the chart's rollout, is caught
  # here. It runs for a migration or a change to the chart, nightly and on
  # the server's release pull request. Until the repository has a v1.0.0 tag
  # it only reports (continue-on-error); from then on it gates, with no edit.
  upgrade:
    name: rolling upgrade
    needs: plan
    if: needs.plan.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ needs.plan.outputs.upgrade_gate != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: The last server release
        id: last
        run: |
          # Tags the release contains are left out, so that the run for the
          # release itself upgrades from the one before it.
          tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname --no-contains HEAD | grep -v -- '-' | head -n 1 || true)"
          if [ -z "$tag" ]; then
            echo "no server release to upgrade from" >&2
            exit 1
          fi
          echo "from=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Upgrading from ${tag#v}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: upgrade
          config: deploy/helm/test/kind-upgrade.yaml
          # The oldest Kubernetes minor the chart supports.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
      - name: Build the head image into kind
        run: |
          docker build -f deploy/Dockerfile -t flagnetic:upgrade-head .
          kind load docker-image flagnetic:upgrade-head --name upgrade
      - name: Upgrade under load
        env:
          UPGRADE_FROM: ${{ steps.last.outputs.from }}
        run: .github/scripts/upgrade.sh
      - name: Say that the result is only a report
        if: failure() && needs.plan.outputs.upgrade_gate != 'true'
        run: |
          echo "::warning title=rolling upgrade::The rolling-upgrade test failed. It only reports until the server has released v1.0.0."
          echo "**Rolling upgrade failed; report-only until v1.0.0 is tagged.**" >> "$GITHUB_STEP_SUMMARY"

  # The one check branch protection requires. A job above may be skipped (a
  # module matrix with nothing to run, a job behind a condition), which is
  # fine; a failed or cancelled one is not.
  ci-ok:
    name: ci-ok
    needs: [plan, lint, test, coverage, vuln, npm-audit, tidy, console, e2e, sdk-e2e, load, upgrade, sdk-ruby, sdk-python, workflows, migrations, helm, docker, module, released, dart, flutter, sdk-js]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a needed job ended with: $result" >&2; exit 1 ;;
            esac
          done
