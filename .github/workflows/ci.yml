name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The console end to end runs here too, so a change that broke it behind
    # the path filter below is found within a day.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: go test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported PostgreSQL, so a feature newer
        # than the minimum cannot slip in.
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: flagnetic
          POSTGRES_USER: flagnetic
          POSTGRES_PASSWORD: flagnetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagnetic -d flagnetic"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://flagnetic:flagnetic@localhost:5432/flagnetic?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test with the race detector
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage by layer
        env:
          POSTGRES: ${{ matrix.postgres }}
        run: |
          {
            echo "### Go coverage (PostgreSQL $POSTGRES)"
            .github/scripts/coverage-by-layer.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage floors
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.19.0 --config=.testcoverage.yml

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scan reachable code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The npm lockfiles, development dependencies included: the code
  # generators and test runners there execute on developer machines and in
  # CI. Unlike govulncheck this cannot tell reachable code from the rest,
  # so it fails on high and critical advisories only. It runs on every pull
  # request and nightly, as an advisory can appear without a change here.
  npm-audit:
    name: pnpm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [web, sdks/js]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.dir }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: No high or critical advisories
        run: pnpm audit --audit-level high

  tidy:
    name: go mod tidy and generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code

  # The console: the client generated from the management API is current,
  # the code typechecks, lints and tests, every string is translated and
  # the catalogs are what extraction gives, and it builds.
  console:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: |
          pnpm generate
          git diff --exit-code -- packages/api/src
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Test
        run: pnpm test
      - name: Catalogs are extracted and complete
        run: pnpm i18n:check
      - name: Build
        run: pnpm build

  # Whether a pull request touches what a conditional job exercises. For the
  # end-to-end suite: the console, its handlers and the suite itself, with
  # the generated client left out, as it changes with every edit of the
  # management API; server changes behind it are covered by the runs on main,
  # on release pull requests and nightly. For the Ruby gems: their
  # directories, the conformance suite, the SDK contract, the behaviour
  # matrix their runner fills in and their workflow.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
      ruby: ${{ steps.diff.outputs.ruby }}
      sdk-js: ${{ steps.sdk-js.outputs.run }}
      python: ${{ steps.sdk-python.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE...HEAD" |
            grep -vE '^web/packages/api/src/generated/' |
            grep -qE '^(web/apps/|web/packages/|web/e2e/|web/pnpm-lock\.yaml$|internal/infra/in/http/console/|\.github/workflows/ci\.yml$)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BASE...HEAD" |
            grep -qE '^(sdks/ruby/|sdks/ruby-openfeature/|conformance/|api/sdk\.yaml$|go\.mod$|docs/sdks/behaviour-matrix\.md$|\.github/scripts/behaviour-matrix\.sh$|\.github/workflows/(ci|sdk-ruby)\.yml$)'; then
            echo "ruby=true" >> "$GITHUB_OUTPUT"
          else
            echo "ruby=false" >> "$GITHUB_OUTPUT"
          fi
      - id: sdk-js
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE...HEAD" |
            grep -qE '^(sdks/js/|conformance/|api/sdk\.yaml$|go\.mod$|docs/sdks/behaviour-matrix\.md$|\.github/scripts/behaviour-matrix\.sh$|\.github/workflows/(ci|sdk-js)\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # The Python SDK: its sources, the conformance suite its evaluator must
      # pass, the SDK contract, the Go release the Unicode tables come from,
      # the pages its tests compare with, and the workflows that run it.
      - id: sdk-python
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE...HEAD" |
            grep -qE '^(sdks/python/|conformance/|api/sdk\.yaml$|go\.mod$|docs/sdks/(behaviour-matrix|compatibility)\.md$|\.github/scripts/behaviour-matrix\.sh$|\.github/workflows/(ci|sdk-python)\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The Playwright version the console's lockfile resolves, for the image the
  # console end to end runs in.
  playwright:
    name: playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            web/pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(.github/scripts/playwright-version.sh web/pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"

  # The console end to end: on a pull request that touches the console, on
  # release pull requests, on main and nightly. Playwright builds the binary
  # with the console embedded, runs it against PostgreSQL under the test
  # clock, and drives it in Chromium. The Playwright image carries Chromium
  # and its system libraries, so nothing is downloaded or installed through
  # apt.
  e2e:
    name: console end to end
    needs: [changes, playwright]
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.e2e == 'true' ||
        startsWith(github.head_ref, 'release-please--')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flagnetic
          POSTGRES_USER: flagnetic
          POSTGRES_PASSWORD: flagnetic
        options: >-
          --health-cmd "pg_isready -U flagnetic -d flagnetic"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # The job runs in a container, where the service is reached by its name.
      DATABASE_URL: postgres://flagnetic:flagnetic@postgres:5432/flagnetic?sslmode=disable
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # The checkout belongs to the runner's user and the container runs as
      # root, so git refuses the repository and go build cannot stamp the
      # binary with its revision.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the suite
        run: pnpm e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/e2e/playwright-report
          retention-days: 7

  # The Ruby gems: rubocop, the tests on every supported Ruby with the
  # conformance suite, the Unicode tables compared with Go's, and the
  # OpenFeature provider against the working tree and the released core. On
  # a pull request it runs when either gem, the conformance suite, the SDK
  # contract or its workflow changes; on main, on release pull requests and
  # nightly always.
  sdk-ruby:
    name: Ruby SDK
    needs: changes
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.ruby == 'true' ||
        startsWith(github.head_ref, 'release-please--')
      )
    uses: ./.github/workflows/sdk-ruby.yml

  # The Python SDK, on a pull request that touches it or the conformance
  # suite, on release pull requests, on main and nightly.
  sdk-python:
    name: Python SDK
    needs: changes
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.python == 'true' ||
        startsWith(github.head_ref, 'release-please--')
      )
    uses: ./.github/workflows/sdk-python.yml

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: ci-ok needs every job
        run: .github/scripts/check-ci-ok.sh

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: VERSION=ci

  # The Go modules of go.work besides the root one (the evaluator and the
  # SDKs). The list is read from go.work, so a module joins CI through its
  # `use` line alone. The end-to-end harness is left out: it is published
  # nowhere, builds the server, and runs in the sdk-e2e job.
  modules:
    name: list go modules
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: list
        run: |
          dirs="$(go work edit -json | jq -c '[.Use[].DiskPath | ltrimstr("./") | select(. != "." and . != "e2e")]')"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Modules: $dirs"

  # Each module is published on its own and promises to build with the oldest
  # Go release still supported, so it is checked on that release and on the
  # newest one, with the toolchain held to the one installed. The modules
  # resolve each other through a workspace of their own: the committed go.work
  # also holds the server, whose newer Go would refuse the oldest release.
  module:
    name: module ${{ matrix.dir }} (go ${{ matrix.go }})
    needs: modules
    if: needs.modules.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.modules.outputs.dirs) }}
        go: [oldstable, stable]
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.dir }}/go.mod
      - name: Workspace of the published modules
        working-directory: .
        env:
          DIRS: ${{ needs.modules.outputs.dirs }}
        run: |
          echo "GOWORK=$RUNNER_TEMP/go.work" >> "$GITHUB_ENV"
          export GOWORK="$RUNNER_TEMP/go.work"
          go work init
          for dir in $(jq -r '.[]' <<< "$DIRS"); do
            go work use "$GITHUB_WORKSPACE/$dir"
          done
          # As in the committed go.work: v0.0.0, the version required before
          # a first release, resolves to the module's directory.
          go work edit -json "$GITHUB_WORKSPACE/go.work" |
            jq -r '.Replace[]? | select(.Old.Version == "v0.0.0") | "\(.Old.Path) \(.New.Path)"' |
            while read -r path target; do
              go work edit -replace="$path@v0.0.0=$GITHUB_WORKSPACE/${target#./}"
            done
          cat "$GOWORK"
      - name: go.mod is tidy
        run: '"$GITHUB_WORKSPACE/.github/scripts/check-tidy.sh" .'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.dir }}
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: Test with the race detector
        env:
          FLAGNETIC_SCENARIO_REPORT: ${{ runner.temp }}/scenarios.json
        run: go test -race -coverprofile=coverage.out ./...
      - name: Behaviour matrix
        # The Go column of docs/sdks/behaviour-matrix.md is what the
        # protocol runners report as passed in the run above.
        if: matrix.dir == 'sdks/go'
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/behaviour-matrix.sh" Go "$RUNNER_TEMP/scenarios.json"
          git diff --exit-code -- "$GITHUB_WORKSPACE/docs/sdks/behaviour-matrix.md"
      - name: Coverage floors
        env:
          MODULE: ${{ matrix.dir }}
          GO: ${{ matrix.go }}
        run: |
          set -o pipefail
          {
            echo "### Coverage of $MODULE (go $GO)"
            "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" "$MODULE" coverage.out "$GITHUB_WORKSPACE/.github/coverage-floors"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Kill-switch propagation
        # The Go SDK promises that a kill switch reaches the change
        # callback within two seconds; the measured time goes next to it.
        if: matrix.dir == 'sdks/go'
        env:
          GO: ${{ matrix.go }}
        run: |
          set -o pipefail
          go test -count=1 -v -run 'TestEventAboveTheHeldVersionReachesTheChangeCallbackWithinTwoSeconds$' . |
            tee /dev/stderr | grep -o 'kill_switch_propagation_ms=[0-9]*' |
            sed "s/kill_switch_propagation_ms=/Kill-switch propagation (go $GO): /; s/\$/ ms (target 2000 ms)/" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluation p99
        # The race detector distorts timing, so the guarantee that an
        # evaluation stays under 1 ms at p99 is measured without it; the
        # test writes the numbers to the job summary.
        if: matrix.dir == 'sdks/go'
        run: go test -count=1 -run 'TestEvaluationStaysUnderAMillisecondAtP99$' .
      - name: Scan reachable code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # What go get gives a consumer: each published module built and tested
  # outside the workspace against the versions its go.mod requires. Skipped
  # while it requires a module of this repository at v0.0.0, and failing
  # when that skip would hide a broken release.
  released:
    name: released requirements ${{ matrix.dir }}
    needs: modules
    if: needs.modules.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.modules.outputs.dirs) }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: oldstable
          cache-dependency-path: ${{ matrix.dir }}/go.mod
      - name: Build and test against the released requirements
        run: .github/scripts/check-released-requirements.sh "$DIR"
        env:
          DIR: ${{ matrix.dir }}

  # The SDK end to end, on every pull request: the real binary built from
  # the checkout, two replicas on one PostgreSQL, a project seeded through
  # the management API, and the Go SDK and its OpenFeature provider run
  # against them; the kill-switch propagation it measures goes to the job
  # summary. The harness module is linted, tidied and scanned here, since
  # the module matrix leaves it out.
  # The harness and the Go SDK on every run; each other SDK's smoke against
  # the replicas `flagnetic-e2e up` brings up, when its tree changes and on
  # every run that is not a pull request.
  sdk-e2e:
    name: SDK end to end
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flagnetic
          POSTGRES_USER: flagnetic
          POSTGRES_PASSWORD: flagnetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagnetic -d flagnetic"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://flagnetic:flagnetic@localhost:5432/flagnetic?sslmode=disable
      FLAGNETIC_E2E: "1"
      RUBY_SMOKE: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ruby == 'true' || startsWith(github.head_ref, 'release-please--') }}
      SDK_JS: ${{ github.event_name != 'pull_request' || needs.changes.outputs.sdk-js == 'true' || startsWith(github.head_ref, 'release-please--') }}
      SDK_PYTHON: ${{ github.event_name != 'pull_request' || needs.changes.outputs.python == 'true' || startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
      - name: go.mod is tidy
        run: .github/scripts/check-tidy.sh e2e
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: e2e
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: Scan reachable code
        working-directory: e2e
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Run the harness and the Go SDK against two replicas
        working-directory: e2e
        run: go test -count=1 -v ./...
      - uses: ruby/setup-ruby@v1
        if: env.RUBY_SMOKE == 'true'
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Ruby SDK smoke against two replicas
        if: env.RUBY_SMOKE == 'true'
        run: |
          go build -o "$RUNNER_TEMP/flagnetic-e2e" ./e2e/cmd/flagnetic-e2e
          export FLAGNETIC_E2E_SEED="$RUNNER_TEMP/seed.json" FLAGNETIC_E2E_COMMAND="$RUNNER_TEMP/flagnetic-e2e"
          "$FLAGNETIC_E2E_COMMAND" up > "$RUNNER_TEMP/up.log" 2>&1 &
          up=$!
          trap 'kill "$up"; wait "$up" || true' EXIT
          for _ in $(seq 180); do
            [[ -s "$FLAGNETIC_E2E_SEED" ]] && break
            kill -0 "$up" 2>/dev/null || { cat "$RUNNER_TEMP/up.log"; exit 1; }
            sleep 1
          done
          [[ -s "$FLAGNETIC_E2E_SEED" ]] || { echo "no seed after 180 s"; cat "$RUNNER_TEMP/up.log"; exit 1; }
          (cd sdks/ruby && bundle exec rake e2e) || { cat "$RUNNER_TEMP/up.log"; exit 1; }
      # `up` seeds the same database again with new keys, revoking the
      # earlier ones, and serves until the job ends.
      - name: Bring up two replicas for the JavaScript SDK
        if: env.SDK_JS == 'true'
        run: |
          go build -o "$RUNNER_TEMP/flagnetic-e2e" ./e2e/cmd/flagnetic-e2e
          {
            echo "FLAGNETIC_E2E_CMD=$RUNNER_TEMP/flagnetic-e2e"
            echo "FLAGNETIC_E2E_SEED=$RUNNER_TEMP/seed.json"
            echo "FLAGNETIC_E2E_LOGS=$RUNNER_TEMP/replicas.log"
          } >> "$GITHUB_ENV"
          export FLAGNETIC_E2E_SEED="$RUNNER_TEMP/seed.json" FLAGNETIC_E2E_LOGS="$RUNNER_TEMP/replicas.log"
          nohup "$RUNNER_TEMP/flagnetic-e2e" up > "$RUNNER_TEMP/up.log" 2>&1 &
          for _ in $(seq 150); do
            [ -s "$FLAGNETIC_E2E_SEED" ] && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/up.log"
          exit 1
      - uses: pnpm/action-setup@v6
        if: env.SDK_JS == 'true'
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@v7
        if: env.SDK_JS == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdks/js/pnpm-lock.yaml
      - name: Install the JavaScript SDK
        if: env.SDK_JS == 'true'
        working-directory: sdks/js
        run: pnpm install --frozen-lockfile
      # The browser smoke runs in the Chrome the runner image already has:
      # this job runs on the runner itself, beside the replicas, so it cannot
      # take the Playwright image, and installing Playwright's Chromium pulls
      # its system libraries through apt.
      - name: Run the JavaScript SDK in Node and in Chrome against two replicas
        if: env.SDK_JS == 'true'
        working-directory: sdks/js
        env:
          FLAGNETIC_BROWSER_CHANNEL: chrome
        run: |
          set -o pipefail
          pnpm test:e2e | tee "$RUNNER_TEMP/smoke.log"
          {
            echo "Kill-switch propagation of the JavaScript server mode (target 2000 ms):"
            # Not anchored: vitest colours its output in CI, so the line
            # starts with escape sequences.
            grep -o '{"sdk":"flagnetic-js","kill_switch_ms":-\?[0-9]*}' "$RUNNER_TEMP/smoke.log"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v7
        if: env.SDK_PYTHON == 'true'
        with:
          python-version: 3.x
      - uses: astral-sh/setup-uv@v10.3.2
        if: env.SDK_PYTHON == 'true'
      # Its own `up`, seeded again with new keys: the smokes before it end
      # by revoking theirs. The smoke writes its kill-switch line to the job
      # summary itself.
      - name: Python SDK smoke against two replicas
        if: env.SDK_PYTHON == 'true'
        run: |
          go build -o "$RUNNER_TEMP/flagnetic-e2e" ./e2e/cmd/flagnetic-e2e
          export FLAGNETIC_E2E_SEED="$RUNNER_TEMP/seed-python.json" FLAGNETIC_E2E_CMD="$RUNNER_TEMP/flagnetic-e2e"
          export FLAGNETIC_E2E_LOGS="$RUNNER_TEMP/replicas-python.log"
          "$FLAGNETIC_E2E_CMD" up > "$RUNNER_TEMP/up-python.log" 2>&1 &
          up=$!
          trap 'kill "$up"; wait "$up" || true' EXIT
          for _ in $(seq 180); do
            [[ -s "$FLAGNETIC_E2E_SEED" ]] && break
            kill -0 "$up" 2>/dev/null || { cat "$RUNNER_TEMP/up-python.log"; exit 1; }
            sleep 1
          done
          [[ -s "$FLAGNETIC_E2E_SEED" ]] || { echo "no seed after 180 s"; cat "$RUNNER_TEMP/up-python.log"; exit 1; }
          cd sdks/python
          uv sync --locked --python "$(command -v python)"
          uv run pytest e2e || { cat "$RUNNER_TEMP/up-python.log"; exit 1; }
      - name: Keep the replicas' log
        if: failure() && (env.SDK_JS == 'true' || env.SDK_PYTHON == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: sdk-e2e-replicas
          path: |
            ${{ runner.temp }}/replicas*.log
            ${{ runner.temp }}/up*.log
          retention-days: 7

  # Whether a pull request touches what the Dart SDK and the Flutter package
  # are tested against; push, schedule and release runs always test them.
  dart-changes:
    name: dart changed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      dart: ${{ steps.diff.outputs.dart }}
      flutter: ${{ steps.diff.outputs.flutter }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE...HEAD" |
            grep -qE '^(sdks/dart/|conformance/|api/sdk\.yaml$|\.github/workflows/(sdk-dart|ci)\.yml$)'; then
            echo "dart=true" >> "$GITHUB_OUTPUT"
          else
            echo "dart=false" >> "$GITHUB_OUTPUT"
          fi
          # The Flutter package resolves the Dart SDK from the working tree,
          # so a change to either one tests it.
          if git diff --name-only "$BASE...HEAD" |
            grep -qE '^(sdks/dart/|sdks/flutter/|\.github/workflows/(sdk-flutter|ci)\.yml$)'; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi

  dart:
    name: dart
    needs: dart-changes
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.dart-changes.outputs.dart == 'true'
      )
    uses: ./.github/workflows/sdk-dart.yml

  flutter:
    name: flutter
    needs: dart-changes
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.dart-changes.outputs.flutter == 'true'
      )
    uses: ./.github/workflows/sdk-flutter.yml

  # The JavaScript SDK, on a pull request that touches it, the conformance
  # suite or the SDK API, on release pull requests and on main.
  sdk-js:
    name: sdk-js
    needs: changes
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.sdk-js == 'true' ||
        startsWith(github.head_ref, 'release-please--')
      )
    uses: ./.github/workflows/sdk-js.yml

  # The one check branch protection requires. A job above may be skipped (a
  # module matrix with nothing to run, a job behind a condition), which is
  # fine; a failed or cancelled one is not.
  ci-ok:
    name: ci-ok
    needs: [lint, test, vuln, npm-audit, tidy, console, changes, playwright, e2e, sdk-e2e, sdk-ruby, sdk-python, workflows, docker, modules, module, released, dart-changes, dart, flutter, sdk-js]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a needed job ended with: $result" >&2; exit 1 ;;
            esac
          done
