name: sdk-ruby

# The Ruby gem, called from ci.yml when the gem, the conformance suite, the
# SDK contract or this workflow changes.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: ruby rubocop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Rubocop
        run: bundle exec rubocop

  # The oldest Ruby the gem supports, the one before the newest and the
  # newest. The tests run every conformance fixture, the RE2 vectors and the
  # OpenFeature reasons with no skip list, and the evaluation p99 test writes
  # its figure to the job summary.
  test:
    name: ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Test
        run: bundle exec rake test
      - name: Gem builds
        run: gem build --strict flagnetic.gemspec

  # The Rails integration against a minimal Rails application booted
  # in-process, as console, runner and rake, and as a two-worker Puma, on
  # every supported Rails major: the oldest with the oldest Ruby, the newest
  # with the newest. Rails and Puma live only in that bundle; the gem
  # depends on neither.
  rails:
    name: rails ${{ matrix.rails }} on ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "8.0"
            ruby: "3.3"
          - rails: "8.1"
            ruby: "4.0"
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    defaults:
      run:
        working-directory: sdks/ruby/rails
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: sdks/ruby/rails
      - name: Test
        run: bundle exec rake test

  # The case folding orbits and property names come from the Go the server is
  # built with; a Go upgrade that changes them must regenerate them.
  unicode-tables:
    name: ruby unicode tables are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Regenerate and compare
        env:
          GOWORK: "off"
        run: |
          go run ./sdks/ruby/script/_unicode_tables > sdks/ruby/lib/flagnetic/eval/unicode_tables.rb
          git diff --exit-code -- sdks/ruby/lib/flagnetic/eval/unicode_tables.rb
