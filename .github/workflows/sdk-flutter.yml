name: sdk-flutter

# The Flutter package: format, static analysis with infos fatal, and the
# widget tests on the VM and on Chrome, on the oldest Flutter stable it
# supports and on the current stable. It resolves the Dart SDK from the
# working tree, so a change to either package tests both. Called from
# ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  flutter:
    name: flutter ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor of pubspec.yaml and the newest stable release.
        flutter: ['3.35.0', any]
    defaults:
      run:
        working-directory: sdks/flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
      - name: Install
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Test on Chrome
        run: flutter test --platform chrome
