version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      go:
        patterns: ["*"]
  # The published Go modules. After the evaluator is tagged, the SDK's
  # requirement on it is bumped here, and the provider's on the SDK; the
  # bump is what lets the dependent module release next. Daily, so a
  # release does not wait a week for its dependent.
  - package-ecosystem: gomod
    directory: /eval
    schedule:
      interval: daily
    commit-message:
      prefix: "deps(eval)"
  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: daily
    commit-message:
      prefix: "deps(sdk-go)"
  - package-ecosystem: gomod
    directory: /sdks/go-openfeature
    schedule:
      interval: daily
    commit-message:
      prefix: "deps(sdk-go-openfeature)"
  # The end-to-end harness, released by nothing; its requirements on this
  # repository's modules stay v0.0.0 and resolve through the workspace, so
  # a release of one of them is no update here.
  - package-ecosystem: gomod
    directory: /e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(e2e)"
    ignore:
      - dependency-name: "github.com/azverinus/flagnetic"
      - dependency-name: "github.com/azverinus/flagnetic/*"
  # The console and the JavaScript SDK. Grouped per directory, so a week of
  # updates is one pull request each; security updates still open on their
  # own as soon as an advisory is published.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(console)"
    groups:
      console:
        patterns: ["*"]
    ignore:
      # The API client generator and typescript-eslint use TypeScript's
      # JavaScript API, which TypeScript 7 does not ship.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types follow the Node the console's tooling runs on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /sdks/js
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(sdk-js)"
    groups:
      sdk-js:
        patterns: ["*"]
    ignore:
      # typescript-eslint and tsup's declaration build use TypeScript's
      # JavaScript API, which TypeScript 7 does not ship.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types follow the oldest Node the package supports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # The OpenFeature gem's requirement on the flagnetic gem. It admits one
  # minor of flagnetic, so a flagnetic release of the next minor falls
  # outside it and is proposed here; the bump is a commit to the provider,
  # which then releases next. Daily, so the provider does not wait a week.
  # Only flagnetic: the bundle's tools are not what this entry is for.
  - package-ecosystem: bundler
    directory: /sdks/ruby-openfeature
    schedule:
      interval: daily
    commit-message:
      prefix: "deps(sdk-ruby-openfeature)"
    allow:
      - dependency-name: flagnetic
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: pub
    directory: /sdks/dart
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(sdk-dart)"
  - package-ecosystem: pub
    directory: /sdks/flutter
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(sdk-flutter)"
