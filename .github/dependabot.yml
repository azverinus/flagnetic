version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      go:
        patterns: ["*"]
  # The published Go modules. After the evaluator is tagged, the SDK's
  # requirement on it is bumped here, and the provider's on the SDK; the
  # bump is what lets the dependent module release next. Daily, so a
  # release does not wait a week for its dependent.
  - package-ecosystem: gomod
    directory: /eval
    schedule:
      interval: daily
    commit-message:
      prefix: "deps(eval)"
  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: daily
    commit-message:
      prefix: "deps(sdk-go)"
  - package-ecosystem: gomod
    directory: /sdks/go-openfeature
    schedule:
      interval: daily
    commit-message:
      prefix: "deps(sdk-go-openfeature)"
  # The end-to-end harness, released by nothing; its requirements on this
  # repository's modules stay v0.0.0 and resolve through the workspace.
  - package-ecosystem: gomod
    directory: /e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(e2e)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build
