apiVersion: v1
kind: Pod
metadata:
  name: {{ include "flagnetic.shortname" . }}-test-ready
  labels:
    {{- include "flagnetic.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "flagnetic.podSecurityContext" . | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: ready
      image: {{ printf "%s:%s%s" .Values.test.image.repository .Values.test.image.tag (ternary (printf "@%s" .Values.test.image.digest) "" (not (empty .Values.test.image.digest))) | quote }}
      command: ["wget", "-q", "-O", "-", "--timeout=10", {{ printf "http://%s:%d/readyz" (include "flagnetic.fullname" .) (int .Values.service.port) | quote }}]
      securityContext:
        {{- include "flagnetic.containerSecurityContext" . | nindent 8 }}
      {{- with .Values.test.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
