apiVersion: v1
kind: Pod
metadata:
  name: {{ include "flagnetic.fullname" . }}-test-ready
  labels:
    {{- include "flagnetic.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "flagnetic.podSecurityContext" . | nindent 4 }}
  containers:
    - name: ready
      image: {{ printf "%s:%s" .Values.test.image.repository .Values.test.image.tag | quote }}
      command: ["wget", "-q", "-O", "-", "--timeout=10", {{ printf "http://%s:%d/readyz" (include "flagnetic.fullname" .) (int .Values.service.port) | quote }}]
      securityContext:
        {{- include "flagnetic.containerSecurityContext" . | nindent 8 }}
      {{- with .Values.test.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
