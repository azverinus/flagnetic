{{- if not .Values.secrets.existingSecret }}
{{- include "flagnetic.validate" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flagnetic.fullname" . }}
  labels:
    {{- include "flagnetic.labels" . | nindent 4 }}
  annotations:
    # A hook of lower weight than the migration Job, so the Job finds it on a
    # first install; before-hook-creation replaces it on every upgrade.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{ .Values.secrets.databaseUrlKey }}: {{ .Values.secrets.databaseUrl | quote }}
  {{ .Values.secrets.secretKeyKey }}: {{ .Values.secrets.secretKey | quote }}
{{- end }}
