{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "flagnetic.fullname" . }}
  labels:
    {{- include "flagnetic.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "flagnetic.serverSelectorLabels" . | nindent 6 }}
{{- end }}
