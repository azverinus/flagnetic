# Default values of the Flagnetic chart. README.md lists every value.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/azverinus/flagnetic
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Ignored while autoscaling.enabled is true: the autoscaler owns the count.
replicaCount: 2

# PostgreSQL and the instance's secret key. The chart never generates them: a
# key made at render time would change on every `helm template` and under
# Argo CD, and the server refuses to start under a key other than the first.
secrets:
  # Name of a Secret that holds both. Recommended; the chart then renders none.
  existingSecret: ""
  # Keys of the existing Secret.
  databaseUrlKey: DATABASE_URL
  secretKeyKey: FLAGNETIC_SECRET_KEY
  # Without an existing Secret, the values the chart's own Secret holds.
  databaseUrl: ""
  secretKey: ""

# Settings as FLAGNETIC_* environment variables: each key is the setting's file
# key in docs/configuration.md (log_level becomes FLAGNETIC_LOG_LEVEL). The
# listeners and auto_migrate are the chart's own.
config: {}

# Environment variables and sources for them, as in a container spec.
extraEnv: []
extraEnvFrom: []

migrations:
  # hook: a Job before every install and upgrade, so a failed migration stops
  # the upgrade before a pod is replaced. initContainer: every pod migrates
  # before it serves. auto: the server migrates when it starts.
  mode: hook
  # The server waits up to five minutes for the migration lock, so the Job's
  # deadline lies above it. `helm install` and `helm upgrade` wait for the Job
  # within --timeout, five minutes unless set: pass one above this.
  activeDeadlineSeconds: 900
  resources: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

terminationGracePeriodSeconds: 30

probes:
  # A cold start waits for PostgreSQL and the schema check.
  # The timeouts of startup and readiness lie above the two seconds /readyz
  # waits for PostgreSQL, which under load includes waiting for a pooled
  # connection: a probe that gave up sooner would empty the Service.
  startup:
    periodSeconds: 2
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  metrics:
    port: 9090
    annotations: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Traffic comes in through an Ingress or a Gateway API HTTPRoute; neither is
# on by default, and both may be on at once. An SDK's ruleset stream stays open
# for up to 65 minutes, and it and the management change stream send a heartbeat
# every 15 seconds, so the proxy in front needs response buffering off for both
# streams, an idle (read) timeout above the heartbeat and no request timeout
# shorter than the stream. For ingress-nginx:
#   ingress:
#     enabled: true
#     className: nginx
#     hosts: [flags.example.com]
#     annotations:
#       nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
#       nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
#       nginx.ingress.kubernetes.io/proxy-buffering: "off"
#     tls:
#       - secretName: flagnetic-tls
#         hosts: [flags.example.com]
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Hosts the Ingress routes to the http Service.
  hosts: []
  # TLS entries, as in an Ingress spec.
  tls: []

# A Gateway API route to the http Service. The Gateway's own timeouts apply:
# in the implementation's way, raise its idle timeout above 15 seconds and its
# request timeout above 65 minutes, or turn the request timeout off (for Envoy
# Gateway, a BackendTrafficPolicy, whose default request timeout is 15 seconds).
#   httpRoute:
#     enabled: true
#     parentRefs:
#       - name: public
#         namespace: gateways
#     hostnames: [flags.example.com]
httpRoute:
  enabled: false
  annotations: {}
  # Gateways the route attaches to, as in an HTTPRoute spec. Required.
  parentRefs: []
  hostnames: []

# Prometheus Operator resources, rendered only when enabled. The CRDs must
# exist in the cluster.
serviceMonitor:
  enabled: false
  # Namespace of the ServiceMonitor; the release's when empty.
  namespace: ""
  # Labels the Prometheus instance selects ServiceMonitors by.
  labels: {}
  interval: 30s
  scrapeTimeout: ""

prometheusRule:
  enabled: false
  # Namespace of the PrometheusRule; the release's when empty.
  namespace: ""
  # Labels the Prometheus instance selects rules by.
  labels: {}
  # The 99th percentile of ruleset propagation above which the alert fires.
  # The declared 99th percentile of ruleset propagation is 2 seconds.
  propagationSeconds: 2

# Scales the Deployment on CPU against resources.requests.cpu.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Restricts the server's pods. The migration Job and the helm test Pod are
# not selected; where http.from is set, the test Pod is admitted by its label.
# Needs a network plugin that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  ingress:
    http:
      # Peers admitted to the http port, as in a NetworkPolicy `from`. Empty
      # admits every source.
      from: []
    metrics:
      # Peers admitted to the metrics port, such as the Prometheus pods.
      # Empty admits none.
      from: []
  egress:
    dns:
      # Peers the DNS port is open to; empty is every destination.
      to: []
    postgresql:
      port: 5432
      # Peers the PostgreSQL port is open to; empty is every destination.
      to: []
    # Further egress rules, as in a NetworkPolicy `egress`, for what the
    # instance reaches: webhook receivers, sinks, SMTP and identity providers.
    #   rules:
    #     - to:
    #         - ipBlock:
    #             cidr: 203.0.113.0/24
    #       ports:
    #         - port: 443
    #           protocol: TCP
    rules: []

# Soft constraints that spread replicas over zones and hosts.
topologySpreadConstraints:
  enabled: true
  maxSkew: 1

nodeSelector: {}
tolerations: []
affinity: {}

# The Pod `helm test` runs: it asks the Service for /readyz.
test:
  image:
    repository: busybox
    tag: "1.37.0"
    # Pins the tag to one image; empty uses the tag alone.
    digest: "sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec"
  resources: {}
