suite: secrets
templates:
  - templates/secret.yaml
  - templates/deployment.yaml
  - templates/migrate-job.yaml
tests:
  - it: refuses to render without an existing Secret or both values
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorPattern: secrets.existingSecret
  - it: refuses with only the database URL
    template: templates/secret.yaml
    set:
      secrets.databaseUrl: postgres://db/flagnetic
    asserts:
      - failedTemplate:
          errorPattern: never generates them
  - it: refuses with only the secret key
    template: templates/secret.yaml
    set:
      secrets.secretKey: abcdefghijklmnopqrstuvwxyz0123456789
    asserts:
      - failedTemplate:
          errorPattern: secrets.existingSecret
  - it: renders the chart's Secret as a hook of lower weight than the Job
    template: templates/secret.yaml
    set:
      secrets.databaseUrl: postgres://db/flagnetic
      secrets.secretKey: abcdefghijklmnopqrstuvwxyz0123456789
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - equal:
          path: stringData.DATABASE_URL
          value: postgres://db/flagnetic
      - equal:
          path: stringData.FLAGNETIC_SECRET_KEY
          value: abcdefghijklmnopqrstuvwxyz0123456789
  - it: renders no Secret for an existing one and reads its keys
    set:
      secrets.existingSecret: mine
      secrets.databaseUrlKey: url
      secrets.secretKeyKey: key
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: mine
                key: url
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLAGNETIC_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: mine
                key: key
        template: templates/deployment.yaml
  - it: does not accept the secrets through config
    template: templates/migrate-job.yaml
    set:
      secrets.existingSecret: mine
      config.secret_key: nope
    asserts:
      - failedTemplate:
          errorPattern: invalid propertyName .secret_key.
  - it: rolls the pods when the chart's Secret changes
    template: templates/deployment.yaml
    set:
      secrets.databaseUrl: postgres://db/flagnetic
      secrets.secretKey: abcdefghijklmnopqrstuvwxyz0123456789
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]
  - it: refuses a secret key shorter than the server accepts
    template: templates/secret.yaml
    set:
      secrets.databaseUrl: postgres://db/flagnetic
      secrets.secretKey: too-short
    asserts:
      - failedTemplate:
          errorPattern: secretKey
