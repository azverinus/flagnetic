suite: deployment
templates:
  - templates/deployment.yaml
set:
  secrets.existingSecret: mine
tests:
  - it: runs two replicas with the restricted pod security
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
  - it: probes /readyz at start and for readiness, and /healthz for liveness
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
  - it: uses the appVersion as the image tag unless one is set
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/azverinus/flagnetic:0.5.0
  - it: takes the image tag from the values
    set:
      image.tag: "0.6.1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/azverinus/flagnetic:0.6.1
  - it: spreads replicas over zones and hosts, softly
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[1].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[1].whenUnsatisfiable
          value: ScheduleAnyway
  - it: labels and selects its pods as the server component
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: server
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: server
  - it: leaves the spread out when it is switched off
    set:
      topologySpreadConstraints.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
  - it: renders config as FLAGNETIC_ variables, numbers without an exponent
    set:
      config:
        log_level: debug
        http_max_body_bytes: 1048576
        webhook_allow_http: true
        base_url: https://flags.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLAGNETIC_LOG_LEVEL
            value: "debug"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLAGNETIC_HTTP_MAX_BODY_BYTES
            value: "1048576"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLAGNETIC_WEBHOOK_ALLOW_HTTP
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLAGNETIC_BASE_URL
            value: "https://flags.example.com"
  - it: refuses settings the chart owns
    set:
      config.auto_migrate: "true"
    asserts:
      - failedTemplate:
          errorPattern: config.auto_migrate is managed by the chart
  - it: adds extra environment, sources, scheduling and resources
    set:
      extraEnv:
        - name: PGSSLMODE
          value: require
      extraEnvFrom:
        - secretRef:
            name: more
      nodeSelector:
        disk: ssd
      tolerations:
        - key: dedicated
          operator: Exists
      affinity:
        nodeAffinity: {}
      resources:
        limits:
          memory: 1Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLMODE
            value: require
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: more
      - equal:
          path: spec.template.spec.nodeSelector.disk
          value: ssd
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
      - exists:
          path: spec.template.spec.affinity.nodeAffinity
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
  - it: serves on the configured ports
    set:
      service.port: 8081
      service.metrics.port: 9091
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLAGNETIC_LISTEN_ADDR
            value: ":8081"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLAGNETIC_METRICS_LISTEN_ADDR
            value: ":9091"
