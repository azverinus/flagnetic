# Flagnetic with its PostgreSQL, for evaluation and as a starting point for a
# deployment. From this directory, once, store a secret key in .env, which
# Compose reads (keep it: the instance refuses to start under another one):
#
#   echo "FLAGNETIC_SECRET_KEY=$(openssl rand -base64 32)" > .env
#
# then:
#
#   docker compose up -d
#   docker compose exec flagnetic flagnetic admin bootstrap --email you@example.com
#
# then open http://localhost:8080 and sign in with that email and the
# password bootstrap printed. The image is pulled from GHCR (FLAGNETIC_VERSION
# pins its version, `latest` by default), or built from this checkout with
# `docker compose build`. docs/install.md has the whole guide.
name: flagnetic

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flagnetic
      POSTGRES_USER: flagnetic
      POSTGRES_PASSWORD: flagnetic
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flagnetic", "-d", "flagnetic"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Migrations run once, as a job, before the server starts; the server itself
  # is told not to migrate, as a scaled deployment would be.
  migrate:
    image: &image ghcr.io/azverinus/flagnetic:${FLAGNETIC_VERSION:-latest}
    build: &build
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: &database postgres://flagnetic:flagnetic@postgres:5432/flagnetic?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  flagnetic:
    image: *image
    build: *build
    command: ["serve"]
    environment:
      DATABASE_URL: *database
      FLAGNETIC_AUTO_MIGRATE: "false"
      FLAGNETIC_SECRET_KEY: ${FLAGNETIC_SECRET_KEY:?store a secret key in deploy/.env first; see the top of compose.yaml}
    ports:
      - "8080:8080"
      # Metrics on this host only: they tell anyone who reads them the
      # instance's routes and environments, so keep them off the network.
      - "127.0.0.1:9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/flagnetic", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Covers the drain (FLAGNETIC_SHUTDOWN_DRAIN, 5s) and the grace period
    # (FLAGNETIC_SHUTDOWN_GRACE, 15s) with a margin, so the container is not
    # killed while it still finishes requests.
    stop_grace_period: 25s
    restart: unless-stopped

volumes:
  postgres:
