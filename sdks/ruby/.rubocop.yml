AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "lib/flagnetic/eval/unicode_tables.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# The evaluator mirrors the reference evaluator in eval/ and keeps its
# shape, step for step; tests are tables and scripts.
Metrics:
  Exclude:
    - "test/**/*"
    - "rails/test/**/*"

Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 35

Metrics/ClassLength:
  Max: 400

Metrics/ModuleLength:
  Max: 400

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Naming/MethodParameterName:
  AllowedNames: [op, cf, id]

Metrics/ParameterLists:
  CountKeywordArgs: false
