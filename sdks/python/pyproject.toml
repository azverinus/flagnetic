[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flagnetic"
dynamic = ["version"]
description = "Python SDK for Flagnetic, self-hosted feature flags and experiments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
# The OpenFeature provider, flagnetic.openfeature; 0.9 is the first release with tracking.
openfeature = ["openfeature-sdk>=0.9"]

[project.urls]
Homepage = "https://github.com/azverinus/flagnetic"
Source = "https://github.com/azverinus/flagnetic/tree/main/sdks/python"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.version]
path = "src/flagnetic/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flagnetic"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["src/flagnetic/_eval/_re2/unicode_tables.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "C4", "PIE"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603"]

[tool.ruff.lint.isort]
known-first-party = ["flagnetic"]
known-local-folder = ["conformance", "large_ruleset"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "PLR2004", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "tests"
python_version = "3.11"
