# Developer commands. Install Task (https://taskfile.dev), then `task` lists them.
#
# `task check` runs locally what CI runs on every pull request. Tests start a
# PostgreSQL through testcontainers unless DATABASE_URL is set; `task db:up`
# gives you a long-lived one instead (copy .env.example to .env).
version: "3"

dotenv: [".env"]

vars:
  BIN: bin/flagnetic
  DB_CONTAINER: flagnetic-dev-postgres
  DB_PORT: '{{.DB_PORT | default "5432"}}'
  # Tools run at pinned versions through `go run`, so nothing needs installing
  # beyond Go and Task; they are built with the toolchain go.work pins.
  GOLANGCI_LINT: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
  GOVULNCHECK: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0
  ACTIONLINT: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  GOTESTSUM: go run gotest.tools/gotestsum@v1.13.0
  GO_TEST_COVERAGE: go run github.com/vladopajic/go-test-coverage/v2@v2.19.0
  # The directory of every module in go.work, the root module first. `./...`
  # stops at a nested module, so each Go check runs once per module.
  MODULES:
    sh: go list -m -f '{{"{{.Dir}}"}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # --- Build ---

  build:
    desc: Build the console, then the binary embedding it, into bin/flagnetic
    deps: [web:build]
    cmds:
      - task: build:go

  build:go:
    desc: Build the binary alone, embedding whatever console build is present
    cmds:
      - go build -trimpath -o {{.BIN}} ./cmd/flagnetic

  run:
    desc: Build and run the binary (pass arguments after --)
    deps: [build]
    cmds:
      - ./{{.BIN}} {{.CLI_ARGS}}

  docker:build:
    desc: Build the production image flagnetic:dev
    cmds:
      - docker build -f deploy/Dockerfile --build-arg VERSION=dev -t flagnetic:dev .

  generate:
    desc: Regenerate generated code and docs (API code and client, the configuration reference)
    deps: [web:install]
    cmds:
      - go generate ./...
      - pnpm --dir web generate

  # --- Console (web/, needs Node and pnpm) ---

  web:install:
    desc: Install the console's dependencies
    sources:
      - web/pnpm-lock.yaml
      - web/package.json
      - web/*/*/package.json
      - web/e2e/package.json
    cmds:
      - pnpm --dir web install --frozen-lockfile

  web:build:
    desc: Build the console into the directory the binary embeds
    deps: [web:install]
    sources:
      - web/apps/console/**/*
      - web/packages/api/src/**/*
      - exclude: web/**/node_modules/**
    generates:
      - internal/infra/in/http/console/dist/index.html
    cmds:
      - pnpm --dir web build

  web:dev:
    desc: Serve the console with live reload, proxying the API to a running binary (FLAGNETIC_URL)
    deps: [web:install]
    cmds:
      - pnpm --dir web dev

  web:check:
    desc: Typecheck, lint, format-check and test the console; check its catalogs
    deps: [web:install]
    cmds:
      - pnpm --dir web typecheck
      - pnpm --dir web lint
      - pnpm --dir web format
      - pnpm --dir web test
      - pnpm --dir web i18n:check

  web:e2e:
    desc: Run the console end to end against the real binary and a throwaway PostgreSQL
    deps: [web:install]
    cmds:
      - env -u DATABASE_URL pnpm --dir web/e2e test:local

  web:extract:
    desc: Extract the console's messages into its catalogs
    deps: [web:install]
    cmds:
      - pnpm --dir web i18n:extract

  # --- SDK end to end (e2e/, needs Docker) ---

  e2e:
    desc: Run the SDK end to end against two replicas of the real binary and a throwaway PostgreSQL
    dir: e2e
    cmds:
      - env -u DATABASE_URL FLAGNETIC_E2E=1 {{.GOTESTSUM}} --format testname -- -count=1 ./...

  e2e:up:
    desc: Bring up two seeded replicas for an SDK's smoke and serve until interrupted (see e2e/README.md)
    interactive: true
    cmds:
      - env -u DATABASE_URL go run ./e2e/cmd/flagnetic-e2e up

  # --- Checks (what CI runs) ---

  check:
    desc: Run every CI check locally (lint, tests, vulnerabilities, tidy, the console, the Dart SDK)
    cmds:
      - task: lint
      - task: web:check
      - task: dart:check
      - task: test
      - task: cover
      - task: vuln
      - task: tidy

  dart:check:
    desc: Format, analyze and test the Dart SDK
    dir: sdks/dart
    cmds:
      - dart pub get
      - dart format --output=none --set-exit-if-changed .
      - dart analyze --fatal-infos
      - dart test

  lint:
    desc: Lint the Go code of every module (layer rules included) and the CI workflows
    cmds:
      - for: { var: MODULES, split: "\n" }
        cmd: cd '{{.ITEM}}' && {{.GOLANGCI_LINT}} run --config '{{.ROOT_DIR}}/.golangci.yml' ./...
      - '{{.ACTIONLINT}}'
      - .github/scripts/check-ci-ok.sh

  fmt:
    desc: Format the Go code of every module
    cmds:
      - for: { var: MODULES, split: "\n" }
        cmd: cd '{{.ITEM}}' && {{.GOLANGCI_LINT}} fmt --config '{{.ROOT_DIR}}/.golangci.yml' ./...

  test:
    desc: Run the Go tests of every module with the race detector, recording the server's coverage
    cmds:
      # The coverage floors are the server's, so only the root module records
      # a profile, counting every server package any test exercises.
      - for: { var: MODULES, split: "\n" }
        cmd: >-
          cd '{{.ITEM}}' && {{.GOTESTSUM}} --format pkgname -- -race
          {{if eq .ITEM .ROOT_DIR}}-coverpkg=./internal/... -coverprofile='{{.ROOT_DIR}}/coverage.out'{{end}} ./...

  cover:
    desc: Check the coverage floors per layer (after task test)
    cmds:
      - .github/scripts/coverage-by-layer.sh coverage.out
      - '{{.GO_TEST_COVERAGE}} --config=.testcoverage.yml'

  cover:html:
    desc: Open the coverage report of the last task test
    cmds:
      - go tool cover -html=coverage.out

  vuln:
    desc: Scan the reachable code of every module for known vulnerabilities
    cmds:
      - for: { var: MODULES, split: "\n" }
        cmd: cd '{{.ITEM}}' && {{.GOVULNCHECK}} ./...

  tidy:
    desc: Fail if the go.mod of any module is not tidy
    cmds:
      - for: { var: MODULES, split: "\n" }
        cmd: .github/scripts/check-tidy.sh '{{.ITEM}}'

  # --- Local database ---

  db:up:
    desc: Start a development PostgreSQL in Docker (DB_PORT, default 5432)
    run: once
    status:
      - docker ps --filter name=^{{.DB_CONTAINER}}$ --filter status=running -q | grep -q .
    cmds:
      - docker start {{.DB_CONTAINER}} 2>/dev/null ||
        docker run -d --name {{.DB_CONTAINER}}
          -e POSTGRES_DB=flagnetic -e POSTGRES_USER=flagnetic -e POSTGRES_PASSWORD=flagnetic
          -p 127.0.0.1:{{.DB_PORT}}:5432 -v flagnetic-dev-postgres:/var/lib/postgresql/data
          postgres:17-alpine
      - until docker exec {{.DB_CONTAINER}} pg_isready -U flagnetic -d flagnetic >/dev/null 2>&1; do sleep 0.5; done

  db:down:
    desc: Stop the development PostgreSQL (data is kept)
    cmds:
      - docker stop {{.DB_CONTAINER}}

  db:reset:
    desc: Delete the development PostgreSQL and its data
    prompt: This deletes the development database. Continue?
    cmds:
      - docker rm -f {{.DB_CONTAINER}} 2>/dev/null || true
      - docker volume rm flagnetic-dev-postgres 2>/dev/null || true

  db:psql:
    desc: Open psql in the development PostgreSQL
    interactive: true
    cmds:
      - docker exec -it {{.DB_CONTAINER}} psql -U flagnetic -d flagnetic

  clean:
    desc: Remove build output
    cmds:
      - rm -rf bin coverage.out
      - find internal/infra/in/http/console/dist -mindepth 1 ! -name .gitkeep -delete
