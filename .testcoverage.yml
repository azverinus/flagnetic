# Coverage floors per layer, checked in CI and by `task cover`. Each file and
# each package of a layer must reach its layer's floor (the override rules
# apply to both). The floors are fixed: 90 for the domain, 80 for the
# other layers.
profile: coverage.out

override:
  - path: ^internal/domain/
    threshold: 90
  - path: ^internal/app/
    threshold: 80
  - path: ^internal/(infra|pkg|shared)/
    threshold: 80

exclude:
  paths:
    # The entry point holds no logic, and test helpers are not product code.
    - ^cmd/
    - ^internal/testkit/
    - ^internal/pkg/pgtest/
    # Generated code.
    - \.gen\.go$
