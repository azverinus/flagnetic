openapi: 3.1.0
info:
  title: Flagnetic SCIM API
  version: 1.0.0
  description: |
    SCIM 2.0 (RFC 7643/7644), served at `/scim/v2`, for an identity provider
    to create, find, update and deprovision the members it manages. It is its
    own document, with the `application/scim+json` media type and error
    shape, since none match the management API's.

    Authentication is a SCIM token in `Authorization: Bearer`, never a
    session cookie or a personal or project token. A SCIM token belongs for
    life to one auth provider and reaches only that provider's provisioned
    members: another provider's member is not found, and an email one holds
    is a 409 `uniqueness`. A token that is missing, malformed, unknown,
    revoked, expired or of a disabled provider is refused 401
    `invalidCredentials` alike, and a refused bearer counts against the
    brute-force throttle of the address it comes from, shared with local
    sign-in, invitation acceptance and password reset.

    `/Users` provisions members. A created member is active, belongs to the
    token's provider and holds no password; the management API refuses to
    change a provisioned member's email, name or status by hand (409
    `member_provisioned`). A member the instance already knows by email, in
    one of the provider's domains, who is not an instance admin and not
    another provider's, is adopted rather than created. `active: false` and
    `DELETE` deactivate the member in the transaction the write commits in,
    ending their sessions, personal tokens, invitations and password resets
    before the response is sent, and `active: true` reactivates them. Every
    write is recorded with the SCIM token as actor.

    Bodies are at most 64 KiB. Errors follow RFC 7644 §3.12:
    `application/scim+json`, `schemas` naming
    `urn:ietf:params:scim:api:messages:2.0:Error`, `status` as a string, and
    `scimType` for the errors it defines (`invalidFilter`, `invalidSyntax`,
    `invalidValue`, `mutability`, `uniqueness`, `noTarget`).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /scim/v2
security:
  - scimToken: []
paths:
  /ServiceProviderConfig:
    get:
      operationId: getServiceProviderConfig
      summary: What this server supports
      description: Patch, filter and pagination support, and the authentication scheme.
      responses:
        "200":
          description: The service provider's configuration.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ServiceProviderConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ResourceTypes:
    get:
      operationId: listResourceTypes
      summary: The resource types this server exposes
      description: The resource types served, as an RFC 7644 list response.
      responses:
        "200":
          description: The supported resource types.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ResourceTypeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /Schemas:
    get:
      operationId: listSchemas
      summary: The schemas this server's resources use
      description: The schemas of the resource types served, as an RFC 7644 list response.
      responses:
        "200":
          description: The supported schemas.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SchemaListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /Users:
    get:
      operationId: listUsers
      summary: List members SCIM provisions
      description: |
        `filter` compares attributes with `eq`, alone or joined by `and`:
        `userName`, `emails.value`, `externalId`, `displayName` or `id`; any
        other filter is 400 `invalidFilter`. `startIndex` is 1-based
        (default 1); `count` is from 0 to 100 (default 100), and 0 answers
        the total with no resources.
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/StartIndex"
        - $ref: "#/components/parameters/Count"
      responses:
        "200":
          description: A page of matching members.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createUser
      summary: Provision a member
      description: |
        Creates an active member managed by SCIM, with no credential:
        `userName` (wins over `emails[primary].value` when both are sent
        and differ) becomes the member's email. A taken email is 409
        `uniqueness`.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: The created member.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /Users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      summary: Read one member SCIM provisions
      responses:
        "200":
          description: The member.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceUser
      summary: Replace a member's mapped attributes
      description: |
        Replaces `userName`/`emails`, `displayName`/`name` and
        `externalId` at once. `active: false` deactivates in the same
        transaction, revoking sessions and tokens; `active: true`
        reactivates. A taken email is 409 `uniqueness`.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: The member as it now is.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      operationId: patchUser
      summary: Patch a member's mapped attributes
      description: |
        `add`, `replace` and `remove` on `userName`, `emails`,
        `displayName`, `name.givenName`, `name.familyName`, `externalId`
        and `active`. `active: false` deactivates in the same
        transaction, revoking sessions and tokens; `active: true`
        reactivates. A taken email is 409 `uniqueness`.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/PatchOp"
      responses:
        "200":
          description: The member as it now is.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteUser
      summary: Deprovision a member
      description: |
        Deactivates the member in the same transaction, revoking every
        session and personal token of theirs before the response is
        sent, and answers 204; the row is kept, never removed.
      responses:
        "204":
          description: The member was deactivated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    scimToken:
      type: http
      scheme: bearer
      description: A SCIM token, `fn_scim_…`.
  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: The member's `id`, as `GET /Users` lists it.
      schema:
        type: string
        format: uuid
    Filter:
      name: filter
      in: query
      description: An equality filter, for example `userName eq "jo@example.com"`.
      schema:
        type: string
    StartIndex:
      name: startIndex
      in: query
      description: 1-based index of the first result to return; 1 when absent.
      schema:
        type: integer
        minimum: 1
    Count:
      name: count
      in: query
      description: How many results to return at most, from 0 to 100; 100 when absent.
      schema:
        type: integer
        minimum: 0
        maximum: 100
  responses:
    BadRequest:
      description: The body or the filter is malformed (`invalidFilter`, or no `scimType`).
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        No usable SCIM bearer: missing, not `fn_scim_…`, unknown, revoked,
        expired or of a disabled provider (`invalidCredentials`), with
        `WWW-Authenticate: Bearer`. A refused bearer counts against the
        address's throttle; an address over it is answered 429.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No member of the token's provider has this id.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        Another member already holds this email or this `externalId`, or the
        email belongs to a member who cannot be adopted (`uniqueness`).
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Meta:
      type: object
      properties:
        resourceType:
          type: string
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        location:
          type: string
    Email:
      type: object
      properties:
        value:
          type: string
        primary:
          type: boolean
        type:
          type: string
    Name:
      type: object
      properties:
        givenName:
          type: string
        familyName:
          type: string
    User:
      type: object
      description: A member, mapped per the spec's attribute table.
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: [string, "null"]
        userName:
          type: string
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        active:
          type: boolean
        groups:
          type: array
          readOnly: true
          description: The groups the member belongs to; read only.
          items:
            $ref: "#/components/schemas/ResourceRef"
        meta:
          $ref: "#/components/schemas/Meta"
    ResourceRef:
      type: object
      description: A reference to another resource.
      required: [value]
      properties:
        value:
          type: string
          description: The referenced resource's `id`.
        display:
          type: string
          readOnly: true
        $ref:
          type: string
          readOnly: true
    UserListResponse:
      type: object
      required: [schemas, totalResults, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/User"
    ResourceTypeListResponse:
      type: object
      required: [schemas, totalResults, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceType"
    SchemaListResponse:
      type: object
      required: [schemas, totalResults, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/Schema"
    PatchOperation:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [add, replace, remove]
        path:
          type: string
        value: {}
    PatchOp:
      type: object
      required: [Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
        Operations:
          type: array
          items:
            $ref: "#/components/schemas/PatchOperation"
    ServiceProviderConfig:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
        patch:
          type: object
          properties:
            supported:
              type: boolean
        filter:
          type: object
          properties:
            supported:
              type: boolean
            maxResults:
              type: integer
        bulk:
          type: object
          properties:
            supported:
              type: boolean
        changePassword:
          type: object
          properties:
            supported:
              type: boolean
        sort:
          type: object
          properties:
            supported:
              type: boolean
        authenticationSchemes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              name:
                type: string
              description:
                type: string
    ResourceType:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        name:
          type: string
        endpoint:
          type: string
        schema:
          type: string
    Schema:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              multiValued:
                type: boolean
              mutability:
                type: string
    Error:
      type: object
      required: [schemas, status]
      properties:
        schemas:
          type: array
          items:
            type: string
        status:
          type: string
        scimType:
          type: string
        detail:
          type: string
