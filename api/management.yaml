      - $ref: "#/components/parameters/ExperimentKey"
    put:
      operationId: setExperimentDecisionNote
      summary: Change the note of a stopped experiment's decision
      description: |
        Sets the note of the decision, `""` clearing it; the outcome and the
        winner never change. Only a stopped experiment has a decision
        (`not_stopped`; `archived` for an archived one). A note has at most
        2,000 characters (`invalid_decision`, `too_long` on `/note`). The
        same note changes nothing and records nothing.
      x-permission: experiment.edit
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentDecisionNote"
