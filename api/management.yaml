        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/export:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: exportProject
      summary: Download the project's configuration as a project document
      description: |
        Writes the project's whole configuration as a project document, in
        JSON (the default, and the canonical encoding) or YAML (derived from
        it field for field): its environments in their order, unit types,
        declared attributes, segments, flags with their configuration in every
        environment, and experiments. A list whose order means something keeps
        it (a configuration's rules, a flag's variations, an experiment's
        weights, tags); every other list and map is by key, overrides by unit
        type then unit identifier and prerequisites by flag, so that two
        exports of an unchanged project are the same bytes. Rule identifiers and rollout
        salts are in it, which keep every unit in its bucket in a copy; owners
        are email addresses, and an override's note is in it and its author is
        not.

        Members, grants, tokens, SDK keys, webhook subscriptions, change
        requests, audit entries, events, the standard attributes and the
        discovered attributes are never in it.

        The `ETag` is the identifier of the project's latest audit entry,
        quoted: a later change to the project, whatever it touches, moves it.
        Reading the project is all it takes, so nothing is audited.
      x-permission: project.read
      tags: [transfer]
      parameters:
        - $ref: "#/components/parameters/DocumentFormat"
      responses:
        "200":
          description: |
            The project document, as an attachment named
            `{project key}-{UTC time, yyyymmddThhmmssZ}.{json|yaml}`.
          headers:
            ETag:
              schema:
                type: string
              description: The identifier of the project's latest audit entry, quoted.
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocument"
            application/yaml:
              schema:
                type: string
                format: binary
                description: The same document as YAML.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/import:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      operationId: importProject
      summary: Merge a project document into a project, or replace the project's configuration with it
      description: |
        With `mode=merge`, merges the document into the project: every
        environment, unit type, attribute, segment and flag it names is
        created, or updated when it differs from what the project has, by key,
        and everything else is left as it is. A section the document lacks is
        left untouched, so a partial document is applied as it is.

        With `mode=replace`, merges the document, which then holds every
        section and at least one environment, and then deletes what it does
        not name, in this order: experiments, flags, segments, attributes
        (never a standard one), unit types, environments; the project equals
        the document. Each deletion is the ordinary one and is recorded as it
        is, a flag that is not archived being archived first. An experiment the
        document lacks is deleted only while it is a draft; one that has
        started is 409 `not_draft`, naming every such experiment in `errors`
        and deleting nothing. Anything something still uses is not deleted: the
        import is 409 `in_use`, in a dry run too, listing in `references` all
        that still names what it would delete, such as a segment a rule serves,
        a flag another requires, or an experiment of the document holds, a
        declaration a rule uses, or an `sdk_key` of an environment, since an
        environment that holds SDK keys is never deleted by an import. A
        protected environment is not deleted either.

        The document is sent as
        `application/json` or `application/yaml`, as
        `GET /projects/{project}/export` writes it.

        The project's key never changes; its name and description are written
        when the document has a `project`. A flag the document names is
        written whole, with the configurations the document gives it; the
        configuration in an environment the document does not give is left as
        it is. The configurations keep the rule identifiers and rollout salts
        the document names, so every unit stays in its bucket; a rule or a
        rollout without one is given one, unless it equals a rule of the
        project's configuration, which it then is. A new environment gives
        every flag its initial configuration unless the document configures
        it.

        An existing environment keeps whether it is protected: a document that
        differs is answered with the warning `protection_kept`. New
        environments take the document's value. An owner the document names by
        email owns a flag when they may own in the project; otherwise a new
        flag is owned by the importing member and an existing one keeps its
        owner, with the warning `owner_replaced`. An override keeps its author
        when the document leaves it as it was and is the importer's otherwise.
        Protection is bypassed in every environment, and only the owner of a
        project, never a project token, may import.

        An experiment the project lacks is created exactly as the document has
        it: its status, both salts, its timestamps and its decision, so that
        a unit keeps its assignment; a draft may leave its salts out and is
        given two. It is judged as a create is, and by the history its status
        leaves behind: a started experiment has `started_at` and an
        `expected_end_at`, a stopped one `stopped_at` and a decision. A draft
        and a running experiment need a flag that is not archived and a declared
        unit type, a stopped one a declared unit type, and an archived one
        neither, so a stopped experiment outlives the flag it compared. An
        experiment that exists changes only as an ordinary edit of its status
        allows, never through its status: a field its status freezes, its
        status, its timestamps, its decision and its salts once it is past its
        draft are 409 `frozen`, naming every such field in `errors`, and a
        smaller traffic allocation of a running experiment is 409
        `traffic_allocation_decrease`. A larger one moves on the rulesets of
        the environments holding its rules and is recorded as
        `experiment.traffic_allocation_changed`. A rule serving an archived
        experiment is accepted. No salt is shared by two experiments, or by an
        experiment and a rollout.

        The import applies whole or not at all;
        a document that breaks a rule is 422 `invalid_document` with every fault
        found in `errors`, each pointing into the document.

        With `dry_run` the whole import runs, every check the database makes
        included, and is rolled back: same answer, nothing written. Every
        answer to a dry run carries an `ETag`, the identifier of the project's
        latest audit entry, which an import can send as `If-Match` to be
        refused when the project has moved since.

        Every entity that differs is written through the context that owns it
        and recorded as a direct write records it, then one `project.imported`
        entry, all with the request's identifier; an import that changes
        nothing writes nothing, records nothing and answers empty changes.
        Each environment whose ruleset changed moves on once. A body is
        accepted up to 32 MiB.
      x-permission: project.import
      x-max-body-bytes: 33554432
      tags: [transfer]
      parameters:
        - name: mode
          in: query
          required: true
          description: How the document is applied, `merge` or `replace`.
          schema:
            type: string
            enum: [merge, replace]
        - $ref: "#/components/parameters/ImportDryRun"
        - $ref: "#/components/parameters/ImportIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: binary
              description: A `ProjectDocument` as JSON.
          application/yaml:
            schema:
              type: string
              format: binary
              description: A `ProjectDocument` as YAML.
      responses:
        "200":
          description: What the import did, or with a dry run would do.
          headers:
            ETag:
              schema:
                type: string
              description: |
                On a dry run, the identifier of the project's latest audit
                entry, quoted; absent for a project that has none, and on an
                import that was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          description: "`unsupported_media_type`: the document is not sent as `application/json` or `application/yaml`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/import/firebase:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      operationId: importFirebaseTemplate
      summary: Merge a Firebase Remote Config template into one environment of a project
      description: |
        Translates a Firebase Remote Config template, as the Remote Config REST
        API and `firebase remoteconfig:get` return it, into flags and rules and
        merges them into one environment. Fields of the template this server
        does not use are ignored, so a template from a newer Firebase imports.

        A parameter, top level or in a group, becomes a flag with the same key;
        its group is a tag. The default value is the flag's off and fallthrough
        variation, and each conditional value becomes one rule per alternative
        of its condition, in the template's order of conditions, described
        `Firebase condition "<name>"`. A new flag is on in the environment and
        off in the others. A flag the project has keeps its name, owner, other
        environments, prerequisites and overrides, gains the variations it
        lacks, and has its description replaced only by a non-empty one; a rule
        equal to one it has keeps its identifier and salt, so importing a
        template again changes nothing. A flag of another type is 422
        `type_immutable`.

        What cannot be reproduced is answered as a warning with a pointer into
        the template: `in_app_default`, `condition_skipped`,
        `rollout_reshuffled`, `attribute_declared`, `rule_limit` and
        `archived_flag`. A template that cannot be translated, an
        `environment` or a `unit_type` the project lacks is 422
        `invalid_document` with every fault found in `errors`; a fault of the
        query points at `/query/environment` or `/query/unit_type`.

        Like any import it applies whole or not at all, bypasses protection,
        records each entity it writes and then one `project.imported` entry
        with the source `firebase`, and with `dry_run` runs and rolls back,
        answering an `ETag` that `If-Match` can send back. Only the owner of a
        project, never a project token, may import. A body is accepted up to
        32 MiB.
      x-permission: project.import
      x-max-body-bytes: 33554432
      tags: [transfer]
      parameters:
        - name: environment
          in: query
          required: true
          description: The key of the environment the template is merged into.
          schema:
            type: string
        - name: unit_type
          in: query
          description: The key of the unit type percent rollouts bucket on; `anonymous` unless given.
          schema:
            type: string
            default: anonymous
        - $ref: "#/components/parameters/ImportDryRun"
        - $ref: "#/components/parameters/ImportIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: binary
              description: A Remote Config template as JSON.
      responses:
        "200":
          description: What the import did, or with a dry run would do.
          headers:
            ETag:
              schema:
                type: string
              description: |
                On a dry run, the identifier of the project's latest audit
                entry, quoted; absent for a project that has none, and on an
                import that was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirebaseImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          description: "`unsupported_media_type`: the template is not sent as `application/json`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/environments:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listEnvironments
      summary: The project's environments
      x-permission: project.read
      tags: [environments]
      responses:
        "200":
          description: The environments, by sort order.
          content:
            application/json:
