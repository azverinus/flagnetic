        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/import:
    post:
      operationId: importNewProject
      summary: Create a project from a project document
      description: |
        Creates a project holding exactly the document: its environments (at
        least one), unit types, declared attributes, segments, flags with
        their configuration in every environment and experiments, besides the standard
        attributes every project has; no default environment or unit type is
        added. The document is sent as `application/json` or
        `application/yaml`, as `GET /projects/{project}/export` writes it, and
        its sections are all required. `key` and `name` replace the
        document's project key and name.

        The copy keeps every rule identifier and rollout salt the document
        names, so every unit is bucketed as in the original; a rule or a
        rollout without one is given one. An owner the document names by email
        owns the entity when they may own in the new project, which no member
        but an instance admin may yet; otherwise the importing member does and
        the answer warns `owner_replaced` with the address. Protection is
        bypassed in every environment, which take `protected` from the
        document.

        Every experiment is created exactly as the document has it, its
        status, both salts, its timestamps and its decision, so that a unit
        keeps its assignment; a draft may leave its salts out and is given two.
        It is judged as a create is, and by the history its status leaves
        behind. A draft and a running experiment need a flag that is not
        archived and a declared unit type, a stopped one a declared unit type,
        and an archived one neither. No salt is shared by two experiments, or
        by an experiment and a rollout.

        The import applies whole or not at all. A document that breaks a rule
        is refused 422 `invalid_document` with every fault found in `errors`,
        each pointing into the document; `schema_version_unsupported` names
        the versions this server reads. A key in use is 409 `already_exists`.
        With `dry_run` the whole import runs, every check the database makes
        included, and is rolled back: same answer, 200, nothing written.

        Every entity created is recorded as a direct write records it, then
        one `project.imported` entry, all with the request's identifier; each
        environment's ruleset moves on once. A body is accepted up to 32 MiB.
      x-permission: instance_admin
      x-max-body-bytes: 33554432
      tags: [transfer]
      parameters:
        - name: key
          in: query
          description: The new project's key, replacing the document's.
          schema:
            type: string
        - name: name
          in: query
          description: The new project's name, replacing the document's.
          schema:
            type: string
        - $ref: "#/components/parameters/ImportDryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: binary
              description: A `ProjectDocument` as JSON.
          application/yaml:
            schema:
              type: string
              format: binary
              description: A `ProjectDocument` as YAML.
      responses:
        "200":
          description: The project the document would create, for a dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "201":
          description: The project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          description: "`unsupported_media_type`: the document is not sent as `application/json` or `application/yaml`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: getProject
      summary: A project
      x-permission: project.read
      tags: [projects]
      responses:
        "200":
          description: The project.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: Rename a project or change its description
      description: The key never changes; sending one is refused with `key_immutable`.
      x-permission: project.update
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: The project as changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: |
        Deletes the project and everything in it at once: its environments,
        flags, segments, experiments, change requests, grants, SDK keys,
        project tokens and webhook subscriptions. Its key is free for a new
        project as soon as the deletion is done, and its SDK keys are refused
        on every replica, their streams closed. There is no restore. Its
        audit entries stay, keeping the project's identifier: an instance
        admin reads them through `GET /audit?project=`. The
        deletion is recorded in the instance's log as `project.deleted`,
        with no project and the deleted project's `id`, `key` and `name` in
        `before`. Rows that refer to the project without a foreign key are
        purged in the background; raw events age out with their retention.
        An API token is refused `session_required`, so a leaked token cannot
        erase a project.
      x-permission: project.delete
      x-session-required: true
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/me:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: getProjectMe
      summary: What the caller holds in a project
      description: |
        The caller's grants in the project and their effective permissions
        there: the union of the grants' roles (every permission for an
        instance admin), narrowed by the scopes of the credential in use.
      x-permission: project.read
      tags: [projects]
      responses:
        "200":
          description: The caller's grants and permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMe"
        "401":
