      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/EnvironmentKey"
      - $ref: "#/components/parameters/UnitTypeKey"
      - name: unit_id
        in: path
        required: true
        description: The unit's ID, of 1 to 256 bytes.
        schema:
          type: string
    put:
      operationId: putOverride
      summary: Pin a variation for one unit
      description: |
        Sets one override without replacing the configuration, and needs
        no `If-Match`; the configuration's version still moves on. An
        override of the unit is replaced, variation and note together, and
        written by the caller; another is added, up to 200. Validated like
        an override of a whole configuration (`invalid_configuration`).
        Setting what the override already is changes nothing.
      x-permission: flag_configuration.update
      tags: [flags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverridePut"
      responses:
        "200":
          description: The configuration as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagConfiguration"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteOverride
      summary: Remove the override of one unit
      description: |
        Removes one override without replacing the configuration, and needs
        no `If-Match`; the configuration's version still moves on. A unit
        without an override is `not_found`.
