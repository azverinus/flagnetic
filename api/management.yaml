              schema:
                $ref: "#/components/schemas/Flag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/flags/{flag}/environments/{environment}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    get:
      operationId: getFlagConfiguration
      summary: A flag's configuration in one environment
      x-permission: project.read
      tags: [flags]
      responses:
        "200":
          description: The configuration; its `ETag` is the configuration's version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagConfiguration"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putFlagConfiguration
      summary: Replace a flag's configuration in one environment
      description: |
        Replaces the whole configuration: on or off, the off and fallthrough
        variations, prerequisites, overrides and rules, in one change. Every
        name in it is checked against the project (`invalid_configuration`,
        with a JSON Pointer to each field to fix): variations of this flag
        and of the flags it requires, declared attributes and unit types,
        existing segments, flags that are not archived, prerequisite chains
        that are acyclic and at most 5 flags deep in the environment
        (`prerequisite_cycle`, `prerequisite_too_deep` with the chain's
        flag keys in `params.path`), and the limits (`too_many` with
        `params.max`). A new rule omits `id` and is given one; a rule sent
        with an `id` is the rule of the current configuration it names
        (`unknown_rule` otherwise). A new rollout is given a salt, which
        then changes only through regenerating it. An override left as it
        was keeps the member who wrote it; any other is written by the
        caller. A configuration of an archived flag is not written
        (`archived`). A change to the values the configuration already has
        changes nothing and records nothing.
      x-permission: flag_configuration.update
      tags: [flags]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagConfigurationPut"
      responses:
        "200":
          description: The configuration as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/flags/{flag}/environments/{environment}/kill:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    post:
      operationId: killFlag
      summary: Switch a flag off in one environment at once
      description: |
        The kill switch: switches the flag off in the environment, so it
        serves its off variation to everyone, and changes nothing else. It
        needs no `If-Match`, so it is never refused for an old page, and
        still moves the configuration's version on. A flag already off
        changes nothing and records nothing (`changed` false). The audit
        entry carries the reason and is marked as a kill switch, which the
        audit log is filtered by.
      x-permission: flag_configuration.kill
      tags: [flags]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Kill"
      responses:
        "200":
          description: Whether the flag was switched off, and the configuration as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/flags/{flag}/environments/{environment}/revert:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    post:
      operationId: revertFlagConfiguration
      summary: Revert a flag's configuration in one environment to an earlier version
      description: |
        Writes, whole, the configuration this flag had in this environment
        at `version`, as the audit log recorded it: on or off, the off and
        fallthrough variations, prerequisites, overrides with their notes
        and authors, and rules with their identifiers and salts, so the same
        units fall in every rollout again. The version is looked up only in
        the history of this flag in this environment (`version_not_found`
        otherwise). The configuration is validated as replacing it would be
        (`invalid_configuration`, its pointers into the configuration the
        revert would write), so a variation, segment, attribute or flag
        removed since refuses it. `If-Match` names the current version, not
        the one reverted to. A revert that would add or remove a rule
        serving an experiment, or change which experiment a rule serves, is
        refused `experiment_rules_changed` (409, before the document is
        validated): whether an experiment runs lives on the experiment, so
        an experiment reaches or leaves an environment only through an
        explicit rule edit. Reverting to what the configuration already is
        changes nothing and records nothing.
      x-permission: flag_configuration.revert
      tags: [flags]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagConfigurationRevert"
      responses:
        "200":
          description: The configuration as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/flags/{flag}/environments/{environment}/copy:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    post:
      operationId: copyFlagConfiguration
      summary: Copy a flag's configuration from another environment
      description: |
        Makes the flag's configuration in this environment what it is in
        environment `from`: its rules with their identifiers and salts, so
        the same units fall in every rollout in both environments, its
        prerequisites, and its off and fallthrough variations. This
        environment keeps whether the flag is on or off, so a copy never
        switches it on by accident, and keeps its overrides unless
        `include_overrides` asks for the source's, with their notes and
        authors. Validated as replacing the configuration would be
        (`invalid_configuration`, its pointers into the configuration the
        copy would write); copying from this environment itself is
        `invalid_configuration`. A copy that would add or remove a rule
        serving an experiment in this environment, or change which
        experiment a rule serves, is refused `experiment_rules_changed`
        (409, before the document is validated): an experiment reaches
        another environment only through an explicit rule edit. `If-Match`
        names this environment's version. A copy that changes nothing
        records nothing.
      x-permission: flag_configuration.update
      tags: [flags]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagConfigurationCopy"
      responses:
        "200":
          description: The configuration as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/flags/{flag}/environments/{environment}/overrides/{unit_type}/{unit_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/EnvironmentKey"
      - $ref: "#/components/parameters/UnitTypeKey"
      - name: unit_id
        in: path
        required: true
        description: The unit's ID, of 1 to 256 bytes.
        schema:
          type: string
    put:
      operationId: putOverride
      summary: Pin a variation for one unit
      description: |
        Sets one override without replacing the configuration, and needs
        no `If-Match`; the configuration's version still moves on. An
        override of the unit is replaced, variation and note together, and
        written by the caller; another is added, up to 200. Validated like
        an override of a whole configuration (`invalid_configuration`).
        Setting what the override already is changes nothing.
      x-permission: flag_configuration.update
      tags: [flags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverridePut"
      responses:
        "200":
          description: The configuration as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagConfiguration"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteOverride
      summary: Remove the override of one unit
      description: |
        Removes one override without replacing the configuration, and needs
        no `If-Match`; the configuration's version still moves on. A unit
        without an override is `not_found`.
      x-permission: flag_configuration.update
      tags: [flags]
      responses:
        "200":
          description: The configuration as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagConfiguration"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{project}/flags/{flag}/environments/{environment}/rules/{rule}/regenerate-salt:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/EnvironmentKey"
