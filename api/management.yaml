          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createChangeRequest
      summary: Propose a change
      description: |
        Proposes a change as a change request, as a draft or, with `open`,
        opened for review at once. The caller, a member or a project token,
        is its author. A `flag_configuration` change request names a `flag`
        and an `environment` and proposes a `FlagConfigurationPut`; a
        `definition` names one `flag`, proposing a `FlagDefinitionPut`, or
        one `segment`, proposing a `SegmentDefinitionPut`, and no
        environment, since a definition is applied in every environment
        (`invalid_change_request` naming the field otherwise). It is based on
        the entity as it is now, and `diff` is the RFC 6902 patch from it to
        `proposed`. `proposed` is checked as writing it directly would be,
        with the same refusals under `/proposed` (`invalid_configuration`,
        `archived`, `invalid_flag`, `invalid_segment`, `in_use`). In a
        configuration, a rule `id` the configuration has no rule with, and a
        `salt` that is not that rule's, are left out, so the rule is a new
        one; new rules and rollouts are given an identifier and a salt,
        which `proposed` holds. A title of 1 to 200 characters is required
        and a description has at most 10,000 (`invalid_change_request`).
        `apply_at` schedules the change request: once approved, the system
        applies it at that time, or as soon after as a replica runs. It is at
        least `FLAGNETIC_SCHEDULE_MIN_LEAD` (60 seconds by default) and at
        most 365 days ahead (`invalid_change_request`, `too_soon` or
        `too_late` under `/apply_at`), and answered in UTC.

        A `flag_configuration` change request given `revert_to`, a version
        of the configuration, instead of `proposed` proposes reverting to
        it: the server fills `proposed` with the configuration that version
        was, whole, rule identifiers and salts included, as a direct revert
        writes it, with the same refusals (`version_not_found`;
        `experiment_rules_changed`, 409; `invalid_configuration` under
        `/proposed`). Giving both, neither, or `revert_to` on another kind
        is `invalid_change_request`.
      x-permission: change_request.propose
      tags: [change-requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRequestCreate"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
