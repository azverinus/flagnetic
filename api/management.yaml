      responses:
        "200":
          description: The change request as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/change-requests/{change_request}/rebase:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ChangeRequestID"
    post:
      operationId: rebaseChangeRequest
      summary: Base a draft change request on the configuration as it is now
      description: |
        Keeps what is proposed and recomputes `diff` from the configuration
        as it is now, which becomes `base_version`. Only the author rebases
