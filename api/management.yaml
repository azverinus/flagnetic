openapi: 3.0.3
info:
  title: Flagnetic management API
  version: "1"
  description: |
    The API everything in the console is built on, for scripts and pipelines
    too. It is served under `/api/v1`.

    Every operation declares what it requires in `x-permission`: a permission
    of the catalog, which a caller holds in a project through the roles they
    were granted there, or one of `public` (anyone), `member` (any credential
    acting for a member) and `instance_admin`. An API token is further
    narrowed by its scopes: each permission falls under one scope, and a token
    exercises it only when it carries that scope. Operations marked
    `x-session-required` refuse every API token. Operations marked
    `x-opens-session` or `x-json-only` accept a body sent as
    `application/json` only (`415 unsupported_media_type` otherwise);
    operations marked
    `x-checks-password` accept a body of 8 KiB at most
    (`413 request_too_large` otherwise).

    A script authenticates with an API token as a bearer; the console with
    the session cookie `POST /auth/sign-in` sets. When a request carries both,
    the token is judged and the cookie ignored. A request authenticated by
    the cookie, a read included, is refused `cross_origin` when the browser
    says it comes from another origin.

    Errors are problem documents (RFC 9457) with a stable `code`.

    Every versioned entity (project, environment, unit type, attribute,
    flag definition, flag configuration and segment) carries a `version`,
    which counts its accepted changes from 1 and is answered as a strong
    `ETag` (`"7"`) on every read of the entity and every write. A write
    changing or deleting one names the version it was based on in
    `If-Match`, quoted (`"7"`) or bare (`7`): without it the write is refused
    `428 precondition_required`, and when the entity moved on since,
    `412 version_mismatch` with the version it has now in `current_version`,
    so two people editing the same entity never overwrite each other
    unseen. Both are judged after the request is validated. The kill switch
    and the writes of a single override need no `If-Match`, and still move
    the configuration's version on. A write that changes nothing stores
    nothing, keeps the version, records nothing and answers the entity as it
    is.

    In a protected environment, a write that would change what its SDKs
    receive, whatever entity it touches, is refused
    `403 change_request_required`, judged after validation and `If-Match`;
    nothing of the write is kept, in any environment. The kill switch is
    the one exception.
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []
paths:
  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with an email and a password
      description: |
        Opens a fresh session and sets its cookie. A wrong email, a wrong
        password and a member who may not sign in all get the same
        `invalid_credentials`, in comparable time. The body must be sent as
        `application/json`, which a form on another site cannot send;
        anything else is refused `unsupported_media_type`.

        Each attempt counts as a failure of its email and of its address
        before the password is checked, and is taken back when the password
        was right or could not be checked. Five consecutive failures lock the
        email, a hundred from one address in fifteen minutes throttle the
        address; either is refused before the password is checked. An
        address (an IPv6 one with the rest of its /64) the member signed in
        from, or accepted their invitation from, within thirty days is not
        refused by the email's lock: its
        failures on the email are counted apart and lock it alone, after the
        same five, so a stranger locking the email does not keep the member
        out where they usually sign in.

        A password is no way in for an email whose domain is enforced to an
        auth provider (`sso_required`, naming the `provider` to sign in
        through) nor, while local login is disabled, for anybody
        (`local_login_disabled`). Both are judged from the email alone,
        before anything is looked up or counted, whoever holds it.
      x-permission: public
      x-opens-session: true
      x-checks-password: true
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in. The body is the caller, as `GET /me` answers it.
          headers:
            Set-Cookie:
              description: The session cookie `flagnetic_session`, `HttpOnly; Path=/; SameSite=Lax`, `Secure` unless the console is served over plain HTTP on localhost or with `FLAGNETIC_INSECURE_COOKIES`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PasswordRefused"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "503":
          $ref: "#/components/responses/Busy"
  /auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out
      description: Ends the session the request is signed in to and clears its cookie. An API token has no session to end and is refused `session_required`, so a script never believes it ended something.
      x-permission: member
      x-session-required: true
      tags: [auth]
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: The session cookie, cleared.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/methods:
    get:
      operationId: getAuthMethods
      summary: How members sign in
      description: |
        The ways the sign-in page offers, read before anyone is signed in.
        Given an `email`, it also says where that email signs in: the
        `enforced_provider` its domain is enforced to. The answer is judged
        from the email's domain alone, so it never tells whether a member
        holds the email.
      x-permission: public
      security: []
      tags: [auth]
      parameters:
        - name: email
          in: query
          required: false
          description: The email the person typed, to learn where it signs in.
          schema:
            type: string
      responses:
        "200":
          description: The sign-in methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/invitations/{secret}:
    parameters:
      - name: secret
        in: path
        required: true
        description: The invitation's secret, the last segment of the link its issuer passed on.
        schema:
          type: string
    get:
      operationId: getInvitation
      summary: What an invitation's link opens
      description: |
        Read before anyone is signed in, to show the invited person whose
        invitation it is. An invitation that cannot be accepted, whether it
        was never issued, has been used or replaced, or has expired, is
        `invitation_gone`, alike. The secret never reaches a log line.
        `password_allowed` says whether the invitation can be accepted with
        a password; when the invited email's domain is enforced to an auth
        provider, `enforced_provider` names it, the only way to accept.
        `providers` lists the auth providers signing in through which
        accepts it: those whose domains hold the invited email. Signing in
        through one activates the invited member and makes the grant the
        invitation carries, without a password.
      x-permission: public
      security: []
      tags: [auth]
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "410":
          $ref: "#/components/responses/InvitationGone"
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Sets the invited member's first password under the password policy
        (`weak_password` otherwise), makes them active, uses up the link and
        opens a session, setting its cookie. A password is refused, and the
        invitation stays open, when the invited email's domain is enforced
        to an auth provider (`sso_required`, naming the `provider`) or local
        login is disabled (`local_login_disabled`). The body must be sent as
        `application/json`; anything else is refused
        `unsupported_media_type`.

        Each attempt counts as a failure of its address before the secret is
        looked up, and is taken back once the secret opens an invitation: a
        hundred failures from one address in fifteen minutes, sign-ins
        included, throttle the address (`rate_limited`).
      x-permission: public
      x-opens-session: true
      x-checks-password: true
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptance"
      responses:
        "200":
          description: Accepted and signed in. The body is the caller, as `GET /me` answers it.
          headers:
            Set-Cookie:
              description: The session cookie `flagnetic_session`, as sign-in sets it.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PasswordRefused"
        "410":
          $ref: "#/components/responses/InvitationGone"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "503":
          $ref: "#/components/responses/Busy"
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password reset by mail
      description: |
        For a member who forgot their password. Answers `202 Accepted` at
        once whoever the email belongs to, whether or not anything comes of
        it, so the answer reveals nothing about which addresses exist. The
        lookup, the issuing and the mail happen after the answer.

        Every request counts as a failure against the address's throttle,
        which sign-in, invitation acceptance and password reset completion
        share: past a hundred from one address in fifteen minutes it is
        refused `429 rate_limited` with `Retry-After`, whether or not the
        email exists.

        A password reset is mailed, to the member in their language,
        only when the instance has an SMTP server and self-service password
        reset is on in the auth settings, local login is enabled and the
        email's domain is not enforced to an auth provider, the email
        belongs to an active member who holds a password, and no self-service reset was issued
        for them in the last 5 minutes (a reset counts when it was issued,
        even if its mail could not be sent). The link opens
        `/password-reset/{secret}` in the console, works once and expires
        after an hour; completing it is `POST /auth/password-reset/{secret}`.
        A reset issued is audited `password.reset_requested`.

        The body must be sent as `application/json`, at most 8 KiB;
        anything else is refused `unsupported_media_type`.
      x-permission: public
      x-json-only: true
      x-max-body-bytes: 8192
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: The request was received. Nothing more is said.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/password-reset/{secret}:
    parameters:
      - name: secret
        in: path
        required: true
        description: The password reset's secret, the last segment of the link an instance admin passed on.
        schema:
          type: string
    get:
      operationId: getPasswordReset
      summary: What a password reset's link opens
      description: |
        Read before anyone is signed in, to show whose password the link
        sets. A password reset that cannot be completed, whether it was never
        issued, has been used or ended by another, has expired, or belongs to
        a member who is not active, is `reset_gone`, alike. The secret never
        reaches a log line.
      x-permission: public
      security: []
      tags: [auth]
      responses:
        "200":
          description: The password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordReset"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "410":
          $ref: "#/components/responses/PasswordResetGone"
    post:
      operationId: completePasswordReset
      summary: Complete a password reset
      description: |
        Sets the member's new password under the password policy
        (`weak_password` otherwise), clears the lockout on their email, signs
        them out of every device, ends every other open password reset and
        invitation of theirs, and opens a session, setting its cookie. A
        password is refused, and the reset stays open, when the member's
        email domain is enforced to an auth provider (`sso_required`, naming
        the `provider`) or local login is disabled
        (`local_login_disabled`). The
        body must be sent as `application/json`; anything else is refused
        `unsupported_media_type`.

        Each attempt counts as a failure of its address before the secret is
        looked up, and is taken back once the secret opens a password reset:
        a hundred failures from one address in fifteen minutes, sign-ins
        included, throttle the address (`rate_limited`).
      x-permission: public
      x-opens-session: true
      x-checks-password: true
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompletion"
      responses:
        "200":
          description: Reset and signed in. The body is the caller, as `GET /me` answers it.
          headers:
            Set-Cookie:
              description: The session cookie `flagnetic_session`, as sign-in sets it.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PasswordRefused"
        "410":
          $ref: "#/components/responses/PasswordResetGone"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "503":
          $ref: "#/components/responses/Busy"
  /me:
    get:
      operationId: getMe
      summary: Who the caller is
      description: The member the credential in use acts for, the credential itself, the address the request came from, and the instance's bound on an API token's expiry, which every caller may read.
      x-permission: member
      tags: [me]
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateMe
      summary: Rename yourself or choose your console language
      description: |
        Changes the fields sent and leaves the others as they are: the
        display name, and the console language, where null follows the
        browser. A change that changes nothing records no audit entry. Only
        a session may do this, so a leaked token cannot rename its owner.
      x-permission: member
      x-session-required: true
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePatch"
      responses:
        "200":
          description: The caller as changed, as `GET /me` answers it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /me/password:
    post:
      operationId: changeMyPassword
      summary: Change your password
      description: |
        Sets a new password once the current one is proved, and revokes
        every other session of the caller, so a device that learned the old
        password is signed out; the session this request is signed in to
        stays. The new password is held to the password policy
        (`weak_password` at `/new_password`) before anything is hashed, so a
        weak new password is refused without the current one being checked
        or counted. A wrong current password is refused 422
        `invalid_credentials` with a violation at `/current_password` (not
        401: the caller is signed in and stays so) and counts as a failure
        of the caller's email and address like a wrong sign-in: the fifth
        wrong attempt locks the email, or, from an address the caller signed
        in from within thirty days, the email from that address, and the
        attempts after it are refused `locked`, so a session cannot be used
        to guess the password. Only a session may do this.
      x-permission: member
      x-session-required: true
      x-checks-password: true
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed; every other session is revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "503":
          $ref: "#/components/responses/Busy"
    delete:
      operationId: removeMyPassword
      summary: Remove your password
      description: |
        Removes the caller's password, so they sign in only through the
        auth providers they linked. Refused 409 `last_auth_method` when no
        other usable way in remains: an identity at an enabled auth provider.
        A member who holds no password is answered 204 and nothing is
        recorded. Removing a password ends the member's open invitations and
        password resets, as changing it does, so an old link cannot set one
        again. The caller's sessions stay. Recorded as `password.removed`.
        Only a session may do this.
      x-permission: member
      x-session-required: true
      tags: [me]
      responses:
        "204":
          description: Removed, or the caller held no password.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /me/identities:
    get:
      operationId: listMyIdentities
      summary: Your ways to sign in
      description: |
        Whether the caller holds a password and when they set it, and the
        identities they linked at auth providers, oldest first, with when
        each last signed in. An identity at a disabled auth provider is
        listed with `provider_enabled` false: it is no way in until the
        provider is enabled again.
      x-permission: member
      tags: [me]
      responses:
        "200":
          description: The caller's password status and identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAuthMethods"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/identities/{provider}/link:
    parameters:
      - $ref: "#/components/parameters/AuthProviderSlug"
    post:
      operationId: linkMyIdentity
      summary: Link an auth provider to your account
      description: |
        Starts linking an identity at an enabled auth provider to the caller,
        answered with the address to send the browser to. The attempt is bound
        to the browser through the same cookie a sign-in sets, and to the
        session this request is signed in to: completing it from another
        browser, or after that session ended, links nothing. Completing it
        links the subject the provider vouches for to the caller, whatever its
        email, and returns the browser to `return_to`, a path of this
        instance, `/settings` when absent or not one. Recorded as
        `identity.linked`. When the subject is already linked to another
        member nothing is linked and the browser lands on the settings page
        with `error=identity_linked`; any other failure lands there with its
        sign-in code. A disabled or unknown provider is not found. Only a
        session may do this.
      x-permission: member
      x-session-required: true
      tags: [me]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityLinkStart"
      responses:
        "200":
          description: Where to send the browser.
          headers:
            Set-Cookie:
              description: The cookie that binds the attempt to this browser.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityLinkStarted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/BadGateway"
  /me/identities/{identity}:
    parameters:
      - $ref: "#/components/parameters/IdentityID"
    delete:
      operationId: unlinkMyIdentity
      summary: Unlink one of your identities
      description: |
        Unlinks an identity of the caller. Refused 409 `last_auth_method`
        when it is the caller's last usable way in: the other ways are a
        password local login accepts for the caller's email and identities
        at enabled auth providers that SSO enforcement allows. Unlinking an
        identity that is no way in, such as one at a disabled auth provider,
        is always allowed. The identity at the auth provider the caller's
        email domain is enforced to is refused 409 `provider_enforced`. An identity of another member, or an identifier that names
        none, is not found. Recorded as `identity.unlinked`. Only a session
        may do this.
      x-permission: member
      x-session-required: true
      tags: [me]
      responses:
        "204":
          description: Unlinked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /me/sessions:
    get:
      operationId: listMySessions
      summary: The caller's sessions
      description: |
        Every device the caller is signed in on, newest first, the one this
        request is signed in to marked `current`. Sessions that have ended
        are left out. A request with an API token marks none current.
      x-permission: member
      tags: [me]
      responses:
        "200":
          description: The live sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: revokeMySessions
      summary: Sign out every other device
      description: |
        Revokes every live session of the caller but the one this request is
        signed in to, or that one too with `include_current`, which then
        clears its cookie. Only a session may do this, so a leaked token
        cannot sign its owner out.
      x-permission: member
      x-session-required: true
      tags: [me]
      parameters:
        - name: include_current
          in: query
          description: Revoke the session this request is signed in to as well.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The number of sessions revoked.
          headers:
            Set-Cookie:
              description: The session cookie, cleared when the current session was revoked.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/sessions/{session}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    delete:
      operationId: revokeMySession
      summary: Sign out one device
      description: |
        Revokes one live session of the caller; revoking the one this request
        is signed in to clears its cookie. A session of another member, one
        that has ended or an identifier that names none is not found.
      x-permission: member
      x-session-required: true
      tags: [me]
      responses:
        "204":
          description: Revoked.
          headers:
            Set-Cookie:
              description: The session cookie, cleared when the session revoked is the current one.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/tokens:
    get:
      operationId: listMyTokens
      summary: The caller's personal access tokens
      description: |
        Every personal access token of the caller, the newest first, revoked
        and expired ones included, by their hint: a token's value is shown
        only when it is created.
      x-permission: member
      tags: [me]
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createMyToken
      summary: Create a personal access token
      description: |
        Creates a personal access token acting for the caller and answers its
        value, shown this once and never again. It carries `read` alone
        unless asked for more, and `read` beside every write scope; a scope
        the caller does not hold, `instance:admin` for a member who is no
        instance admin, is refused `scope_not_allowed`. Its expiry lies in
        the future and at most the instance's maximum token lifetime ahead,
        and is required when the instance requires one; without one the
        token never expires. Only a session creates a token, so a leaked
        token can never multiply itself or outlive its revocation.
      x-permission: member
      x-session-required: true
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: The token, with its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /me/tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeMyToken
      summary: Revoke a personal access token
      description: |
        Revokes one of the caller's tokens, which is refused `token_revoked`
        from then on. A token of another member, one already revoked or an
        identifier that names none is not found. Only a session may do this,
        so a leaked token cannot hide its siblings.
      x-permission: member
      x-session-required: true
      tags: [me]
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
