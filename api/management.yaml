      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ChangeRequestID"
    post:
      operationId: cancelChangeRequest
      summary: Cancel a change request
      description: |
        The author, or a member holding `change_request.approve`, cancels
        a draft, open or approved change request (`not_author`,
        `invalid_state`). A cancelled change request is final; copying it
        resumes its work.
      x-permission: change_request.propose
      tags: [change-requests]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
