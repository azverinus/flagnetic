openapi: 3.0.3
info:
  title: Flagnetic management API
  version: "1"
  description: |
    The API everything in the console is built on, for scripts and pipelines
    too. It is served under `/api/v1`.

    Every operation declares what it requires in `x-permission`: a permission
    of the catalog, which a caller holds in a project through the roles they
    were granted there, or one of `public` (anyone), `member` (any credential
    acting for a member) and `instance_admin`. An API token is further
    narrowed by its scopes: each permission falls under one scope, and a token
    exercises it only when it carries that scope. Operations marked
    `x-session-required` refuse every API token. Operations marked
    `x-opens-session` accept a body sent as `application/json` only
    (`415 unsupported_media_type` otherwise); operations marked
    `x-checks-password` accept a body of 8 KiB at most
    (`413 request_too_large` otherwise).

    A script authenticates with an API token as a bearer; the console with
    the session cookie `POST /auth/sign-in` sets. When a request carries both,
    the token is judged and the cookie ignored. A request authenticated by
    the cookie, a read included, is refused `cross_origin` when the browser
    says it comes from another origin.

    Errors are problem documents (RFC 9457) with a stable `code`.
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []
paths:
  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with an email and a password
      description: |
        Opens a fresh session and sets its cookie. A wrong email, a wrong
        password and a member who may not sign in all get the same
        `invalid_credentials`, in comparable time. The body must be sent as
        `application/json`, which a form on another site cannot send;
        anything else is refused `unsupported_media_type`.

        Each attempt counts as a failure of its email and of its address
        before the password is checked, and is taken back when the password
        was right or could not be checked. Five consecutive failures lock the
        email, a hundred from one address in fifteen minutes throttle the
        address; either is refused before the password is checked.
      x-permission: public
      x-opens-session: true
      x-checks-password: true
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in. The body is the caller, as `GET /me` answers it.
          headers:
            Set-Cookie:
              description: The session cookie `flagnetic_session`, `HttpOnly; Path=/; SameSite=Lax`, `Secure` unless the console is served over plain HTTP on localhost or with `FLAGNETIC_INSECURE_COOKIES`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "503":
          $ref: "#/components/responses/Busy"
  /auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out
      description: Ends the session the request is signed in to and clears its cookie. An API token has no session to end and is refused `session_required`, so a script never believes it ended something.
      x-permission: member
      x-session-required: true
      tags: [auth]
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: The session cookie, cleared.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/methods:
    get:
      operationId: getAuthMethods
      summary: How members sign in
      description: The ways the sign-in page offers, read before anyone is signed in.
      x-permission: public
      security: []
      tags: [auth]
      responses:
        "200":
          description: The sign-in methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/invitations/{secret}:
    parameters:
      - name: secret
        in: path
        required: true
        description: The invitation's secret, the last segment of the link its issuer passed on.
        schema:
          type: string
    get:
      operationId: getInvitation
      summary: What an invitation's link opens
      description: |
        Read before anyone is signed in, to show the invited person whose
        invitation it is. An invitation that cannot be accepted, whether it
        was never issued, has been used or replaced, or has expired, is
        `invitation_gone`, alike. The secret never reaches a log line.
      x-permission: public
      security: []
      tags: [auth]
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "410":
          $ref: "#/components/responses/InvitationGone"
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Sets the invited member's first password under the password policy
        (`weak_password` otherwise), makes them active, uses up the link and
        opens a session, setting its cookie. The body must be sent as
        `application/json`; anything else is refused
        `unsupported_media_type`.

        Each attempt counts as a failure of its address before the secret is
        looked up, and is taken back once the secret opens an invitation: a
        hundred failures from one address in fifteen minutes, sign-ins
        included, throttle the address (`rate_limited`).
      x-permission: public
      x-opens-session: true
      x-checks-password: true
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptance"
      responses:
        "200":
          description: Accepted and signed in. The body is the caller, as `GET /me` answers it.
          headers:
            Set-Cookie:
              description: The session cookie `flagnetic_session`, as sign-in sets it.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "410":
          $ref: "#/components/responses/InvitationGone"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "503":
          $ref: "#/components/responses/Busy"
  /me:
    get:
      operationId: getMe
      summary: Who the caller is
      description: The member the credential in use acts for, the credential itself, and the address the request came from.
      x-permission: member
      tags: [me]
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/sessions:
    get:
      operationId: listMySessions
      summary: The caller's sessions
      description: |
        Every device the caller is signed in on, newest first, the one this
        request is signed in to marked `current`. Sessions that have ended
        are left out. A request with an API token marks none current.
      x-permission: member
      tags: [me]
      responses:
        "200":
          description: The live sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: revokeMySessions
      summary: Sign out every other device
      description: |
        Revokes every live session of the caller but the one this request is
        signed in to, or that one too with `include_current`, which then
        clears its cookie. Only a session may do this, so a leaked token
        cannot sign its owner out.
      x-permission: member
      x-session-required: true
      tags: [me]
      parameters:
        - name: include_current
          in: query
          description: Revoke the session this request is signed in to as well.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The number of sessions revoked.
          headers:
            Set-Cookie:
              description: The session cookie, cleared when the current session was revoked.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/sessions/{session}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    delete:
      operationId: revokeMySession
      summary: Sign out one device
      description: |
        Revokes one live session of the caller; revoking the one this request
        is signed in to clears its cookie. A session of another member, one
        that has ended or an identifier that names none is not found.
      x-permission: member
      x-session-required: true
      tags: [me]
      responses:
        "204":
          description: Revoked.
          headers:
            Set-Cookie:
              description: The session cookie, cleared when the session revoked is the current one.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/tokens:
    get:
      operationId: listMyTokens
      summary: The caller's personal access tokens
      description: |
        Every personal access token of the caller, the newest first, revoked
        and expired ones included, by their hint: a token's value is shown
        only when it is created.
      x-permission: member
      tags: [me]
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createMyToken
      summary: Create a personal access token
      description: |
        Creates a personal access token acting for the caller and answers its
        value, shown this once and never again. It carries `read` alone
        unless asked for more, and `read` beside every write scope; a scope
        the caller does not hold, `instance:admin` for a member who is no
        instance admin, is refused `scope_not_allowed`. Its expiry lies in
        the future and at most the instance's maximum token lifetime ahead,
        and is required when the instance requires one; without one the
        token never expires. Only a session creates a token, so a leaked
        token can never multiply itself or outlive its revocation.
      x-permission: member
      x-session-required: true
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: The token, with its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /me/tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeMyToken
      summary: Revoke a personal access token
      description: |
        Revokes one of the caller's tokens, which is refused `token_revoked`
        from then on. A token of another member, one already revoked or an
        identifier that names none is not found. Only a session may do this,
        so a leaked token cannot hide its siblings.
      x-permission: member
      x-session-required: true
      tags: [me]
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /roles:
    get:
      operationId: listRoles
      summary: The roles and their permissions
      description: Every role a grant or a project token may hold, with the permissions it allows, so a client can explain which roles hold a permission a caller lacks.
      x-permission: member
      tags: [access]
      responses:
        "200":
          description: The roles, the most powerful first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects:
    get:
      operationId: listProjects
      summary: The projects the caller works in
      description: The projects where the caller holds a grant; every project for an instance admin. A project token is refused.
      x-permission: member
      tags: [projects]
      responses:
        "200":
          description: The projects, ordered by key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProject
      summary: Create a project
      description: |
        Creates a project with the development, staging and production
        environments, the `user` and `anonymous` unit types and the standard
        attributes. The creator receives no grant: an instance admin holds
        every permission in every project already.
      x-permission: instance_admin
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: The project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: getProject
      summary: A project
      x-permission: project.read
      tags: [projects]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: Rename a project or change its description
      description: The key never changes; sending one is refused with `key_immutable`.
      x-permission: project.update
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: The project as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/me:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: getProjectMe
      summary: What the caller holds in a project
      description: |
        The caller's grants in the project and their effective permissions
        there: the union of the grants' roles (every permission for an
        instance admin), narrowed by the scopes of the credential in use.
      x-permission: project.read
      tags: [projects]
      responses:
        "200":
          description: The caller's grants and permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/environments:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listEnvironments
      summary: The project's environments
      x-permission: project.read
      tags: [environments]
      responses:
        "200":
          description: The environments, by sort order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createEnvironment
      summary: Create an environment
      description: Appends an environment after the project's others.
      x-permission: environment.manage
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/environments/{environment}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    get:
      operationId: getEnvironment
      x-permission: project.read
      tags: [environments]
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEnvironment
      description: Renames the environment; the key never changes (`key_immutable`).
      x-permission: environment.manage
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentPatch"
      responses:
        "200":
          description: As changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteEnvironment
      description: Deletes the environment; the last one of a project is refused with `last_environment`.
      x-permission: environment.manage
      tags: [environments]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{project}/unit-types:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listUnitTypes
      summary: The project's unit types
      x-permission: project.read
      tags: [unit types]
      responses:
        "200":
          description: The unit types, by key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitTypeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createUnitType
      summary: Create a unit type
      description: A key is unique across the unit types and attributes of the project (`already_exists`).
      x-permission: declaration.manage
      tags: [unit types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitTypeCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/unit-types/{unit_type}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/UnitTypeKey"
    get:
      operationId: getUnitType
      x-permission: project.read
      tags: [unit types]
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUnitType
      description: Renames the unit type or changes its description; the key never changes (`key_immutable`).
      x-permission: declaration.manage
      tags: [unit types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitTypePatch"
      responses:
        "200":
          description: As changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteUnitType
      description: Deletes the unit type.
      x-permission: declaration.manage
      tags: [unit types]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/attributes:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listAttributes
      summary: The project's attributes
      x-permission: project.read
      tags: [attributes]
      responses:
        "200":
          description: The attributes, by key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAttribute
      summary: Declare an attribute
      description: Declares an attribute. A key is unique across the unit types and attributes of the project (`already_exists`); `discovered` is reserved.
      x-permission: declaration.manage
      tags: [attributes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/attributes/{attribute}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/AttributeKey"
    get:
      operationId: getAttribute
      x-permission: project.read
      tags: [attributes]
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAttribute
      description: Renames the attribute or changes its description; the key and the type never change (`key_immutable`, `type_immutable`).
      x-permission: declaration.manage
      tags: [attributes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributePatch"
      responses:
        "200":
          description: As changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteAttribute
      description: Deletes a declared attribute; a standard attribute is refused with `standard_attribute`.
      x-permission: declaration.manage
      tags: [attributes]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{project}/audit:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listProjectAuditEntries
      summary: The project's audit log
      description: |
        Every change made in the project, newest first, filtered by every
        parameter given. Page with `cursor` set to the `next_cursor` of the
        previous page: entries written meanwhile never shift a page.
      x-permission: project.read
      tags: [audit]
      parameters:
      - $ref: "#/components/parameters/AuditActor"
      - $ref: "#/components/parameters/AuditActorKind"
      - $ref: "#/components/parameters/AuditAction"
      - $ref: "#/components/parameters/AuditEntityKind"
      - $ref: "#/components/parameters/AuditEntityID"
      - $ref: "#/components/parameters/AuditEnvironment"
      - $ref: "#/components/parameters/AuditFrom"
      - $ref: "#/components/parameters/AuditTo"
      - $ref: "#/components/parameters/AuditQ"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/audit/{entry}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - name: entry
        in: path
        required: true
        description: The entry's identifier.
        schema:
          type: string
    get:
      operationId: getProjectAuditEntry
      summary: One audit entry of the project
      description: An entry of another project, or of none, is not found here.
      x-permission: project.read
      tags: [audit]
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /members:
    get:
      operationId: listMembers
      summary: The instance's members
      description: Every member of the instance, ordered by email, with how many projects each holds a grant in and when they last signed in.
      x-permission: instance_admin
      tags: [members]
      parameters:
        - name: status
          in: query
          description: Only the members in this status.
          schema:
            $ref: "#/components/schemas/MemberStatus"
        - name: q
          in: query
          description: Text found, whatever its case, in the member's email or display name.
          schema:
            type: string
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: inviteMember
      summary: Invite someone to the instance
      description: |
        Creates an invited member and their invitation, and answers the
        invitation's one-time link, to pass on to them: it is shown this
        once and never again. The link is `FLAGNETIC_BASE_URL`, or this
        request's origin when it is not set, followed by
        `/invitations/<secret>`; it expires after seven days. An email the
        instance holds, whatever its case, is refused `already_exists`.
      x-permission: instance_admin
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInvite"
      responses:
        "201":
          description: The member invited, with their invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /members/{member}:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    get:
      operationId: getMember
      summary: A member
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMember
      summary: Edit a member, or make them instance admin or not
      description: |
        Changes the fields sent and leaves the others as they are. An email
        another member holds, whatever its case, is refused `already_exists`.
        Demoting the instance's last active instance admin is refused
        `last_instance_admin`.
      x-permission: instance_admin
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPatch"
      responses:
        "200":
          description: The member as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /members/{member}/deactivate:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    post:
      operationId: deactivateMember
      summary: Offboard a member
      description: |
        The member can no longer sign in, and every session and personal
        access token they hold is revoked with them, at once, and every link
        of theirs stops working. Project tokens
        they created keep working: they belong to their project. Deactivating
        the instance's last active instance admin is refused
        `last_instance_admin`; deactivating a deactivated member changes
        nothing.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The member, deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /members/{member}/reactivate:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    post:
      operationId: reactivateMember
      summary: Bring a deactivated member back
      description: |
        The member becomes active when they hold a password. One who never
        set one is invited again, and the answer carries their fresh
        invitation's one-time link, as on invitation. What their
        deactivation revoked stays revoked: they sign in afresh and create
        new tokens. Reactivating a member who is not deactivated changes
        nothing.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The member, reactivated, with the invitation issued to them if one was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member}/invitation:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    post:
      operationId: reissueInvitation
      summary: Replace an invited member's link
      description: Issues a fresh invitation, answered with its one-time link as on invitation, and kills every earlier link of the member. A member who is not invited is refused `member_not_invited`.
      x-permission: instance_admin
      tags: [members]
      responses:
        "201":
          description: The member with their fresh invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /members/{member}/sessions:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    get:
      operationId: listMemberSessions
      summary: A member's sessions
      description: Every device the member is signed in on, newest first, for an instance admin answering an incident. Sessions that have ended are left out.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The live sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: revokeMemberSessions
      summary: Sign a member out everywhere
      description: Revokes every live session of the member. When that includes the session this request is signed in to, its cookie is cleared. An instance admin revokes their own sessions only from a session; their API token is refused `session_required`, as on `/me/sessions`.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The number of sessions revoked.
          headers:
            Set-Cookie:
              description: The session cookie, cleared when the session this request is signed in to was revoked.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member}/tokens:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    get:
      operationId: listMemberTokens
      summary: A member's personal access tokens
      description: Every personal access token of the member, the newest first, revoked and expired ones included, for an instance admin answering an incident.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member}/tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/MemberID"
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeMemberToken
      summary: Revoke a member's personal access token
      description: Revokes one of the member's tokens. A token of another member, one already revoked or an identifier that names none is not found. An instance admin revokes their own tokens only from a session; their API token is refused `session_required`, as on `/me/tokens`.
      x-permission: instance_admin
      tags: [members]
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /instance/auth-settings:
    get:
      operationId: getAuthSettings
      summary: The instance's auth settings
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The settings in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateAuthSettings
      summary: Change the instance's auth settings
      description: |
        Replaces every setting. Every replica applies a change within a
        second, and live sessions are judged by lowered timeouts at once: a
        session past a lowered idle or absolute timeout ends. A raised
        absolute timeout never lengthens a session that opened under a lower
        one. Refused `invalid_auth_settings` naming each field that breaks a
        rule: every duration a whole number of seconds from 60 to 315360000
        (ten years), the idle timeout at most the absolute one, the password
        minimum length from 12 to 128.
      x-permission: instance_admin
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSettings"
      responses:
        "200":
          description: The settings as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /audit:
    get:
      operationId: listAuditEntries
      summary: The instance's audit log
      description: |
        Every entry of the instance, of every project and of none (members,
        sign-ins, settings), newest first. `project` narrows it to one
        project's entries.
      x-permission: instance_admin
      tags: [audit]
      parameters:
        - name: project
          in: query
          description: The identifier of the project whose entries to list, kept by its entries after the project is gone.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditActorKind"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditEntityKind"
        - $ref: "#/components/parameters/AuditEntityID"
        - $ref: "#/components/parameters/AuditEnvironment"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditQ"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    AuditActor:
      name: actor
      in: query
      description: A member's identifier; their own changes and those of their personal access tokens.
      schema:
        type: string
        format: uuid
    AuditActorKind:
      name: actor_kind
      in: query
      schema:
        $ref: "#/components/schemas/ActorKind"
    AuditAction:
      name: action
      in: query
      description: An action, such as `environment.updated`.
      schema:
        type: string
    AuditEntityKind:
      name: entity_kind
      in: query
      description: A kind of entity, such as `environment`.
      schema:
        type: string
    AuditEntityID:
      name: entity_id
      in: query
      description: An entity's identifier, which follows the entity whatever key it had.
      schema:
        type: string
    AuditEnvironment:
      name: environment
      in: query
      description: An environment's identifier; entries addressing no environment are left out.
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      description: The earliest time of an entry, included.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: The latest time of an entry, included.
      schema:
        type: string
        format: date-time
    AuditQ:
      name: q
      in: query
      description: Text found, whatever its case, in the action, the entity's key or the actor's name. `%` and `_` match themselves.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: How many entries a page holds at most.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    EnvironmentKey:
      name: environment
      in: path
      required: true
      description: The environment's key.
      schema:
        type: string
    UnitTypeKey:
      name: unit_type
      in: path
      required: true
      description: The unit type's key.
      schema:
        type: string
    AttributeKey:
      name: attribute
      in: path
      required: true
      description: The attribute's key.
      schema:
        type: string
    SessionID:
      name: session
      in: path
      required: true
      description: The session's identifier, in either case.
      schema:
        type: string
    MemberID:
      name: member
      in: path
      required: true
      description: The member's identifier.
      schema:
        type: string
    TokenID:
      name: token
      in: path
      required: true
      description: The API token's identifier.
      schema:
        type: string
    ProjectKey:
      name: project
      in: path
      required: true
      description: The project's key.
      schema:
        type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token, `fn_pat_…` for a personal access token or `fn_prj_…` for a project token, in the `Authorization` header. A token in the query string is never read.
    session:
      type: apiKey
      in: cookie
      name: flagnetic_session
      description: The session cookie `POST /auth/sign-in` sets, for the console. Ignored when an `Authorization` header is present.
  responses:
    BadRequest:
      description: "`invalid_request`: a parameter that is malformed or out of its range, such as a cursor this API did not return."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`not_found`: no such project, or nothing under that identifier in it. An unknown project is answered before any permission is judged."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "The change conflicts with what exists, such as `already_exists` for a key already in use."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Invalid:
      description: The request is well formed but breaks a rule; `errors` names each field to fix.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: |
        No credential, or one that is not accepted: `unauthenticated` without
        a credential (a session cookie the server did not issue counts as
        none); `invalid_token`, `token_revoked` or `token_expired` for an API
        token, with a `WWW-Authenticate` header naming the code;
        `session_expired` for a session that has ended, whose cookie is
        cleared; `invalid_credentials` for a sign-in.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestTooLarge:
      description: "`request_too_large`: the body is larger than the operation accepts; one that checks a password accepts 8 KiB."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: "`unsupported_media_type`: the body is not sent as `application/json`, which the operations opening a session require so a form on another site cannot call them."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyAttempts:
      description: |
        Refused before the password is checked: `locked` while the email is
        locked by consecutive failures, `rate_limited` while the address is
        throttled. `retry_after` and the `Retry-After` header give the
        seconds until the attempt can be made again.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvitationGone:
      description: "`invitation_gone`: the link opens no invitation that can be accepted: it was never issued, has been used or replaced, or has expired."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Busy:
      description: |
        `busy`: the replica is checking as many passwords as it may at once
        and no turn freed within two seconds. The attempt was not counted as
        a failure; retry after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The caller may not perform the operation: `forbidden` (with the
        missing `permission`), `session_required`, `insufficient_scope`, or
        `cross_origin` for a request signed in by the session cookie, a read
        included, that the browser says comes from another origin.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: A problem document (RFC 9457). Code-specific values are further members.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable snake_case name of the problem, which clients branch on.
        detail:
          type: string
          description: An English explanation for humans; never what a client branches on.
        request_id:
          type: string
        retry_after:
          type: integer
          description: Seconds to wait before retrying, for a rate limit.
        permission:
          type: string
          description: The permission the caller lacks, for `forbidden`.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
    Violation:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: JSON Pointer into the request body.
        code:
          type: string
        detail:
          type: string
        params:
          type: object
          additionalProperties: true
          description: The values of the rule broken, such as the bounds of a length, for a client to explain the violation in its own language.
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    AuthMethods:
      type: object
      required: [local_login_enabled, providers]
      properties:
        local_login_enabled:
          type: boolean
          description: Whether a member signs in with their email and password.
        providers:
          type: array
          description: The identity providers a member signs in through; none yet.
          items:
            type: object
    MemberStatus:
      type: string
      enum: [invited, active, deactivated]
    Me:
      type: object
      required: [credential, client_ip]
      properties:
        member:
          $ref: "#/components/schemas/MeMember"
        credential:
          $ref: "#/components/schemas/Credential"
        client_ip:
          type: string
          description: The address the request came from, as the server sees it behind its trusted proxies.
    Member:
      type: object
      description: A member as an instance admin sees them.
      required: [id, email, display_name, status, instance_admin, created_at, last_sign_in_at, project_count]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/MemberStatus"
        instance_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_sign_in_at:
          type: string
          format: date-time
          nullable: true
          description: When the member last signed in; null until they do.
        project_count:
          type: integer
          description: How many projects the member holds a grant in; none while they are invited.
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    MemberPatch:
      type: object
      properties:
        email:
          type: string
          description: One address of the form name@domain, at most 254 characters.
        display_name:
          type: string
          description: Not blank, at most 200 characters.
        instance_admin:
          type: boolean
    MemberInvite:
      type: object
      required: [email, display_name]
      properties:
        email:
          type: string
          description: One address of the form name@domain, at most 254 characters.
        display_name:
          type: string
          description: Not blank, at most 200 characters.
    IssuedInvitation:
      type: object
      description: An invitation just issued. Its link is shown this once.
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: The one-time link to pass on to the invited person.
        expires_at:
          type: string
          format: date-time
    MemberInvitation:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"
        invitation:
          $ref: "#/components/schemas/IssuedInvitation"
    Invitation:
      type: object
      description: What an invitation's link opens.
      required: [email, display_name, expires_at]
      properties:
        email:
          type: string
          description: The invited member's email with all but the first character of its local part hidden, such as `g***@example.com`.
        display_name:
          type: string
        expires_at:
          type: string
          format: date-time
    InvitationAcceptance:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    MeMember:
      type: object
      description: The member the credential acts for; absent for a project token, which acts for none.
      required: [id, email, display_name, status, instance_admin, locale]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/MemberStatus"
        instance_admin:
          type: boolean
        locale:
          type: string
          nullable: true
          description: The console language the member chose; null follows the browser.
    Credential:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [token, session]
        token_id:
          type: string
          format: uuid
          description: The API token in use, for the token method.
        token_name:
          type: string
    Key:
      type: string
      pattern: "^[a-z][a-z0-9_-]{0,63}$"
      description: Names the entity in URLs, SDK calls and rules, and never changes.
    Name:
      type: string
      minLength: 1
      maxLength: 200
    Description:
      type: string
      maxLength: 2000
    Project:
      type: object
      required: [id, key, name, description]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    ProjectCreate:
      type: object
      required: [key, name]
      properties:
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    ProjectPatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `key_immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    Permission:
      type: string
      description: A permission of the catalog, named entity.verb, such as `environment.manage`.
    RoleName:
      type: string
      enum: [owner, maintainer, developer, viewer]
    Role:
      type: object
      required: [name, permissions]
      properties:
        name:
          $ref: "#/components/schemas/RoleName"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    SessionMethod:
      type: string
      enum: [local]
      description: How the member signed in; `local` is with their email and password.
    Session:
      type: object
      description: One device a member is signed in on.
      required: [id, method, client_ip, user_agent, created_at, last_seen_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        method:
          $ref: "#/components/schemas/SessionMethod"
        client_ip:
          type: string
          nullable: true
          description: The address the session opened from.
        user_agent:
          type: string
          description: At most 256 bytes of the browser's User-Agent at sign-in.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: The session's last request, written at most once a minute.
        expires_at:
          type: string
          format: date-time
          description: When the absolute timeout in force ends the session, unless the idle timeout ends it first.
        current:
          type: boolean
          description: Whether this is the session the request is signed in to.
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    SessionRevocation:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          description: How many sessions were revoked.
    AuthSettings:
      type: object
      description: The instance's rules for sessions, API tokens and passwords.
      required: [session_idle_timeout_seconds, session_absolute_timeout_seconds, token_max_lifetime_seconds, token_expiry_required, password_min_length]
      properties:
        session_idle_timeout_seconds:
          type: integer
          format: int64
          description: A session ends this long after its last request. 86400 (a day) on a fresh instance.
        session_absolute_timeout_seconds:
          type: integer
          format: int64
          description: A session ends this long after it opened, however much it is used. 2592000 (30 days) on a fresh instance.
        token_max_lifetime_seconds:
          type: integer
          format: int64
          description: The furthest ahead an API token may expire. 31536000 (365 days) on a fresh instance.
        token_expiry_required:
          type: boolean
          description: Whether an API token must be created with an expiry. False on a fresh instance.
        password_min_length:
          type: integer
          description: The fewest characters a password chosen from now on has, never below 12. 12 on a fresh instance.
    Scope:
      type: string
      enum: [read, "flags:write", "experiments:write", "project:admin", "instance:admin"]
      description: What an API token may touch. Each permission falls under one scope, and a token exercises it only when it carries that scope.
    ApiToken:
      type: object
      description: A personal access token, by its hint; its value is shown only when it is created.
      required: [id, name, hint, scopes, expires_at, created_at, last_used_at, last_used_ip, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          type: string
          description: The value's prefix and its first four characters, such as `fn_pat_Ab3d`.
        scopes:
          type: array
          description: The scopes the token carries, `read` first.
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; null for a token that never expires.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the token was last presented, recorded at most once a minute; null until it is used.
        last_used_ip:
          type: string
          nullable: true
          description: The address the token was last presented from.
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
    ApiTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 200 characters, not blank, to tell the token apart.
        scopes:
          type: array
          description: The scopes the token carries; `read` alone when absent, and `read` is added to any write scope.
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; absent or null for a token that never expires, unless the instance requires an expiry.
    CreatedApiToken:
      type: object
      description: A personal access token just created, with its value.
      required: [token, value]
      properties:
        token:
          $ref: "#/components/schemas/ApiToken"
        value:
          type: string
          format: password
          description: The token's value, `fn_pat_` and 40 characters, shown this once.
    Grant:
      type: object
      description: One role held by one member in one project.
      required: [id, member, role, source, created_at]
      properties:
        id:
          type: string
          format: uuid
        member:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/RoleName"
        source:
          type: string
          enum: [manual]
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The member who made the grant.
        created_at:
          type: string
          format: date-time
    ProjectMe:
      type: object
      required: [grants, permissions]
      properties:
        grants:
          type: array
          description: The grants the caller's member holds in the project; none for a project token or an instance admin acting without one.
          items:
            $ref: "#/components/schemas/Grant"
        permissions:
          type: array
          description: The caller's effective permissions in the project, narrowed by the scopes of the credential in use, in catalog order.
          items:
            $ref: "#/components/schemas/Permission"
    Environment:
      type: object
      required: [id, key, name, sort_order]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        sort_order:
          type: integer
          description: Where the environment is listed among its project's, the first created first.
    EnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
    EnvironmentCreate:
      type: object
      required: [key, name]
      properties:
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
    EnvironmentPatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `key_immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
    UnitType:
      type: object
      required: [id, key, name, description]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    UnitTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UnitType"
    UnitTypeCreate:
      type: object
      required: [key, name]
      properties:
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    UnitTypePatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `key_immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    AttributeType:
      type: string
      enum: [string, number, boolean, semver, date, list]
      description: The type of an attribute's values; `semver` is a semantic version, `list` a list of strings.
    Attribute:
      type: object
      required: [id, key, type, name, description, standard]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        type:
          $ref: "#/components/schemas/AttributeType"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        standard:
          type: boolean
          description: Predeclared in every project; renamable, never deleted or retyped.
    AttributeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
    AttributeCreate:
      type: object
      required: [key, type, name]
      properties:
        key:
          $ref: "#/components/schemas/Key"
        type:
          $ref: "#/components/schemas/AttributeType"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    AttributePatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `key_immutable` whatever its value.
        type:
          type: string
          description: Refused with `type_immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    ActorKind:
      type: string
      enum: [member, token, cli, system]
    AuditEntry:
      type: object
      description: Who changed what, when, from which value to which. Secrets are never recorded; a token appears by its hint.
      required: [id, occurred_at, project_id, environment_id, actor, action, entity, before, after, request_id]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        project_id:
          type: string
          format: uuid
          nullable: true
          description: The project the change belongs to, kept after the project is gone; null for the instance.
        environment_id:
          type: string
          format: uuid
          nullable: true
          description: The environment the change addressed, if any.
        actor:
          $ref: "#/components/schemas/Actor"
        action:
          type: string
          description: entity.verb, such as `environment.updated`.
        entity:
          $ref: "#/components/schemas/AuditEntity"
        before:
          nullable: true
          description: The entity's values before the change; null when it was created.
        after:
          nullable: true
          description: The entity's values after the change; null when it was deleted.
        request_id:
          type: string
          nullable: true
          description: The request that made the change; null outside a request, such as for the command line.
    Actor:
      type: object
      required: [kind, id, name, member_id]
      properties:
        kind:
          $ref: "#/components/schemas/ActorKind"
        id:
          type: string
          description: The member's or token's identifier, or a fixed name for the command line and the system.
        name:
          type: string
          description: The actor's name when the change was made.
        member_id:
          type: string
          format: uuid
          nullable: true
          description: The member who acted, directly or through their personal access token.
    AuditEntity:
      type: object
      required: [kind, id, key]
      properties:
        kind:
          type: string
        id:
          type: string
        key:
          type: string
          description: The entity's key or name when the change was made.
    AuditEntryList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last.
