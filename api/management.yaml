    get:
      operationId: getFlag
      summary: A flag with its configuration in every environment
      x-permission: project.read
      tags: [flags]
      responses:
        "200":
          description: The flag; its `ETag` is the definition's version, and each configuration carries its own.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFlag
      summary: Change a flag's definition
      description: |
        Changes the name, description, owner, tags, lifetime, variations or
        automatic exposure, for every environment at once; the key and type
        never change (`immutable`). Variations are replaced as a list and
        matched by key: removing one that a configuration still serves is
        `in_use`, listing what serves it. A change to the values the flag
        already has changes nothing and records nothing.
      x-permission: flag.edit
      tags: [flags]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
