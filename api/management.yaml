      - $ref: "#/components/parameters/ExperimentKey"
      - $ref: "#/components/parameters/ExposureEnvironment"
    get:
      operationId: getExperimentExposureTimeline
      summary: An experiment's exposures per day in one environment
      description: |
        The experiment's exposure counts per UTC day and variation, by day
        then variation key; a day and variation without an exposure is left
        out. `exposures` and `overridden` count by the day an exposure was
        received, `first_exposures` by the day the first exposure occurred,
        so an earlier exposure arriving late moves a first exposure to its
        own day.
      x-permission: project.read
      tags: [experiments]
      parameters:
        - name: from
          in: query
          description: The first UTC day, included; the first day with an exposure when absent.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: The last UTC day, included; the last day with an exposure when absent.
          schema:
            type: string
            format: date
