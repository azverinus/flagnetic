            application/json:
              schema:
                $ref: "#/components/schemas/FlagConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/flags/{flag}/environments/{environment}/evaluations:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    get:
      operationId: getFlagEvaluations
      summary: A flag's evaluations per day in one environment
      description: |
        The flag's evaluations per UTC day the summaries were received, by
        day, source, variation key and reason; a day without an evaluation
        is left out. Evaluations SDKs reported (`sdk`) and the remote
        evaluations the server answered (`remote_evaluation`) are separate
        series and are never added together: a client SDK is sent every
        flag whether its application reads it or not, and counts again
        those it reads. A range from after `to`, or of more than 90 days,
        is `invalid_request`. The counts lag the SDKs by the summary
        rollup's round, ten seconds, besides the time a long transaction
        holds it back.
      x-permission: project.read
      tags: [flags]
      parameters:
        - name: from
          in: query
          description: The first UTC day, included; 29 days before `to` when absent.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: The last UTC day, included; today when absent.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The evaluations per day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagEvaluations"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/events/volume:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: getEventVolume
      summary: The events the project received per day, and the gaps
      description: |
        The events SDKs posted to the project per UTC day they were
        received and type, as the rollups counted them; a day without an
        event of a type is left out. The counts are kept after retention
        drops the raw events. `gaps` are the raw events retention dropped
        before the stream reading them had read them, each gap whose
        received period meets the range: they are the instance's, so
        `rows` counts every project's events, and what those events would
        have added is missing from the counts and from what the streams
        feed. A range from after `to`, or of more than 90 days, is
        `invalid_request`. The counts lag the SDKs by the rollups' round,
        ten seconds, besides the time a long transaction holds them back.
      x-permission: project.read
      tags: [events]
      parameters:
        - name: from
          in: query
          description: The first UTC day, included; 29 days before `to` when absent.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: The last UTC day, included; today when absent.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The events per day and the gaps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventVolume"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/experiments:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listExperiments
      summary: The project's experiments
      description: |
        The project's experiments by key in byte order (capitals before
        lower case). Every filter given applies. Archived experiments are
        left out unless `include_archived` is true or `status` is
        `archived`. Page with `cursor` set to the `next_cursor` of the
