                $ref: "#/components/schemas/FlagConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/flags/{flag}/environments/{environment}/evaluations:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    get:
      operationId: getFlagEvaluations
      summary: A flag's evaluations per day in one environment
      description: |
        The flag's evaluations per UTC day the summaries were received, by
        day, source, variation key and reason; a day without an evaluation
        is left out. Evaluations SDKs reported (`sdk`) and the remote
        evaluations the server answered (`remote_evaluation`) are separate
        series and are never added together: a client SDK is sent every
        flag whether its application reads it or not, and counts again
        those it reads. A range from after `to`, or of more than 90 days,
        is `invalid_request`. The counts lag the SDKs by the summary
        rollup's round, ten seconds, besides the time a long transaction
        holds it back.
      x-permission: project.read
      tags: [flags]
      parameters:
        - name: from
          in: query
          description: The first UTC day, included; 29 days before `to` when absent.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: The last UTC day, included; today when absent.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The evaluations per day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagEvaluations"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/events/volume:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: getEventVolume
      summary: The events the project received per day, and the gaps
      description: |
        The events SDKs posted to the project per UTC day they were
        received and type, as the rollups counted them; a day without an
        event of a type is left out. The counts are kept after retention
        drops the raw events. `gaps` are the raw events retention dropped
        before the stream reading them had read them, each gap whose
        received period meets the range: they are the instance's, so
        `rows` counts every project's events, and what those events would
        have added is missing from the counts and from what the streams
        feed. A range from after `to`, or of more than 90 days, is
        `invalid_request`. The counts lag the SDKs by the rollups' round,
        ten seconds, besides the time a long transaction holds them back.
      x-permission: project.read
      tags: [events]
      parameters:
        - name: from
          in: query
          description: The first UTC day, included; 29 days before `to` when absent.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: The last UTC day, included; today when absent.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The events per day and the gaps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventVolume"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/experiments:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listExperiments
      summary: The project's experiments
      description: |
        The project's experiments by key in byte order (capitals before
        lower case). Every filter given applies. Archived experiments are
        left out unless `include_archived` is true or `status` is
        `archived`. Page with `cursor` set to the `next_cursor` of the
        previous page, under the same filters.
      x-permission: project.read
      tags: [experiments]
      parameters:
        - name: status
          in: query
          description: Lists the experiments in this status.
          schema:
            $ref: "#/components/schemas/ExperimentStatus"
        - name: flag
          in: query
          description: The key of the flag the experiments compare; a flag the project does not have lists nothing.
          schema:
            type: string
        - name: owner
          in: query
          description: The member owning the experiment.
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          description: A tag the experiment carries, matched exactly.
          schema:
            type: string
        - name: include_archived
          in: query
          description: Lists archived experiments too.
          schema:
            type: boolean
            default: false
        - name: past_expected_end
          in: query
          description: |
            `true` lists only running experiments past their expected end:
            from the UTC day after the `expected_end_at` date, as the
            `past_expected_end` alert. `false` or absent filters nothing.
          schema:
            type: boolean
            default: false
        - name: awaiting_code_removal
          in: query
          description: |
            `true` lists only stopped experiments whose flag SDKs still
            evaluate: in some environment, an SDK reported evaluations of
            the flag on one of the last 7 UTC days, today included, and
            evaluated it after the stop. Remote evaluations the server
            answered do not count. `false` or absent filters nothing.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of experiments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createExperiment
      summary: Create an experiment
      description: |
        The experiment arrives as a draft, with an inclusion salt and a
        variation salt the server draws: no other experiment or rollout of
        the project uses either, so two assignments are independent. It
        compares 2 to 50 distinct variations of a flag of the project that
        is not archived, each with a weight in basis points, the weights
        summing to 10,000, over units of a declared unit type. The traffic
        allocation is every unit's (10,000) when absent. The owner defaults
        to the calling member; a project token names one. A key in use is
        `already_exists`.
      x-permission: experiment.edit
      tags: [experiments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentCreate"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/experiments/{experiment}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    get:
      operationId: getExperiment
      summary: An experiment
      description: The experiment with both its salts, so anyone can recompute a unit's buckets.
      x-permission: project.read
      tags: [experiments]
      responses:
        "200":
          description: The experiment; its `ETag` is its version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateExperiment
      summary: Change an experiment
      description: |
        Changes any of the name, hypothesis, owner, tags, flag, unit type,
        variations, traffic allocation or expected end date of a draft, as a
        create judges them; the key never changes (`immutable`). A running
        experiment changes its name, hypothesis (never to an empty one,
        `required` on `/hypothesis`), owner, tags and expected end date, and
        grows its traffic allocation: a change to its flag,
        unit type or weights is `frozen` (409, a violation per field), and a
        smaller allocation is `traffic_allocation_decrease` (409). Growing it
        moves the ruleset of every environment holding a rule serving the
        experiment and includes more units without moving any unit already
        included. A stopped experiment changes its name, hypothesis, owner
        and tags; a change to its flag, unit type, weights, traffic
        allocation or expected end date is `frozen` (409, a violation per
        field), and its decision's note is changed through `/decision`. An
        archived experiment changes nothing (`archived`). A change to the
        values the experiment already has changes nothing and records
        nothing.
      x-permission: experiment.edit
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentPatch"
      responses:
        "200":
          description: The experiment as changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteExperiment
      summary: Delete a draft experiment
      description: |
        Deletes the experiment. Only a draft is deleted (`not_draft`;
        `archived` for an archived one): once started, an experiment keeps
        its history.
      x-permission: experiment.delete
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/experiments/{experiment}/salts:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    post:
      operationId: regenerateExperimentSalts
      summary: Regenerate a draft's salts
      description: |
        Draws a new inclusion salt and a new variation salt, apart from every
