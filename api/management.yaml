    get:
      operationId: listProjectMembers
      summary: The members holding grants in a project
      description: Every member holding a grant in the project, ordered by email, with their grants side by side, oldest first.
      x-permission: project.read
      tags: [grants]
      responses:
        "200":
          description: The members and their grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/grants:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listGrants
      summary: The grants of a project
      description: Every grant of the project, oldest first.
      x-permission: project.read
      tags: [grants]
      responses:
        "200":
          description: The grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createGrant
      summary: Grant a member a role in a project
      description: |
        Grants the member one of the built-in roles in the project, beside
        any grants they hold already; they act with the union of their
        grants' permissions. An invited member may be granted roles before
        they join. A role holding a permission the caller lacks in the
        project is refused `role_not_allowed`, naming it in `permission`;
        the same member and role twice `already_granted`; a deactivated
        member `member_deactivated`; an unknown member or role
        `invalid_grant`. Only a member grants: a project token never changes
        who has access.
      x-permission: grant.manage
      tags: [grants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCreate"
      responses:
        "201":
          description: The grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/grants/{grant}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/GrantID"
    delete:
      operationId: deleteGrant
      summary: Remove one grant
      description: |
        Removes one grant, leaving the member's others. The grant of a role
        holding a permission the caller lacks in the project is refused
        `role_not_allowed`. Removing the last owner's grant is allowed: an
        instance admin holds every permission in every project.
      x-permission: grant.manage
      tags: [grants]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/tokens:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listProjectTokens
      summary: The tokens of a project
      description: Every token of the project, the newest first, revoked and expired ones included, by their hint.
      x-permission: project_token.manage
      tags: [project-tokens]
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectTokenList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectToken
      summary: Create a project token
      description: |
        Creates a token belonging to the project, for a pipeline, and
        answers its value, shown this once and never again. It holds one
        built-in role in the project, fixed for its life, narrowed by its
        scopes; it never manages grants or project tokens, whatever its
        role, so it never changes who has access. It reaches its project and
        `GET /me` alone, acts for no member and survives its creator. A role
        holding a permission the caller lacks in the project is refused
        `role_not_allowed`; `instance:admin` or a scope the caller does not
        hold `scope_not_allowed`. Its expiry follows the rules of a personal
        access token's. Only a session creates one, so no token mints
        another.
      x-permission: project_token.manage
      x-session-required: true
      tags: [project-tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectTokenCreate"
      responses:
        "201":
          description: The token, with its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedProjectToken"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeProjectToken
      summary: Revoke a project token
      description: Revokes one of the project's tokens, which is refused `token_revoked` from then on. A token of another project, one already revoked or an identifier that names none is not found.
      x-permission: project_token.manage
      tags: [project-tokens]
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/audit:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listProjectAuditEntries
      summary: The project's audit log
      description: |
        Every change made in the project, newest first, filtered by every
        parameter given. Page with `cursor` set to the `next_cursor` of the
        previous page: entries written meanwhile never shift a page.
      x-permission: project.read
      tags: [audit]
      parameters:
      - $ref: "#/components/parameters/AuditActor"
      - $ref: "#/components/parameters/AuditActorKind"
      - $ref: "#/components/parameters/AuditAction"
      - $ref: "#/components/parameters/AuditEntityKind"
      - $ref: "#/components/parameters/AuditEntityID"
      - $ref: "#/components/parameters/AuditEnvironment"
      - $ref: "#/components/parameters/AuditFrom"
      - $ref: "#/components/parameters/AuditTo"
      - $ref: "#/components/parameters/AuditQ"
      - $ref: "#/components/parameters/AuditKillSwitch"
      - $ref: "#/components/parameters/AuditChangeRequest"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/audit/{entry}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - name: entry
        in: path
        required: true
        description: The entry's identifier.
        schema:
          type: string
    get:
      operationId: getProjectAuditEntry
      summary: One audit entry of the project
      description: An entry of another project, or of none, is not found here.
      x-permission: project.read
      tags: [audit]
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/stream:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: streamProjectChanges
      summary: The project's change stream
      description: |
        A server-sent event stream with one notice per audit entry the
        project records, from whichever replica made the change, so a client
        refetches what it shows of the entity named. A notice never carries
        the change itself.

        The first frame is `retry: 3000`. Each notice is a frame
        `event: change`, `id: <audit entry id>`, `data:
        {"kind", "key", "environment", "version", "actor"}`: the entity's
        kind and key as the entry names them, the key of the environment
        the change addressed (null for none, or once that environment is
        gone), the entity's version after the change (before it for a
        deletion; null for an entity without one) and the actor as the
        audit log names it. Notices not yet sent are coalesced per entity:
        a later change of an entity replaces the one waiting.

        `event: refetch` with `data: {}` tells the client to refetch
        everything it shows of the project: after the replica may have
        missed a notice, when more than 1,000 notices wait unsent, and when
        `Last-Event-ID` names no entry of the project. With a known
        `Last-Event-ID`, the entries after it are sent first, up to 1,000;
        more than that is a refetch.

        A comment `: hb` every 15 seconds tells a quiet stream from a dead
        one. The caller's access to the project is resolved again at every
        notice and heartbeat, and the stream ends once it no longer holds
        `project.read` or the project is gone. The server closes a stream
        after about an hour (60 minutes plus up to 5 of jitter) and when it
        shuts down; the client reconnects with `Last-Event-ID`. A caller (a
        member, or a project token) holds at most 10 streams open on one
        replica.
      x-permission: project.read
      tags: [audit]
      parameters:
        - name: Last-Event-ID
          in: header
          description: The id of the last notice the client heard.
          schema:
            type: string
      responses:
        "200":
          description: The stream, held open.
          headers:
            Cache-Control:
              description: "`no-cache`."
              schema:
                type: string
            X-Accel-Buffering:
              description: "`no`, so a proxy passes each frame on at once."
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: "`too_many_streams`: the caller holds 10 change streams open on this replica already; `Retry-After` gives the seconds to wait."
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /members:
