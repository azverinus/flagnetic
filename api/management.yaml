        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/experiments/{experiment}/start:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    post:
      operationId: startExperiment
      summary: Start a draft experiment
      description: |
        Starts the experiment: its flag, unit type and weights are frozen
        from now on, and in the same transaction the ruleset of every
        environment holding a rule serving it moves on to carry them, so it
        begins everywhere at once; no other environment's ruleset moves. An
        experiment no environment holds starts all the same, and reaches an
        environment when a rule there serves it. Only a draft starts
        (`not_draft`; `archived` for an archived one): there is no restart,
        a stopped experiment is rerun as a clone. A draft missing anything a running experiment needs is
        refused `experiment_not_ready`, with one violation per missing
        item: its flag archived (`flag_archived` on `/flag`), its unit type
        no longer declared (`undeclared_unit_type` on `/unit_type`), weights
        no longer valid against the flag (on `/variations`), no hypothesis
        or no expected end date (`required` on `/hypothesis` and
        `/expected_end_at`).
      x-permission: experiment.edit
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The experiment, running.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/experiments/{experiment}/stop:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    post:
      operationId: stopExperiment
      summary: Stop a running experiment with a decision
      description: |
        Stops the experiment with a decision, in one transaction with every
        rule serving it. With `winner`, every rule serving the experiment, in
        every environment, serves `winner_variation` instead, keeping its
        identifier, conditions and place, so the winner ships at once; with
        `removed`, every such rule is deleted and the flag goes on to its
        other rules. Each configuration rewritten is a configuration write of
        its own, at its next version, recorded as `flag.configuration_updated`
        with `experiment_stopped`, and the ruleset of its environment moves
        on; no other ruleset moves. A winner is one of the variations the
        experiment compares (`invalid_decision`: `required` or
        `unknown_variation` on `/winner_variation`), a removal names none
        (`invalid_value`), and a note has at most 2,000 characters
        (`too_long` on `/note`). Only a running experiment stops
        (`not_running`; `archived` for an archived one).
      x-permission: experiment.edit
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentStop"
      responses:
        "200":
          description: The experiment, stopped, with its decision.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/experiments/{experiment}/decision:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    put:
      operationId: setExperimentDecisionNote
      summary: Change the note of a stopped experiment's decision
      description: |
        Sets the note of the decision, `""` clearing it; the outcome and the
        winner never change. Only a stopped experiment has a decision
        (`not_stopped`; `archived` for an archived one). A note has at most
        2,000 characters (`invalid_decision`, `too_long` on `/note`). The
        same note changes nothing and records nothing.
      x-permission: experiment.edit
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentDecisionNote"
      responses:
        "200":
          description: The experiment with its decision.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/experiments/{experiment}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    post:
      operationId: archiveExperiment
      summary: Archive a draft or stopped experiment
      description: |
        Archives the experiment: it is hidden from the list unless asked for
        and no write changes it again (`archived`), though it can still be
        cloned. A running experiment is stopped with a decision first
        (`running`). No ruleset moves.
      x-permission: experiment.edit
      tags: [experiments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The experiment, archived.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/experiments/{experiment}/clone:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    post:
      operationId: cloneExperiment
      summary: Clone an experiment into a new draft
      description: |
        Copies an experiment of any status into a new draft under a new key,
        with new salts and no decision: the rerun of a stopped experiment
        never reuses its assignments. The name, hypothesis, tags, flag, unit
        type, weights, traffic allocation and expected end date are copied;
        the owner is the calling member (the source's, for a project token).
        The clone is judged as a create is. The source is not changed, so no
        `If-Match`.
      x-permission: experiment.edit
      tags: [experiments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentClone"
      responses:
        "201":
          description: The clone.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/experiments/{experiment}/assignment:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    get:
      operationId: getExperimentAssignment
      summary: How the experiment treats one unit
      description: |
        Which variation the experiment assigns one unit ID, from the
        experiment's own fields in whatever status it is, and the ClickHouse
        query that recomputes it in a warehouse. Both buckets are
        `murmur3_32("{salt}.{unit_id}") mod 10000`: the unit is included when
        its inclusion bucket is below the traffic allocation, and an
        included unit gets the variation whose range of cumulative weights,
        in the experiment's order, holds its variation bucket. It reads no
        event and records nothing. A missing, empty or over-256-byte
        `unit_id` is 400.
      x-permission: project.read
      tags: [experiments]
      parameters:
        - name: unit_id
          in: query
          required: true
          description: A unit ID of the experiment's unit type, 1 to 256 bytes.
          schema:
            type: string
      responses:
        "200":
          description: The unit's buckets, inclusion and variation, and the query recomputing them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/hash-check:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      operationId: checkHashUniformity
      summary: Check the hash's uniformity on real unit IDs
      description: |
        Buckets every unit ID with `murmur3_32("{salt}.{unit_id}") mod
        10000`, groups the 10000 buckets into `bins` bins of consecutive
        buckets (bucket `b` falls into bin `b × bins / 10000`, so bins differ
        in width by at most one bucket), and compares each bin's count with
        what a uniform hash expects of its width, `N × width / 10000`, by
        Pearson's chi-square test with `bins − 1` degrees of freedom: it is
        `uniform` when `p_value` is at least 0.001. Duplicate IDs count as
        often as they occur. With `second_salt` it also tests that both
        salts' buckets are independent, as an experiment's inclusion and
        variation buckets must be: Pearson's test of independence on the
        `bins × bins` table of both bins, over its non-empty rows and
        columns. The same check runs offline as `flagnetic hash-check`, so
        unit IDs never have to leave a machine. It records nothing.

        Refused with 422 `invalid_uniformity_check`: fewer than 1000 or more
        than 200000 unit IDs (`/unit_ids`, `out_of_range`), a unit ID empty
        or over 256 bytes (`/unit_ids/{i}`, `invalid_value`, the first 100
        only), `bins` outside 2 to 10000 (`/bins`, `out_of_range`), or a salt
        empty or over 256 bytes (`/salt`, `/second_salt`, `invalid_value`).
        Its body may take up to 64 MiB, enough for 200000 IDs of 256 bytes,
        whatever the server's limit for other bodies.
      x-permission: project.read
      x-max-body-bytes: 67108864
      tags: [experiments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HashCheckRequest"
      responses:
        "200":
          description: The counts per bin and each test's statistic and verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/experiments/{experiment}/exposures:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
      - $ref: "#/components/parameters/ExposureEnvironment"
    get:
      operationId: getExperimentExposures
      summary: An experiment's exposures in one environment
      description: |
        What the exposures of an experiment of any status came to in one
        environment, from the exposure rollup, which reads the exposures
        committed every 10 seconds; `as_of` is when it last moved, null
        before it first did.

        A unit's first exposure is its non-override exposure with the
        earliest `occurred_at`, ties broken by the smaller `event_id`; an
        earlier exposure arriving late replaces it. Every other
        non-override exposure of the unit naming another variation is a
        conflict. Override exposures are counted as `overridden` and never
        make, replace or conflict with a first exposure. However exposures
        arrive, in whatever order and batches, the counts come out the
        same.

        `variations` lists the experiment's variations in its order, each
        even without an exposure, then any other variation an override
        exposure named, by key, which expects no share. `rejections`
        counts the exposures of the experiment refused in the environment,
        by reason.

        `sample_ratio` is the latest sample-ratio check of the experiment in
        the environment, null before the first. Every 10 minutes, and once
        more at its stop, each running experiment is checked in each
        environment holding its rule: with `N` its first exposures over the
        variations it weighs, `O` a variation's first exposures and
        `E = N × weight / 10000`, `X² = Σ (O − E)² / E` at one degree of
        freedom fewer than variations, and `p_value` is its chi-square upper
        tail. Below 1,000 first exposures (`below_minimum_sample`) or with a
        variation expecting fewer than 5 (`expected_below_5`) the check is
        skipped and leaves any alert as it is. An `srm` alert is raised at
        `p_value` below 0.001 and cleared above 0.01; between the two it
        stays as it is. A stopped experiment keeps the check its stop took,
        `checked_at` its stop, and is never checked again. For example,
        weights 5,000/5,000 and 5,200/4,800 first exposures give `X²` 16 and
        `p_value` about 0.000063: an alert.
      x-permission: project.read
      tags: [experiments]
      responses:
        "200":
          description: The experiment's exposures in the environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentExposures"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/experiments/{experiment}/exposures/timeline:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
      - $ref: "#/components/parameters/ExposureEnvironment"
    get:
      operationId: getExperimentExposureTimeline
      summary: An experiment's exposures per day in one environment
      description: |
        The experiment's exposure counts per UTC day and variation, by day
        then variation key; a day and variation without an exposure is left
        out. `exposures` and `overridden` count by the day an exposure was
        received, `first_exposures` by the day the first exposure occurred,
        so an earlier exposure arriving late moves a first exposure to its
        own day.
      x-permission: project.read
      tags: [experiments]
      parameters:
        - name: from
          in: query
          description: The first UTC day, included; the first day with an exposure when absent.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: The last UTC day, included; the last day with an exposure when absent.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The counts per day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureTimeline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/experiments/{experiment}/conflicts:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
      - $ref: "#/components/parameters/ExposureEnvironment"
    get:
      operationId: getExperimentConflicts
      summary: A sample of an experiment's conflicting units in one environment
      description: |
        Up to 100 units exposed in the environment to another variation
        than their first exposure's, the most recent conflict first. A
        unit's conflicting variation is the other variation it was last
        exposed to by `occurred_at`, ties broken by the larger `event_id`,
        so the sample does not depend on the order exposures arrived in.
        The totals are `conflicts` of `GET .../exposures`.
      x-permission: project.read
      tags: [experiments]
      responses:
        "200":
          description: The conflicting units.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureConflicts"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/experiments/{experiment}/alerts:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    get:
      operationId: listExperimentAlerts
      summary: An experiment's alerts
      description: |
        Every alert the experiment has had, in every environment, the most
        recently raised first. An alert is active from `raised_at` until
        `cleared_at`; an acknowledgement hides it until then, and a condition
        returning after it cleared raises a new alert. At most one alert of a
        kind is active per environment.

        The checks run every 10 minutes over every running experiment.

        - `srm` is raised by the sample-ratio check in an environment
          holding the experiment's rule, at a p-value below 0.001, and
          cleared above 0.01 (see `GET .../exposures`).
        - `no_exposures` is raised in an environment holding the rule once
          the server received no exposure there, overrides aside, for 24
          hours since the start or since the last one; it clears with the
          next exposure, when the environment stops holding the rule, and
          at the stop.
        - `exposure_conflicts` is raised in an environment holding the rule
          once the exposures naming another variation than their unit's
          first one reach `max(3, min(10, ceil(first_exposures / 1000)))`,
          and cleared when they fall below it as first exposures grow.
        - `past_expected_end`, about the experiment as a whole
          (`environment` null), is raised from the UTC day after the
          expected end, once until it clears: when the expected end moves
          to today or later, and at the stop.

        A stop leaves `srm` and `exposure_conflicts` active: they are what
        the exposures came to. Raising and clearing are recorded in the
        audit log as `experiment.alert_raised` and
        `experiment.alert_cleared` by the system.
      x-permission: project.read
      tags: [experiments]
      parameters:
        - name: active
          in: query
          description: "`true` lists only active alerts, `false` only cleared ones; every alert when absent."
          schema:
            type: boolean
      responses:
        "200":
          description: The experiment's alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentAlertList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/experiments/{experiment}/alerts/{alert}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
      - name: alert
        in: path
        required: true
        description: The alert's identifier.
        schema:
          type: string
          format: uuid
    post:
      operationId: acknowledgeExperimentAlert
      summary: Acknowledge an experiment's alert
      description: |
        Sets `acknowledged_at`, which hides the alert until it clears, and
        records `experiment.alert_acknowledged`. An alert already acknowledged
        is answered as it is and nothing is recorded. An alert carries no
        version, so no `If-Match` is asked for. An alert of another
        experiment is `not_found`.
      x-permission: experiment.edit
      tags: [experiments]
      responses:
        "200":
          description: The alert, acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentAlert"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/change-requests:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listChangeRequests
      summary: The project's change requests
      description: |
        The project's change requests, newest first, narrowed by every
        filter given. Page with `cursor` set to the `next_cursor` of the
        previous page.
      x-permission: project.read
      tags: [change-requests]
      parameters:
        - name: flag
          in: query
          description: Only those naming the flag with this key.
          schema:
            type: string
        - name: environment
          in: query
          description: Only those naming the environment with this key.
          schema:
            type: string
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ChangeRequestKind"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ChangeRequestState"
        - name: author
          in: query
          description: Only those authored by the member or the project token with this identifier.
          schema:
            type: string
            format: uuid
        - name: awaiting_my_decision
          in: query
          description: |
            When true, only the open change requests the caller may approve
            or reject: those of others, for a member holding
            `change_request.approve`. None for anyone else, a project token
            included.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of change requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createChangeRequest
      summary: Propose a change
      description: |
        Proposes a flag's configuration in one environment as a change
        request, as a draft or, with `open`, opened for review at once. The
        caller, a member or a project token, is its author. It is based on
        the configuration as it is now, and `diff` is the RFC 6902 patch from
        that configuration to `proposed`. `proposed` is checked as replacing
        the configuration would be, with the same refusals under
        `/proposed` (`invalid_configuration`, `archived`); a rule `id` the
        configuration has no rule with, and a `salt` that is not that rule's,
        are left out, so the rule is a new one. New rules and rollouts are
        given an identifier and a salt, which `proposed` holds. A title of 1
        to 200 characters is required and a description has at most 10,000
        (`invalid_change_request`).
      x-permission: change_request.propose
      tags: [change-requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRequestCreate"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/change-requests/{change_request}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ChangeRequestID"
    get:
      operationId: getChangeRequest
      summary: A change request
      x-permission: project.read
      tags: [change-requests]
      responses:
        "200":
          description: The change request; its `ETag` is its version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
