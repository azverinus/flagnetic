      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/flags:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listFlags
      summary: The project's flags
      description: |
        The project's flags, each with its flag state in every environment,
        in the order `sort` names. Every filter given applies. Page with
        `cursor` set to the `next_cursor` of the previous page, under the
        same `sort`; a cursor of another sort, `state` without
        `environment`, or `differs_between` naming other than two
        different environments is `invalid_request`, and an environment
        the project does not have is `not_found`.
      x-permission: project.read
      tags: [flags]
      parameters:
        - name: q
          in: query
          description: |
            Text the flag's key or name contains, ignoring case; `%`, `_`
            and `\` stand for themselves.
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/FlagType"
        - name: tag
          in: query
          description: A tag the flag carries, matched exactly.
          schema:
            type: string
        - name: owner
          in: query
          description: The member owning the flag.
          schema:
            type: string
            format: uuid
        - name: archived
          in: query
          description: Lists the archived flags instead of the others.
          schema:
            type: boolean
            default: false
        - name: environment
          in: query
          description: The environment `state` is judged in; alone, it filters nothing.
          schema:
            $ref: "#/components/schemas/Key"
        - name: state
          in: query
          description: |
            Lists the flags whose configuration in `environment` is on, is
            off, has rules, has a rule serving a rollout, or has a rule
            serving an experiment; rules count whether the flag is on or
            off.
          schema:
            type: string
            enum: ["on", "off", rules, rollout, experiment]
        - name: differs_between
          in: query
          description: |
            Two environment keys, comma separated: lists the flags whose
            configurations differ between them in what their rulesets carry
            (on or off, the off and fallthrough variations, prerequisites,
            overrides by unit type, ID and variation, and rules with their
            identifiers, conditions and serves, salts included, in order),
            never in rule descriptions, override notes or authors, or
            versions.
          style: form
          explode: false
          schema:
            type: array
            minItems: 2
            maxItems: 2
            items:
              $ref: "#/components/schemas/Key"
        - name: sort
          in: query
          description: |
            `key` and `name` in byte order (capitals before lower case),
            `updated` by the last change to the flag's definition, the most
            recent first; ties by key.
          schema:
            type: string
            enum: [key, name, updated]
            default: key
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createFlag
      summary: Create a flag
      description: |
        The flag arrives switched off in every environment of the project,
        serving `false` when off and `true` when on for a boolean flag, and
        its first variation either way for any other type. A boolean flag
        needs no variations listed. The owner defaults to the calling
        member; a project token names one. A key in use is `already_exists`.
      x-permission: flag.edit
      tags: [flags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagCreate"
      responses:
        "201":
          description: Created, with its configuration in every environment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/flags/{flag}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
    get:
      operationId: getFlag
      summary: A flag with its configuration in every environment
      x-permission: project.read
      tags: [flags]
      responses:
        "200":
          description: The flag; its `ETag` is the definition's version, and each configuration carries its own.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFlag
      summary: Change a flag's definition
      description: |
        Changes the name, description, owner, tags, lifetime, variations or
        automatic exposure, for every environment at once; the key and type
        never change (`immutable`). Variations are replaced as a list and
        matched by key: removing one that a configuration still serves is
        `in_use`, listing what serves it, as is removing one that any
        experiment of the flag lists. An archived flag keeps the keys and
        values of its variations (`409 archived`), so that restoring it
        serves what was archived; the rest of it is changed as any flag's. A
        change to the values the flag already has changes nothing and
        records nothing.
      x-permission: flag.edit
      tags: [flags]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagPatch"
      responses:
        "200":
          description: The flag as changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteFlag
      summary: Delete an archived flag
      description: |
        Deletes the flag with its configuration in every environment. Only
        an archived flag is deleted (`not_archived` otherwise), so deleting
        is a deliberate second step after archiving.
      x-permission: flag.archive
      tags: [flags]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/flags/{flag}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/FlagKey"
    post:
      operationId: archiveFlag
      summary: Archive a flag
      description: |
        Hides the flag from SDKs in every environment, keeping its
        definition and configurations until it is restored or deleted.
        Archiving an archived flag changes nothing. A flag that another
        flag requires, or that has a draft or running experiment, is
        refused with `in_use` listing what names it.
      x-permission: flag.archive
      tags: [flags]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The flag as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/flags/{flag}/restore:
    parameters:
