          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/environments/{environment}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    get:
      operationId: getEnvironment
      x-permission: project.read
      tags: [environments]
      responses:
        "200":
          description: Found.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEnvironment
      description: Renames the environment; the key never changes (`key_immutable`).
      x-permission: environment.manage
      tags: [environments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentPatch"
      responses:
        "200":
          description: As changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteEnvironment
      description: >-
        Deletes the environment with its configurations and SDK keys, and
        supersedes the change requests proposed for it. The last one of a
        project is refused with `last_environment`. A protected one is
        refused with `environment_protected`, since its deletion would take
        what its protection guards without a review: stop protecting it
        first, which needs `environment.protect`. Both are judged after
        `If-Match`.
      x-permission: environment.manage
      tags: [environments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/environments/{environment}/protection:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    put:
      operationId: setEnvironmentProtection
      description: >-
        Protects the environment or stops protecting it. In a protected
        environment, a write that would change what its SDKs receive goes
        through an approved change request, and SDKs ignore local overrides.
        The environment's ruleset version moves, so SDKs learn the change.
        Asking for the protection the environment already has changes
        nothing and records nothing. Recorded in the audit log as
        `environment.protected` or `environment.unprotected`.
      x-permission: environment.protect
      tags: [environments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentProtection"
      responses:
        "200":
          description: As protected or not.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/environments/{environment}/evaluate:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    post:
      operationId: evaluate
      summary: Evaluate flags for a context, as the environment's SDKs would
      description: |
        Evaluates the environment's saved configuration for a context, with
        the full reason of each result: the served value and variation,
        the reason, the rule that served, the error code, and for a rollout
        the unit's bucket and the rollout's salt. It evaluates every flag
        that is not archived, or only the flags named, where a key the
        ruleset does not hold answers `error` with `flag_not_found`.

        A `draft` evaluates one flag's unsaved configuration in place of
        its saved one, every other flag seeing it as SDKs would once it is
        saved. It is validated as replacing the configuration would
        validate it (`invalid_configuration`, its pointers under
        `/draft/configuration`), with no `If-Match`, and is never stored:
        nothing changes and nothing is recorded. A context whose unit ID is
        over 256 bytes, or whose attribute holds a string over 1,024 bytes,
        is `invalid_context`. A flag named twice is evaluated once.
        Evaluating records no exposure.
      x-permission: project.read
      tags: [flags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRequest"
      responses:
        "200":
          description: The result of every flag evaluated, by flag key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/environments/{environment}/ruleset:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    get:
      operationId: getEnvironmentRuleset
      summary: The environment's ruleset, as server SDKs download it
      description: |
        The environment's whole ruleset document, private segments
        included, exactly as `GET /sdk/v1/ruleset` answers it to a server
        key, with its version as the `ETag`: a file to feed a test helper
        or to evaluate offline. It carries the replica's own latest writes.
        A replica that cannot load the ruleset answers
        `503 ruleset_unavailable` with `Retry-After`.
      x-permission: project.read
      tags: [environments]
      responses:
        "200":
          description: The ruleset document (schema 1), as described by the SDK API's `Ruleset`.
          headers:
            ETag:
              description: The ruleset version, quoted, as a strong tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: "`ruleset_unavailable`: this replica cannot load the ruleset yet; retry after `Retry-After` seconds."
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /projects/{project}/environments/{environment}/sdk-inventory:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    get:
      operationId: listSdkInventory
      summary: The SDKs that use the environment
      description: |
        One row per SDK name and version, platform, app version and SDK key
        seen in a request to the SDK API for the environment (a ruleset
        fetch, a stream connect, a remote evaluation or an events batch),
        polling included, most recently seen first. The SDK and its platform
        are those its `User-Agent` names (`flagnetic-<sdk>/<version>
        (<platform>)`), or `unknown`; the app version is the context's
        `app_version` attribute, which only a remote evaluation carries. A
        row is written at most once a minute, so it may lag a minute behind,
        and is forgotten once its SDK has not been seen for
        `FLAGNETIC_SDK_INVENTORY_RETENTION_DAYS` (90 by default). Whether an
        SDK holds a stream open right now is not shown: each replica knows
        only its own streams.
      x-permission: project.read
      tags: [sdk-keys]
      responses:
        "200":
          description: The SDKs, most recently seen first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkInventory"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/environments/{environment}/sdk-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/EnvironmentKey"
    get:
      operationId: listSdkKeys
      summary: The environment's SDK keys
      description: |
        Every SDK key of the environment, the oldest first, revoked and
        expired ones included, each with its status now. A listed key never
        carries its value.
      x-permission: project.read
      tags: [sdk-keys]
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKeyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSdkKey
      summary: Create an SDK key
      description: |
        Creates a server or a client key for the environment and answers
        its value, shown this once and never again: only its hash is kept.
        An environment holds at most 10 active keys of each kind
        (`409 sdk_key_limit_reached`); a rotated or revoked key does not
        count. Allowed origins are for client keys only
        (`server_key_origins`), at most 50 (`too_many`), each an `http` or
        `https` origin (`invalid_origin`), kept normalized to
        `scheme://host[:port]` without the default port; an empty list
        allows any origin. Refusals of the body are `422 invalid_sdk_key`.
      x-permission: sdk_key.manage
      tags: [sdk-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SdkKeyCreate"
      responses:
        "201":
          description: The key, with its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSdkKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/environments/{environment}/sdk-keys/{sdk_key}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/EnvironmentKey"
      - $ref: "#/components/parameters/SdkKeyID"
    patch:
      operationId: updateSdkKey
      summary: Rename an SDK key or change its allowed origins
      description: |
        Renames the key when `name` is given and replaces its allowed
        origins, which are required, so a script that forgets them cannot
        lift a restriction by accident; `[]` allows any origin. The rules
        of creation apply (`422 invalid_sdk_key`). The change applies to a
        rotated or revoked key too, and an SDK presenting the key meets it
        on its next request. A change to the values the key already has
        records nothing.
      x-permission: sdk_key.manage
      tags: [sdk-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SdkKeyPatch"
      responses:
        "200":
          description: As changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: revokeSdkKey
      summary: Revoke an SDK key
      description: |
        Revokes the key at once: every SDK presenting it is refused
        `sdk_key_revoked` from then on, within its rotation overlap too.
        Revoking a revoked key answers it unchanged and records nothing.
      x-permission: sdk_key.manage
      tags: [sdk-keys]
      responses:
        "200":
          description: The key, revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/environments/{environment}/sdk-keys/{sdk_key}/rotate:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/EnvironmentKey"
      - $ref: "#/components/parameters/SdkKeyID"
    post:
      operationId: rotateSdkKey
      summary: Rotate an SDK key
      description: |
        Creates the key's replacement, of the same kind, name and allowed
        origins, and answers it with its value, shown this once. The
        rotated key keeps working for the rotation overlap, then is refused
        `sdk_key_expired` without anyone acting, so services move to the
        replacement without an outage. Only an active key is rotated
        (`409 sdk_key_not_active`), so a rotated or revoked key is never
        brought back. The replacement takes the rotated key's place among
        the active keys, so a rotation is never refused for the limit.
      x-permission: sdk_key.manage
      tags: [sdk-keys]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SdkKeyRotation"
      responses:
        "201":
          description: The replacement, with its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSdkKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/unit-types:
