          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/experiments/{experiment}/assignment:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/ExperimentKey"
    get:
      operationId: getExperimentAssignment
      summary: How the experiment treats one unit
      description: |
        Which variation the experiment assigns one unit ID, from the
        experiment's own fields in whatever status it is, and the ClickHouse
        query that recomputes it in a warehouse. Both buckets are
        `murmur3_32("{salt}.{unit_id}") mod 10000`: the unit is included when
        its inclusion bucket is below the traffic allocation, and an
        included unit gets the variation whose range of cumulative weights,
        in the experiment's order, holds its variation bucket. It reads no
        event and records nothing. A missing, empty or over-256-byte
        `unit_id` is 400.
      x-permission: project.read
      tags: [experiments]
      parameters:
        - name: unit_id
          in: query
          required: true
          description: A unit ID of the experiment's unit type, 1 to 256 bytes.
          schema:
            type: string
      responses:
        "200":
          description: The unit's buckets, inclusion and variation, and the query recomputing them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/stale-flags:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listStaleFlags
      summary: The project's stale flags
      description: |
        The project's stale flags with their reasons, by key in byte order
        (capitals before lower case), to clean up. Archived flags are never
        listed. A flag is stale for each of these reasons:

        - `lifetime_exceeded`: a temporary flag past its expected removal.
        - `not_evaluated`: no SDK evaluated the flag or recorded an exposure
          of it in any environment for 30 days. Judged only when the project
          received an SDK's evaluation summary on one of those days, and only
          for a flag created more than 30 days ago. Remote evaluations the
          server answered do not count.
        - `owner_inactive`: the owner is deactivated, or is neither an
          instance admin nor holding a grant in the project.
        - `finished_rollout`: every environment is on and serves the same
          variation to everyone, with no prerequisite and no override,
          either through no rule at all or through a first rule without
          conditions serving a rollout at 100 %. An environment switched
          off is never finished.
        - `experiment_overdue`: a running experiment on the flag is past its
          expected end, from the UTC day after it; `experiment` names it.

        Page with `cursor` set to the `next_cursor` of the previous page,
        under the same filters.
      x-permission: project.read
      tags: [flags]
      parameters:
        - name: reason
          in: query
          description: Lists only the flags stale for one of these reasons; absent for every stale flag.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/StaleReason"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of stale flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaleFlagList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/stale-flags/send:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      operationId: sendStaleFlagDigest
      summary: Send the stale-flag digest now
      description: |
        Queues the project's `report.stale_flags` event now, attributed to
        the caller, and answers the stale flags it lists, as
        `GET /projects/{project}/stale-flags` reads them. The event is sent
        even when nothing is stale, so a maintainer can test a receiver;
        it carries `items`, the same stale flags. It is no weekly digest:
        it records no slot, so it neither replaces nor suppresses the one
        sent at `FLAGNETIC_DIGEST_WEEKDAY` and `FLAGNETIC_DIGEST_HOUR`.
        Delivery follows the subscriptions naming `report.stale_flags` (or
        `*`); with none, the event is not kept.
      x-permission: webhook.manage
      tags: [flags, webhooks]
      responses:
        "202":
          description: The digest is queued; these are the stale flags it lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaleFlagDigest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/hash-check:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      operationId: checkHashUniformity
      summary: Check the hash's uniformity on real unit IDs
      description: |
        Buckets every unit ID with `murmur3_32("{salt}.{unit_id}") mod
        10000`, groups the 10000 buckets into `bins` bins of consecutive
        buckets (bucket `b` falls into bin `b × bins / 10000`, so bins differ
        in width by at most one bucket), and compares each bin's count with
        what a uniform hash expects of its width, `N × width / 10000`, by
        Pearson's chi-square test with `bins − 1` degrees of freedom: it is
        `uniform` when `p_value` is at least 0.001. Duplicate IDs count as
        often as they occur. With `second_salt` it also tests that both
        salts' buckets are independent, as an experiment's inclusion and
        variation buckets must be: Pearson's test of independence on the
        `bins × bins` table of both bins, over its non-empty rows and
        columns. The same check runs offline as `flagnetic hash-check`, so
        unit IDs never have to leave a machine. It records nothing.

        Refused with 422 `invalid_uniformity_check`: fewer than 1000 or more
        than 200000 unit IDs (`/unit_ids`, `out_of_range`), a unit ID empty
        or over 256 bytes (`/unit_ids/{i}`, `invalid_value`, the first 100
        only), `bins` outside 2 to 10000 (`/bins`, `out_of_range`), or a salt
        empty or over 256 bytes (`/salt`, `/second_salt`, `invalid_value`).
        Its body may take up to 64 MiB, enough for 200000 IDs of 256 bytes,
        whatever the server's limit for other bodies.
      x-permission: project.read
      x-max-body-bytes: 67108864
