      summary: Download the project's audit log
      description: |
        Downloads the entries the list would return for the same filters, in
        one response and not a page at a time: `format=jsonl` (the default)
        writes one entry per line, each equal to the entry as the list reads
        it; `format=csv` writes a header row and one row per entry, with
        `before` and `after` as compact JSON and every cell that begins with
        `=`, `+`, `-`, `@`, a tab or a carriage return prefixed with `'`, so
        that a spreadsheet shows it as text.

        The entries are counted first: a filter matching more than
        `FLAGNETIC_AUDIT_EXPORT_MAX_ENTRIES` (100,000 unless set) is refused
        `export_too_large` before anything is sent; narrow it with `from` and
        `to`. The entries are then streamed from one snapshot of the log.
      x-permission: project.read
      tags: [audit]
      parameters:
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditActorKind"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditEntityKind"
        - $ref: "#/components/parameters/AuditEntityID"
        - $ref: "#/components/parameters/AuditEnvironment"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditQ"
        - $ref: "#/components/parameters/AuditKillSwitch"
        - $ref: "#/components/parameters/AuditChangeRequest"
        - $ref: "#/components/parameters/AuditExportFormat"
      responses:
        "200":
          description: |
            Every matching entry, newest first, as an attachment named
            `audit-{project key|instance}-{UTC time}.{jsonl|csv}`.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One `AuditEntry` document per line, each equal to the entry as `GET /projects/{project}/audit/{entry}` reads it.
            text/csv:
              schema:
                type: string
                description: A header row, then one row per entry.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/audit/{entry}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - name: entry
        in: path
        required: true
        description: The entry's identifier.
        schema:
          type: string
    get:
      operationId: getProjectAuditEntry
      summary: One audit entry of the project
      description: An entry of another project, or of none, is not found here.
      x-permission: project.read
      tags: [audit]
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/stream:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: streamProjectChanges
      summary: The project's change stream
      description: |
        A server-sent event stream with one notice per audit entry the
        project records, from whichever replica made the change, so a client
        refetches what it shows of the entity named. A notice never carries
        the change itself.

        The first frame is `retry: 3000`. Each notice is a frame
        `event: change`, `id: <audit entry id>`, `data:
        {"kind", "key", "environment", "version", "actor"}`: the entity's
        kind and key as the entry names them, the key of the environment
        the change addressed (null for none, or once that environment is
        gone), the entity's version after the change (before it for a
        deletion; null for an entity without one) and the actor as the
        audit log names it. Notices not yet sent are coalesced per entity:
        a later change of an entity replaces the one waiting.

        `event: refetch` with `data: {}` tells the client to refetch
        everything it shows of the project: after the replica may have
        missed a notice, when more than 1,000 notices wait unsent, and when
        `Last-Event-ID` names no entry of the project. With a known
        `Last-Event-ID`, the entries after it are sent first, up to 1,000;
        more than that is a refetch.

        A comment `: hb` every 15 seconds tells a quiet stream from a dead
        one. The caller's access to the project is resolved again at every
        notice and heartbeat, and the stream ends once it no longer holds
        `project.read` or the project is gone. The server closes a stream
        after about an hour (60 minutes plus up to 5 of jitter) and when it
        shuts down; the client reconnects with `Last-Event-ID`. A caller (a
        member, or a project token) holds at most 10 streams open on one
        replica.
      x-permission: project.read
      tags: [audit]
      parameters:
        - name: Last-Event-ID
          in: header
          description: The id of the last notice the client heard.
          schema:
            type: string
      responses:
        "200":
          description: The stream, held open.
          headers:
            Cache-Control:
              description: "`no-cache`."
              schema:
                type: string
            X-Accel-Buffering:
              description: "`no`, so a proxy passes each frame on at once."
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: "`too_many_streams`: the caller holds 10 change streams open on this replica already; `Retry-After` gives the seconds to wait."
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /members:
    get:
      operationId: listMembers
      summary: The instance's members
      description: Every member of the instance, ordered by email, with how many projects each holds a grant in and when they last signed in.
      x-permission: instance_admin
      tags: [members]
      parameters:
        - name: status
          in: query
          description: Only the members in this status.
          schema:
            $ref: "#/components/schemas/MemberStatus"
        - name: q
          in: query
          description: Text found, whatever its case, in the member's email or display name.
          schema:
            type: string
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: inviteMember
      summary: Invite someone to the instance
      description: |
        Creates an invited member and their invitation, and answers the
        invitation's one-time link, to pass on to them: it is shown this
        once and never again. The link is `FLAGNETIC_BASE_URL`, or this
        request's origin when it is not set, followed by
        `/invitations/<secret>`; it expires after seven days. An email the
        instance holds, whatever its case, is refused `already_exists`.

        The invitation may carry a `grant` of a built-in role in a project,
        which accepting it makes by hand, in the name of the instance admin
        who invited. An unknown project, or a role that is none of the
        built-in ones, is refused `invalid_grant`. The grant is dropped when
        its inviter is deactivated or demoted from instance admin without
        holding `grant.manage` in the project before it is accepted; the
        invitation still activates the person.
      x-permission: instance_admin
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInvite"
      responses:
        "201":
          description: The member invited, with their invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /members/{member}:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    get:
      operationId: getMember
      summary: A member
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMember
      summary: Edit a member, or make them instance admin or not
      description: |
        Changes the fields sent and leaves the others as they are. An email
        another member holds, whatever its case, is refused `already_exists`.
        Demoting the instance's last active instance admin is refused
        `last_instance_admin`, and demoting one an auth provider's group
        mapping made `sso_sourced`: only the provider takes it away. Making a
        member still invited an instance admin is refused `member_invited`:
        they are made one once they have accepted their invitation.
      x-permission: instance_admin
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPatch"
      responses:
        "200":
          description: The member as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /members/{member}/deactivate:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    post:
      operationId: deactivateMember
      summary: Offboard a member
      description: |
        The member can no longer sign in, and every session and personal
        access token they hold is revoked with them, at once, and every link
        of theirs stops working. Project tokens
        they created keep working: they belong to their project. Deactivating
        the instance's last active instance admin is refused
        `last_instance_admin`; deactivating a deactivated member changes
        nothing.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The member, deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /members/{member}/reactivate:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    post:
      operationId: reactivateMember
      summary: Bring a deactivated member back
      description: |
        The member becomes active when they hold a password. One who never
        set one is invited again, and the answer carries their fresh
        invitation's one-time link, as on invitation. What their
        deactivation revoked stays revoked: they sign in afresh and create
        new tokens. Reactivating a member who is not deactivated changes
        nothing.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The member, reactivated, with the invitation issued to them if one was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member}/invitation:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    post:
      operationId: reissueInvitation
      summary: Replace an invited member's link
      description: |
        Issues a fresh invitation, answered with its one-time link as on
        invitation, and kills every earlier link of the member. A member who
        is not invited is refused `member_not_invited`. The fresh invitation
        keeps the project and role of the one it replaces only while the
        member who issued that one still holds `grant.manage` in the project;
        otherwise it grants nothing, and the audit log records
        `invitation.grant_revoked`.
      x-permission: instance_admin
      tags: [members]
      responses:
        "201":
          description: The member with their fresh invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInvitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /members/{member}/password-reset:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    post:
      operationId: issuePasswordReset
      summary: Issue a password reset for a member
      description: |
        Issues a one-time link that lets an active member set a new password,
        answered with the link, shown this once and never mailed. It expires
        after an hour. A member who is still invited is refused
        `member_not_active`: issue their invitation again instead. A
        deactivated member is refused `member_deactivated`. Earlier password
        resets of the member stay open; completing one ends the others.
        Recorded as `password.reset_issued`, without the link.
      x-permission: instance_admin
      tags: [members]
      responses:
        "201":
          description: The password reset's one-time link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedPasswordReset"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /members/{member}/identities:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    get:
      operationId: listMemberIdentities
      summary: A member's ways to sign in
      description: |
        Whether the member holds a password and when they set it, and the
        identities they linked at auth providers, as `/me/identities` lists
        them.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The member's password status and identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAuthMethods"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member}/identities/{identity}:
    parameters:
      - $ref: "#/components/parameters/MemberID"
      - $ref: "#/components/parameters/IdentityID"
    delete:
      operationId: unlinkMemberIdentity
      summary: Unlink a member's identity
      description: |
        Unlinks an identity of the member, under the rules of a member
        unlinking their own: refused 409 `last_auth_method` when it is the
        member's last usable way in, except for a deactivated member, who
        signs in nowhere, and 409 `provider_enforced` for the identity at the
        auth provider the member's email domain is enforced to. An identity
        that does not belong to the member is not found. Recorded as `identity.unlinked` with the instance admin as
        its actor.
      x-permission: instance_admin
      tags: [members]
      responses:
        "204":
          description: Unlinked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /members/{member}/sessions:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    get:
      operationId: listMemberSessions
      summary: A member's sessions
      description: Every device the member is signed in on, newest first, for an instance admin answering an incident. Sessions that have ended are left out.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The live sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: revokeMemberSessions
      summary: Sign a member out everywhere
      description: Revokes every live session of the member. When that includes the session this request is signed in to, its cookie is cleared. An instance admin revokes their own sessions only from a session; their API token is refused `session_required`, as on `/me/sessions`.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The number of sessions revoked.
          headers:
            Set-Cookie:
              description: The session cookie, cleared when the session this request is signed in to was revoked.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member}/tokens:
    parameters:
      - $ref: "#/components/parameters/MemberID"
    get:
      operationId: listMemberTokens
      summary: A member's personal access tokens
      description: Every personal access token of the member, the newest first, revoked and expired ones included, for an instance admin answering an incident.
      x-permission: instance_admin
      tags: [members]
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member}/tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/MemberID"
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeMemberToken
      summary: Revoke a member's personal access token
      description: Revokes one of the member's tokens. A token of another member, one already revoked or an identifier that names none is not found. An instance admin revokes their own tokens only from a session; their API token is refused `session_required`, as on `/me/tokens`.
      x-permission: instance_admin
      tags: [members]
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /instance/auth-settings:
    get:
      operationId: getAuthSettings
      summary: The instance's auth settings
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The settings in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateAuthSettings
      summary: Change the instance's auth settings
      description: |
        Replaces every setting. Every replica applies a change within a
        second, and live sessions are judged by lowered timeouts at once: a
        session past a lowered idle or absolute timeout ends. A raised
        absolute timeout never lengthens a session that opened under a lower
        one. Refused `invalid_auth_settings` naming each field that breaks a
        rule: every duration a whole number of seconds from 60 to 315360000
        (ten years), the idle timeout at most the absolute one, the password
        minimum length from 12 to 128, and each enforced domain named once,
        to an enabled auth provider that lists it among its domains.
        `sso_enforced_domains` is the whole list: a domain left out is
        lifted. Disabling local login, or changing the enforced domains while
        it is disabled, is refused `identity_required` unless the caller
        holds an identity that signs them in under the new settings: at an
        enabled auth provider and, when their own email domain is enforced,
        at the provider it is enforced to. Whoever closes the door keeps a
        way through it; `flagnetic admin unlock`
        enables it again from the server's side. Audited
        `auth_settings.updated`.
      x-permission: instance_admin
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSettings"
      responses:
        "200":
          description: The settings as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /instance/auth-providers:
    get:
      operationId: listAuthProviders
      summary: The instance's auth providers
      description: |
        Ordered by display name. A client secret is never listed:
        `client_secret_set` says whether there is one.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The auth providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAuthProvider
      summary: Add an auth provider
      description: |
        Adds an identity provider members can sign in through. It vouches only
        for the email domains it names (`domains`, at least one, lowercased).
        The client secret is sealed and never read back. The answer carries the
        `redirect_uri` (OIDC) or the `acs_url`, `entity_id` and `metadata_url`
        (SAML) to register at the identity provider. A SAML provider's metadata
        is fetched or read now, and a key pair for the instance to present to it
        is generated and sealed; metadata that cannot be used is 422
        `invalid_auth_provider` (violation `no_redirect_binding` when the
        identity provider offers no HTTP-Redirect sign-on service), and one that
        cannot be fetched 502 `provider_unreachable`. Refused 422
        `base_url_required` while the instance has no `FLAGNETIC_BASE_URL`, and
        `insecure_url` for an `http` issuer or metadata URL other than on a
        loopback address; private networks are allowed. A slug already in use is
        409 `already_exists`. Audited `auth_provider.created`.
      x-permission: instance_admin
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProviderCreate"
      responses:
        "201":
          description: The new auth provider.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /instance/auth-providers/{provider}:
    parameters:
      - $ref: "#/components/parameters/AuthProviderSlug"
    get:
      operationId: getAuthProvider
      summary: An auth provider
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The auth provider; its `ETag` is its version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvider"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAuthProvider
      summary: Edit an auth provider
      description: |
        Changes any property but `slug` and `kind`; each absent one is left as
        it is, a sent `client_secret` replaces the stored one, and a `claims`
        member names only the claims to rename. The stored client secret stays
        only for the `issuer` and `client_id` it was given for: an edit that
        changes either without sending `client_secret` is refused
        `invalid_auth_provider` with a violation at `/client_secret`. Whether the provider is enabled
        is changed with `enable` and `disable`. Refused as a creation is, and
        409 `provider_in_use` (`used_by` naming `enforced domains`) when it
        drops a domain enforced to the provider: lift the enforcement first.
        Audited `auth_provider.updated`; an edit that changes nothing is not.
      x-permission: instance_admin
      tags: [instance]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProviderPatch"
      responses:
        "200":
          description: The auth provider as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteAuthProvider
      summary: Delete an auth provider
      description: |
        Refused 409 `provider_in_use` while something depends on the provider;
        `used_by` names what (`identities`, `grants` while its group mappings
        made a grant or an instance admin, `enforced domains` while a domain
        is enforced to it, `only way in` while it is the only enabled
        provider and local login is disabled, among others). Disable it instead:
        that stops its sign-ins and leaves its members, identities and grants
        as they are. Audited
        `auth_provider.deleted`.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /instance/auth-providers/{provider}/enable:
    parameters:
      - $ref: "#/components/parameters/AuthProviderSlug"
    post:
      operationId: enableAuthProvider
      summary: Enable an auth provider
      description: |
        Offers the provider on the sign-in page. Refused 422
        `base_url_required` as a creation is. An enabled provider is answered
        as it is. Audited `auth_provider.enabled`.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The auth provider, enabled.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvider"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /instance/auth-providers/{provider}/disable:
    parameters:
      - $ref: "#/components/parameters/AuthProviderSlug"
    post:
      operationId: disableAuthProvider
      summary: Disable an auth provider
      description: |
        Stops the provider's sign-ins and leaves its
        members, identities and grants as they are. A disabled provider is
        answered as it is. Refused 409 `provider_in_use` while people are sent
        to it: `used_by` names `enforced domains` while a domain is enforced
        to it, and `only way in` while it is the only enabled provider and
        local login is disabled. Audited `auth_provider.disabled`.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The auth provider, disabled.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvider"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /instance/auth-providers/{provider}/rotate-certificate:
    parameters:
      - $ref: "#/components/parameters/AuthProviderSlug"
    post:
      operationId: rotateAuthProviderCertificate
      summary: Start rotating a SAML provider's SP certificate
      description: |
        Generates the next key pair (an RSA-2048 key and a self-signed certificate
        valid for three years) beside the current one. The SP metadata lists both
        certificates from then on, so the identity provider can import the new one;
        an assertion encrypted to either is accepted, while authentication requests
        stay signed with the current key. Complete the rotation once the identity
        provider has imported the metadata. Refused `409 rotation_pending` while a
        rotation is pending and `422 not_saml` for an OIDC provider. Audited
        `auth_provider.certificate_rotation_started`, naming the certificates by
        fingerprint.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The auth provider, with the next certificate in `sp_certificates`.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvider"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /instance/auth-providers/{provider}/rotate-certificate/complete:
    parameters:
      - $ref: "#/components/parameters/AuthProviderSlug"
    post:
      operationId: completeAuthProviderCertificateRotation
      summary: Complete the rotation of a SAML provider's SP certificate
      description: |
        Makes the next key pair current and destroys the retired private key: from
        then on requests are signed with the new key and an assertion encrypted to the
        old certificate is refused. Do it once the identity provider has imported the
        SP metadata that lists the new certificate. Refused `409 no_rotation_pending`
        when none was started and `422 not_saml` for an OIDC provider. Audited
        `auth_provider.certificate_rotation_completed`.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The auth provider, with the new certificate current and no other.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvider"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /instance/auth-providers/{provider}/group-mappings:
    parameters:
      - $ref: "#/components/parameters/AuthProviderSlug"
    get:
      operationId: getAuthProviderGroupMappings
      summary: An auth provider's group mappings
      description: |
        What the provider's directory groups grant, in order: a role in a
        project, or instance admin.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The group mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMappings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceAuthProviderGroupMappings
      summary: Replace an auth provider's group mappings
      description: |
        Replaces the whole list, then runs it at once for every member the
        provider knows, those who claimed groups at it on a sign-in: each is
        granted what their groups now map to and loses what the provider
        granted and no longer maps. A grant of a mapping is `source` `sso` and
        names the provider; grants of other sources, and an instance admin made
        by hand or by another provider, are left alone. The last active
        instance admin is never demoted by a mapping, and is counted in
        `kept_instance_admin` instead. A mapping has a non-blank `group` and
        either a `project` (key) with a built-in `role`, or `instance_admin`
        alone; a mapping that breaks that, or names a project that does not
        exist, is 422 `invalid_group_mappings` naming each field and nothing
        changes. Audited `group_mappings.updated`, and each grant and promotion
        under the provider as the `sso` actor; a replacement that changes
        nothing is not.
      x-permission: instance_admin
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMappings"
      responses:
        "200":
          description: What running the mappings did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMappingsRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /instance/auth-providers/{provider}/scim-groups:
    parameters:
      - $ref: "#/components/parameters/AuthProviderSlug"
    get:
      operationId: listAuthProviderScimGroups
      summary: An auth provider's SCIM groups
      description: |
        The groups the provider's directory has pushed through SCIM, by name,
        each with how many of the provider's provisioned members it holds. The
        directory owns them: they are read only here, and group mappings match
        them by `display_name`.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The SCIM groups, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimGroupList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /instance/auth-providers/{provider}/test:
    parameters:
      - $ref: "#/components/parameters/AuthProviderSlug"
    post:
      operationId: testAuthProvider
      summary: Test that an auth provider can be reached
      description: |
        Fetches the provider's discovery document now (OIDC), or fetches its
        metadata again and reads it, or reads the metadata pasted (SAML),
        enabled or not, and answers what it found. Refused 502
        `provider_unreachable` with the `failure` when the provider does not
        answer, answers anything but a document, names another issuer, or its
        metadata cannot be used. Nothing is stored.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: What the discovery document says.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderTest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /instance/scim-tokens:
    get:
      operationId: listScimTokens
      summary: The instance's SCIM tokens
      description: |
        Every SCIM token, the newest first, revoked and expired ones included,
        by their hint and the auth provider each is bound to: a token's value
        is shown only when it is created.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimTokenList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createScimToken
      summary: Create a SCIM token
      description: |
        Creates a SCIM token an identity provider presents to `/scim/v2` and
        answers its value, shown this once and never again. The token is bound
        for life to the auth provider named by `provider`: it reaches that
        provider's provisioned members and groups and nothing else, and it is
        refused while the provider is disabled. An unknown provider and an expiry
        that is not in the future are refused 422 `invalid_scim_token`, naming
        the field. Only a session creates a token, so a leaked
        credential can never multiply itself. Audited `scim_token.created`.
      x-permission: instance_admin
      x-session-required: true
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScimTokenCreate"
      responses:
        "201":
          description: The token, with its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedScimToken"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /instance/scim-tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeScimToken
      summary: Revoke a SCIM token
      description: |
        Revokes the token, which `/scim/v2` refuses from then on. A token
        already revoked, or an identifier that names none, is not found.
        Audited `scim_token.revoked`.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /instance/smtp:
    get:
      operationId: getMailSettings
      summary: The instance's SMTP server
      description: The server the instance mails through. The password is never answered, only whether one is stored. Not found while no SMTP server is configured.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "200":
          description: The SMTP settings in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMailSettings
      summary: Set the instance's SMTP server
      description: |
        Replaces the SMTP settings. Refused `base_url_required` (422) while
        the instance has no `FLAGNETIC_BASE_URL`, since every mailed link is
        built from it. Refused `invalid_smtp_settings` naming each field
        that breaks a rule: a host of 1 to 253 characters without spaces, a
        port from 1 to 65535, `starttls`, `tls` or `none` for the security, a
        sender that is one address, a username and a password together, and
        credentials over `none` only to a host that is this machine.

        The password is sealed under the instance's secret key and is write
        only. Leave it out to keep the stored one; send an empty one together
        with an empty username to remove both. A change that leaves the
        settings as they are is accepted and recorded nowhere.
      x-permission: instance_admin
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmtpSettingsUpdate"
      responses:
        "200":
          description: The settings as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteMailSettings
      summary: Remove the instance's SMTP server
      description: The instance stops mailing; what it mails is shown as links again. Not found while no SMTP server is configured.
      x-permission: instance_admin
      tags: [instance]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /instance/smtp/test:
    post:
      operationId: sendTestMail
      summary: Send the caller a test mail
      description: |
        Sends a mail to the caller's own address, in their language, through
        the SMTP server in force, and answers once the server accepted it: the
        only mail the instance sends while its sender waits. Refused
        `smtp_not_configured` (409) while there is no SMTP server, and
        `smtp_failed` (502) with `failure` naming the step that failed:
        `connection` (unreachable or broken), `tls` (no STARTTLS, a
        handshake or certificate that failed), `authentication` (the
        credentials were refused) or `rejected` (the sender, the recipient or
        the mail was refused).
      x-permission: instance_admin
      tags: [instance]
      responses:
        "204":
          description: The server accepted the mail.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
  /audit:
    get:
      operationId: listAuditEntries
      summary: The instance's audit log
      description: |
        Every entry of the instance, of every project and of none (members,
        sign-ins, settings), newest first. `project` narrows it to one
        project's entries.
      x-permission: instance_admin
      tags: [audit]
      parameters:
        - name: project
          in: query
          description: The identifier of the project whose entries to list, kept by its entries after the project is gone.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditActorKind"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditEntityKind"
        - $ref: "#/components/parameters/AuditEntityID"
        - $ref: "#/components/parameters/AuditEnvironment"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditQ"
        - $ref: "#/components/parameters/AuditKillSwitch"
        - $ref: "#/components/parameters/AuditChangeRequest"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /audit/export:
    get:
      operationId: exportAuditEntries
      summary: Download the instance's audit log
      description: |
        Downloads the entries the list would return for the same filters, in
        one response and not a page at a time: `format=jsonl` (the default)
        writes one entry per line, each equal to the entry as the list reads
        it; `format=csv` writes a header row and one row per entry, with
        `before` and `after` as compact JSON and every cell that begins with
        `=`, `+`, `-`, `@`, a tab or a carriage return prefixed with `'`, so
        that a spreadsheet shows it as text.

        The entries are counted first: a filter matching more than
        `FLAGNETIC_AUDIT_EXPORT_MAX_ENTRIES` (100,000 unless set) is refused
        `export_too_large` before anything is sent; narrow it with `from` and
        `to`. The entries are then streamed from one snapshot of the log.

        `project` narrows it to one project's entries.
      x-permission: instance_admin
      tags: [audit]
      parameters:
        - name: project
          in: query
          description: The identifier of the project whose entries to download, kept by its entries after the project is gone.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditActorKind"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditEntityKind"
        - $ref: "#/components/parameters/AuditEntityID"
        - $ref: "#/components/parameters/AuditEnvironment"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditQ"
        - $ref: "#/components/parameters/AuditKillSwitch"
        - $ref: "#/components/parameters/AuditChangeRequest"
        - $ref: "#/components/parameters/AuditExportFormat"
      responses:
        "200":
          description: |
            Every matching entry, newest first, as an attachment named
            `audit-{project key|instance}-{UTC time}.{jsonl|csv}`.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One `AuditEntry` document per line, each equal to the entry as `GET /projects/{project}/audit/{entry}` reads it.
            text/csv:
              schema:
                type: string
                description: A header row, then one row per entry.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /webhook-event-types:
    get:
      operationId: listWebhookEventTypes
      summary: The event catalogue
      description: |
        Every event type a webhook subscription may name, with what emits
        it. `*` in a subscription's `events` matches every type but
        `audit.entry`, which a subscription names to get.
      x-permission: member
      tags: [webhooks]
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEventTypeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{project}/webhooks:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listWebhooks
      summary: The project's webhook subscriptions
      description: The oldest first. A secret is never listed; it is shown once, when it is issued.
      x-permission: webhook.manage
      tags: [webhooks]
      responses:
        "200":
          description: The project's webhook subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createWebhook
      summary: Subscribe to events
      description: |
        Creates a webhook subscription and answers it with its `secret`,
        shown this once: it is stored sealed under `FLAGNETIC_SECRET_KEY`
        and never answered again, and audit entries record it as
        `[redacted]`. A subscription created now is sent only events of
        changes made after it.

        `url` must be `https` (`insecure_url`) unless the operator set
        `FLAGNETIC_WEBHOOK_ALLOW_HTTP`, and a target whose name resolves to
        anything but a global unicast address (loopback, private, link-local,
        carrier-grade NAT and every other special-purpose range, and a NAT64
        or 6to4 address embedding one) is refused (`private_network_target`)
        unless the operator set
        `FLAGNETIC_WEBHOOK_ALLOW_PRIVATE_NETWORKS`; a name that does not
        resolve is accepted. An event type outside the catalogue is `unknown_event_type`.
        A blank name or one over 200 characters, a `url` that is not an
        absolute http or https URL without credentials or a fragment, no
        event type, and an environment the project does not have are
        `invalid_webhook`.
      x-permission: webhook.manage
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreate"
      responses:
        "201":
          description: The new subscription with its secret, shown this once.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/webhooks/{webhook}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/WebhookID"
    get:
      operationId: getWebhook
      summary: A webhook subscription
      x-permission: webhook.manage
      tags: [webhooks]
      responses:
        "200":
          description: The subscription; its `ETag` is its version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWebhook
      summary: Edit a webhook subscription
      description: |
        Changes each property present and leaves the others as they are,
        with the refusals of creation; a new `url` is checked as on
        creation. An edit that changes nothing stores and records nothing.
        `enabled: true` on a subscription the platform disabled is refused
        `409 webhook_disabled`: `POST .../enable` enables it and resets its
        failures.
      x-permission: webhook.manage
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPatch"
      responses:
        "200":
          description: The subscription as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook subscription
      description: |
        The subscription goes, and nothing more is sent under it. Unlike an
        edit it takes no `If-Match`: whatever the subscription became, the
        caller wants nothing more sent to its target.
      x-permission: webhook.manage
      tags: [webhooks]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/webhooks/{webhook}/test:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: testWebhook
      summary: Send a test ping
      description: |
        Queues a `ping` event for this subscription alone, whatever event
        types it names, and answers the pending delivery; the delivery
        worker sends it within a few seconds, signed like every event, and
        its attempts show in the delivery log. The ping names the project
        and the caller; its environment, entity and audit entry are null.
        A disabled subscription is refused `409 webhook_disabled`, since
        the ping would wait unsent until it is enabled.
      x-permission: webhook.manage
      tags: [webhooks]
      responses:
        "202":
          description: The ping's delivery, pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{project}/webhooks/{webhook}/enable:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: enableWebhook
      summary: Enable a webhook subscription
      description: |
        Enables a subscription the platform disabled for failing
        persistently, or one a member disabled: its `disabled_reason` is
        cleared, `consecutive_failures` reset, and the day without a success
        that disables it again counts from now. Events are queued for it from
        here on; deliveries dropped when it was disabled stay dropped. An
        enabled subscription is answered as it is, with no audit entry. It
        takes no `If-Match`: whatever the subscription became, the caller
        wants it sent events again.
      x-permission: webhook.manage
      tags: [webhooks]
      responses:
        "200":
          description: The subscription, enabled.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/webhooks/{webhook}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: rotateWebhookSecret
      summary: Rotate a webhook subscription's secret
      description: |
        Issues the subscription a new secret, answered this once. The secret
        it replaces keeps signing beside the new one until
        `previous_secret_expires_at`, the operator's
        `FLAGNETIC_WEBHOOK_SECRET_OVERLAP` (24 hours unless set) from now, so
        each call carries two `v1=` signatures meanwhile and a receiver
        holding either verifies. A secret an earlier rotation left signing is
        dropped at once: no more than two sign. It takes no `If-Match`.
      x-permission: webhook.manage
      tags: [webhooks]
      responses:
        "200":
          description: The subscription with its new secret.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/webhooks/{webhook}/deliveries:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/WebhookID"
    get:
      operationId: listWebhookDeliveries
      summary: A webhook subscription's delivery log
      description: |
        Every event made a delivery to the subscription, newest first,
        filtered by every parameter given: one delivery per event the
        subscription wanted when the event happened, pending until it is
        sent. Page with `cursor` set to the `next_cursor` of the previous
        page: deliveries made meanwhile never shift a page.
      x-permission: webhook.manage
      tags: [webhooks]
      parameters:
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
      - name: event_type
        in: query
        description: An event type, such as `flag.kill_switch`.
        schema:
          type: string
      - name: from
        in: query
        description: The earliest time a delivery was made, included.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: The latest time a delivery was made, included.
        schema:
          type: string
          format: date-time
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of deliveries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/webhooks/{webhook}/deliveries/{delivery}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/WebhookID"
      - name: delivery
        in: path
        required: true
        description: The delivery's identifier.
        schema:
          type: string
          format: uuid
    get:
      operationId: getWebhookDelivery
      summary: One delivery of a webhook subscription
      x-permission: webhook.manage
      tags: [webhooks]
      responses:
        "200":
          description: The delivery with every attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/webhooks/{webhook}/deliveries/{delivery}/redeliver:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/WebhookID"
      - name: delivery
        in: path
        required: true
        description: The delivery whose event to send again.
        schema:
          type: string
          format: uuid
    post:
      operationId: redeliverWebhookDelivery
      summary: Send a delivery's event again
      description: |
        Queues the delivery's event again as a new delivery, with the same
        event `id` and body byte for byte, and answers it pending; the
        delivery redelivered is left as it is. A receiver deduplicating on
        the event `id` recognises it, and one that lost it takes it. A
        disabled subscription is refused `409 webhook_disabled`.
      x-permission: webhook.manage
      tags: [webhooks]
      responses:
        "202":
          description: The new delivery, pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{project}/sinks:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      operationId: listSinks
      summary: The project's sinks
      description: |
        The oldest first. A sink's credentials are never listed: the
        ClickHouse `password` and the object storage `secret_access_key` read
        back as `***`, and a webhook sink's secret is shown once, when it is
        issued. Reading sinks needs `sink.manage` too, since a sink's
        configuration names internal hosts, buckets and URLs that may carry
        tokens.
      x-permission: sink.manage
      tags: [sinks]
      responses:
        "200":
          description: The project's sinks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSink
      summary: Add a sink
      description: |
        Creates a sink of the `kind` given and the configuration of that kind
        alone (`clickhouse`, `object_storage` or `webhook`), disabled: it
        delivers nothing until it is enabled. The ClickHouse `password` and
        the object storage `secret_access_key` are required, stored sealed
        under `FLAGNETIC_SECRET_KEY` and read back as `***`. A webhook sink's
        secret is drawn by the server, 32 random bytes as unpadded base64url,
        and answered as `secret` this once; audit entries record every secret
        as `[redacted]`. Receivers verify a webhook sink's calls as they
        verify a webhook subscription's.

        Batching defaults by kind: ClickHouse 5,000 events every 10 s, object
        storage 500,000 every 300 s (flush interval 60 to 3,600 s), webhook
        500 every 5 s (at most 5,000). `event_kinds` and `environments` left
        empty mean every one.

        Refused as `invalid_sink`, with `errors` naming each field by JSON
        Pointer: a blank name, a configuration missing or of another kind,
        a URL that is not an absolute http or https URL without credentials,
        a required field left out, a setting delivery sets itself, a header
        of the platform's own, an event kind or a batching value out of
        range. An environment the project does not have is
        `unknown_environment`. A webhook sink's `url` must be `https`
        (`insecure_url`) unless the operator set
        `FLAGNETIC_WEBHOOK_ALLOW_HTTP`, and its name must resolve only to
        global unicast addresses, not loopback, private, link-local,
        carrier-grade NAT or any other special-purpose range, nor a NAT64 or
        6to4 address embedding one (`private_network_target`), unless the
        operator set `FLAGNETIC_WEBHOOK_ALLOW_PRIVATE_NETWORKS`. A ClickHouse
        or object storage target may be on a private or loopback address,
        never on a link-local one, EC2's IPv6 metadata address
        `fd00:ec2::254`, or a NAT64 or 6to4 address embedding a link-local
        one (`link_local_target`), which no setting lifts. A name that does
        not resolve is accepted.
      x-permission: sink.manage
      tags: [sinks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinkCreate"
      responses:
        "201":
          description: The new sink, with its secret when it is a webhook sink, shown this once.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/sinks/test:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      operationId: testSinkConfig
      summary: Test a sink's configuration before saving it
      description: |
        Checks a configuration as creating a sink would, then calls its target
        and answers whether it works, why not, and what is wrong with it that
        does not stop delivery. Nothing is stored or created at the target: a
        ClickHouse test never creates tables, and says so in its warnings. The
        test is audited as `sink.config_tested`, by its outcome and not its
        target. A webhook sink is called with a signature made from a
        secret drawn for the test and thrown away. The target's own words are
        never answered, only the failure's class, status and code. Saving a
        sink is never blocked by its test.
      x-permission: sink.manage
      tags: [sinks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinkCreate"
      responses:
        "200":
          description: What the test found; a target that fails is a 200 with `ok` false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/sinks/{sink}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
    get:
      operationId: getSink
      summary: A sink
      x-permission: sink.manage
      tags: [sinks]
      responses:
        "200":
          description: The sink; its `ETag` is its version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSink
      summary: Edit a sink
      description: |
        Changes each property present and leaves the others as they are. A
        sub-object of the sink's kind replaces its configuration whole, so
        nothing of the earlier one lingers; the one exception is its secret:
        `***`, as every read answers it, or no secret at all keeps the stored
        one, and any other value replaces it. The stored secret stays only for
        the target it was given for: an edit that changes a ClickHouse `url`,
        `username` or `tls_skip_verify`, or an object storage `endpoint` or
        `access_key_id`, must send the secret again, or is refused
        `invalid_sink` with a violation `required` at the secret. A sub-object of another kind,
        or a `kind` other than the sink's own, is refused `kind_immutable`.
        `enabled` takes `false` only, which lets the attempt in progress
        finish and keeps the sink's place; a sink is enabled with its own
        operation, which checks the target first. A new target is checked as
        on creation, and an edit that changes nothing stores and records
        nothing. An edit of batching or filters applies from the next batch.
      x-permission: sink.manage
      tags: [sinks]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinkPatch"
      responses:
        "200":
          description: The sink as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteSink
      summary: Delete a sink
      description: The sink goes, and nothing more is sent to its target.
      x-permission: sink.manage
      tags: [sinks]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{project}/sinks/{sink}/enable:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
    post:
      operationId: enableSink
      summary: Enable a sink
      description: |
        Calls the sink's target first and refuses with `sink_not_ready`, naming
        the failure by `class`, `status` and `code`, when it does not answer
        or cannot take a batch; a ClickHouse sink with `create_tables` also
        creates its tables. Then every event kind the sink exports gets a
        stream that starts at the horizon: what the project receives from now
        on. `start_from`, a time still within retention (`out_of_retention`
        otherwise), starts the streams this call creates at the first event
        received at or after it, which backfills them; a stream the sink
        already has keeps its place, so enabling a sink again continues where
        it stopped. A sink that is already enabled is answered as it is, with
        nothing probed or recorded. Enabling a stopped sink leaves it stopped
        until it is resumed. It takes no `If-Match`.
      x-permission: sink.manage
      tags: [sinks]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinkEnable"
      responses:
        "200":
          description: The sink as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/sinks/{sink}/test:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
    post:
      operationId: testSink
      summary: Test a saved sink
      description: |
        Calls the target of the stored sink, or, when the body carries a
        sub-object of the sink's kind, of the sink with that configuration, in
        which `***` or no secret takes the stored one: a change is checked
        against the credentials already held. Answers whether it works, why
        not by class, status and code, and what is wrong that does not stop
        delivery. Testing the stored configuration also creates a ClickHouse
        sink's tables when it has `create_tables`, and stores what it found as
        the sink's `warnings`. Audited as `sink.tested`. The target's own words
        are never answered.
      x-permission: sink.manage
      tags: [sinks]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinkTest"
      responses:
        "200":
          description: What the test found; a target that fails is a 200 with `ok` false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/sinks/{sink}/sample:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
    post:
      operationId: sampleSink
      summary: Send sample rows to a sink
      description: |
        Sends ten sample rows of each requested event kind (`event_kinds`,
        every kind the sink exports when absent or empty) to the sink's
        target, so that the receiving side can be built before real events
        flow. The rows are marked as samples: their identifiers are `sample-1`
        to `sample-10`, their keys and unit are `sample` but for the
        project's own key, and a webhook sink's envelope carries
        `"sample": true`. A disabled or stopped sink can be sampled. It
        touches no stream, cursor, count or health. Each kind is answered on
        its own, a target that fails as a 200 with `ok` false and why by class,
        status and code, never by the target's own words. Audited as
        `sink.sampled`. It takes no `If-Match`.
      x-permission: sink.manage
      tags: [sinks]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinkSample"
      responses:
        "200":
          description: What each event kind's sample found, in the order the kinds are listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkSampleResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/sinks/{sink}/replay:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
    post:
      operationId: replaySink
      summary: Replay a sink from a time
      description: |
        Sends the events received since `from` again, in order, to the
        requested event kinds' streams (every kind the sink exports when
        `event_kinds` is absent or empty), then the live stream goes on. Each
        stream goes back to just before the first event received at or after
        `from` in the sink's environments. With `to` it stops after the last
        event received at or before it and returns to where it was, so that
        nothing past `to` is sent twice. A stream with no event in the range is
        left as it is. `from` must be within retention (`out_of_retention`) and
        `to` must not be before `from` (`invalid_replay_range`). A replay is
        applied by the delivery worker before the stream's next batch, which a
        disabled or stopped sink starts once it runs again; the batch in flight
        is dropped. A replay sent while another bounded one runs still returns
        to the position that one would have. Audited as `sink.replayed`. It
        takes no `If-Match`.
      x-permission: sink.manage
      tags: [sinks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinkReplay"
      responses:
        "200":
          description: The sink as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/sinks/{sink}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
    post:
      operationId: rotateSinkSecret
      summary: Rotate a webhook sink's secret
      description: |
        Issues a webhook sink a new secret, answered this once. The secret it
        replaces keeps signing beside the new one for the operator's
        `FLAGNETIC_WEBHOOK_SECRET_OVERLAP` (24 hours unless set) from now, so
        each call carries two `v1=` signatures meanwhile and a receiver
        holding either verifies. A secret an earlier rotation left signing is
        dropped at once: no more than two sign. A sink of another kind has no
        secret the server draws and is refused `no_secret_to_rotate`; its
        password or secret access key is changed by editing it. It takes no
        `If-Match`.
      x-permission: sink.manage
      tags: [sinks]
      responses:
        "200":
          description: The sink with its new secret.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkWithSecret"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/sinks/{sink}/resume:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
    post:
      operationId: resumeSink
      summary: Resume a stopped sink
      description: |
        A sink stops itself when `FLAGNETIC_SINK_STOP_AFTER_DEAD_LETTERS`
        batches in a row of one stream were set aside as dead letters. This
        starts it again where it was: every stream keeps its place and its
        batch in flight, the count of consecutive dead letters is cleared and
        each stream is due now. Dead letters stay and are not redelivered; the
        sink is `degraded` while any waits. Editing a sink never resumes it. A
        sink that is not stopped is answered as it is, with nothing changed or
        recorded. Audited as `sink.resumed`. It takes no `If-Match`.
      x-permission: sink.manage
      tags: [sinks]
      responses:
        "200":
          description: The sink as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/sinks/{sink}/dead-letters:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
    get:
      operationId: listSinkDeadLetters
      summary: A sink's dead letters
      description: |
        The batches the target rejected `FLAGNETIC_SINK_REJECTION_ATTEMPTS`
        times and the sink set aside to deliver the next, oldest first, in
        every status; a discarded one is gone. Not paginated.
      x-permission: sink.manage
      tags: [sinks]
      responses:
        "200":
          description: The sink's dead letters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkDeadLetterList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/sinks/{sink}/dead-letters/{deadLetter}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
      - $ref: "#/components/parameters/DeadLetterID"
    delete:
      operationId: discardSinkDeadLetter
      summary: Discard a dead letter
      description: |
        The dead letter goes, whatever its status, and stops counting towards
        the sink being `degraded`. Its rows are not delivered. Audited as
        `sink.dead_letter_discarded`.
      x-permission: sink.manage
      tags: [sinks]
      responses:
        "204":
          description: Discarded.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/sinks/{sink}/dead-letters/{deadLetter}/redeliver:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
      - $ref: "#/components/parameters/DeadLetterID"
    post:
      operationId: redeliverSinkDeadLetter
      summary: Redeliver a dead letter
      description: |
        Reads the rows of the dead letter that are still stored and sends them
        to the target now, inside this request, under a delivery ID of its
        own: the dead letter's and its attempt's, so a repeat is another
        delivery. The sink's streams, cursors and health are not touched. When
        the target acknowledges, the dead letter is `redelivered`; when it
        does not, this still answers 200 with the dead letter, still
        `pending`, its `attempts` and `last_failure` updated. It may be
        repeated. Refused `rows_expired` when retention dropped every row of
        it. Audited as `sink.dead_letter_redelivered`; the target's own words
        are never answered.
      x-permission: sink.manage
      tags: [sinks]
      responses:
        "200":
          description: The dead letter after the attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkDeadLetter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /projects/{project}/sinks/{sink}/gaps:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
    get:
      operationId: listSinkGaps
      summary: A sink's gaps
      description: |
        The rows retention dropped before the sink delivered them, one gap per
        drop and event kind, oldest first, dismissed ones included. The sink
        went on after each, with the rows still stored. Not paginated.
      x-permission: sink.manage
      tags: [sinks]
      responses:
        "200":
          description: The sink's gaps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkGapList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project}/sinks/{sink}/gaps/{gap}/dismiss:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/SinkID"
      - $ref: "#/components/parameters/GapID"
    post:
      operationId: dismissSinkGap
      summary: Dismiss a gap
      description: |
        Marks the gap as seen, so that it stops counting towards the sink's
        `gaps` and the project banner; it stays listed. Idempotent: dismissing
        a dismissed gap answers it as it is, keeping the first time. Audited
        as `sink.gap_dismissed` the first time only.
      x-permission: sink.manage
      tags: [sinks]
      responses:
        "200":
          description: The gap, dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinkGap"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /webhooks:
    get:
      operationId: listInstanceWebhooks
      summary: The instance's webhook subscriptions
      description: |
        The oldest first. An instance subscription is sent `audit.entry` for
        every audit entry that names no project: instance settings, members,
        sign-ins, project deletions. A secret is never listed; it is shown
        once, when it is issued.
      x-permission: instance_admin
      tags: [webhooks]
      responses:
        "200":
          description: The instance's webhook subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createInstanceWebhook
      summary: Subscribe to the instance's audit entries
      description: |
        Creates an instance subscription and answers it with its `secret`,
        shown this once, as a project's subscription is created. Its
        `events` are exactly `audit.entry`: any other type, `*` included,
        is `unknown_event_type`, and an instance has no environments to
        filter on, so `environments` must be empty or absent
        (`invalid_webhook`). The target is checked as a project
        subscription's is.
      x-permission: instance_admin
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreate"
      responses:
        "201":
          description: The new subscription with its secret, shown this once.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /webhooks/{webhook}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      operationId: getInstanceWebhook
      summary: An instance subscription
      x-permission: instance_admin
      tags: [webhooks]
      responses:
        "200":
          description: The subscription; its `ETag` is its version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateInstanceWebhook
      summary: Edit an instance subscription
      description: |
        As a project subscription is edited, with the refusals of the
        instance subscription's creation.
      x-permission: instance_admin
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPatch"
      responses:
        "200":
          description: The subscription as it is now.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionMismatch"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteInstanceWebhook
      summary: Delete an instance subscription
      description: As a project subscription is deleted, without `If-Match`.
      x-permission: instance_admin
      tags: [webhooks]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /webhooks/{webhook}/test:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: testInstanceWebhook
      summary: Send an instance subscription a test ping
      description: |
        As a project subscription's ping, naming no project. A disabled
        subscription is refused `409 webhook_disabled`.
      x-permission: instance_admin
      tags: [webhooks]
      responses:
        "202":
          description: The ping's delivery, pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /webhooks/{webhook}/enable:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: enableInstanceWebhook
      summary: Enable an instance subscription
      description: As a project subscription is enabled, without `If-Match`.
      x-permission: instance_admin
      tags: [webhooks]
      responses:
        "200":
          description: The subscription, enabled.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /webhooks/{webhook}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: rotateInstanceWebhookSecret
      summary: Rotate an instance subscription's secret
      description: |
        As a project subscription's secret is rotated: the new secret is
        answered this once, and the one it replaces signs beside it until
        `previous_secret_expires_at`.
      x-permission: instance_admin
      tags: [webhooks]
      responses:
        "200":
          description: The subscription with its new secret.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /webhooks/{webhook}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      operationId: listInstanceWebhookDeliveries
      summary: An instance subscription's delivery log
      description: As a project subscription's delivery log is read.
      x-permission: instance_admin
      tags: [webhooks]
      parameters:
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
      - name: event_type
        in: query
        description: An event type, such as `audit.entry`.
        schema:
          type: string
      - name: from
        in: query
        description: The earliest time a delivery was made, included.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: The latest time a delivery was made, included.
        schema:
          type: string
          format: date-time
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of deliveries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /webhooks/{webhook}/deliveries/{delivery}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
      - name: delivery
        in: path
        required: true
        description: The delivery's identifier.
        schema:
          type: string
          format: uuid
    get:
      operationId: getInstanceWebhookDelivery
      summary: One delivery of an instance subscription
      x-permission: instance_admin
      tags: [webhooks]
      responses:
        "200":
          description: The delivery with every attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /webhooks/{webhook}/deliveries/{delivery}/redeliver:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
      - name: delivery
        in: path
        required: true
        description: The delivery whose event to send again.
        schema:
          type: string
          format: uuid
    post:
      operationId: redeliverInstanceWebhookDelivery
      summary: Send an instance delivery's event again
      description: |
        As a project subscription's delivery is redelivered: the same event
        `id` and body under a new delivery, pending. A disabled subscription
        is refused `409 webhook_disabled`.
      x-permission: instance_admin
      tags: [webhooks]
      responses:
        "202":
          description: The new delivery, pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    AuditActor:
      name: actor
      in: query
      description: A member's identifier; their own changes and those of their personal access tokens.
      schema:
        type: string
        format: uuid
    AuditActorKind:
      name: actor_kind
      in: query
      schema:
        $ref: "#/components/schemas/ActorKind"
    AuditAction:
      name: action
      in: query
      description: An action, such as `environment.updated`.
      schema:
        type: string
    AuditEntityKind:
      name: entity_kind
      in: query
      description: A kind of entity, such as `environment`.
      schema:
        type: string
    AuditEntityID:
      name: entity_id
      in: query
      description: An entity's identifier, which follows the entity whatever key it had.
      schema:
        type: string
    AuditEnvironment:
      name: environment
      in: query
      description: An environment's identifier; entries addressing no environment are left out.
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      description: The earliest time of an entry, included.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: The latest time of an entry, included.
      schema:
        type: string
        format: date-time
    AuditKillSwitch:
      name: kill_switch
      in: query
      description: Lists only the entries of kill switches when true, only the others when false.
      schema:
        type: boolean
    AuditChangeRequest:
      name: change_request
      in: query
      description: A change request's identifier; lists the entries its application wrote.
      schema:
        type: string
        format: uuid
    ImportIfMatch:
      name: If-Match
      in: header
      description: |
        The state of the project this import is based on, as the `ETag` of a
        dry run or an export answered it. Optional: without it the import
        applies to the project as it is. With it, an import is refused
        `412 version_mismatch` when the project has changed since, judged
        under the project's lock before anything is written.
      schema:
        type: string
    ImportDryRun:
      name: dry_run
      in: query
      description: Run the whole import and roll it back, answering what it would have done.
      schema:
        type: boolean
        default: false
    DocumentFormat:
      name: format
      in: query
      description: The document's encoding, JSON unless `yaml` is asked for.
      schema:
        type: string
        enum: [json, yaml]
        default: json
    AuditExportFormat:
      name: format
      in: query
      description: The download's format, JSON Lines unless `csv` is asked for.
      schema:
        type: string
        enum: [jsonl, csv]
        default: jsonl
    AuditQ:
      name: q
      in: query
      description: Text found, whatever its case, in the action, the entity's key or the actor's name. `%` and `_` match themselves.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: How many entries a page holds at most.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    FlagKey:
      name: flag
      in: path
      required: true
      description: The flag's key.
      schema:
        type: string
    ChangeRequestID:
      name: change_request
      in: path
      required: true
      description: The change request's identifier.
      schema:
        type: string
        format: uuid
    AuthProviderSlug:
      name: provider
      in: path
      required: true
      description: The auth provider's slug.
      schema:
        type: string
    WebhookID:
      name: webhook
      in: path
      required: true
      description: The webhook subscription's identifier.
      schema:
        type: string
        format: uuid
    SinkID:
      name: sink
      in: path
      required: true
      description: The sink's identifier.
      schema:
        type: string
        format: uuid
    DeadLetterID:
      name: deadLetter
      in: path
      required: true
      description: The dead letter's identifier.
      schema:
        type: string
        format: uuid
    GapID:
      name: gap
      in: path
      required: true
      description: The gap's identifier.
      schema:
        type: string
        format: uuid
    ExperimentKey:
      name: experiment
      in: path
      required: true
      description: The experiment's key.
      schema:
        type: string
    SegmentKey:
      name: segment
      in: path
      required: true
      description: The segment's key.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: |
        The version of the entity this write is based on, as its `ETag`
        answered it (`"7"`, or `7`). Required: without it the write is
        refused `428 precondition_required`, and with any other version than
        the current one `412 version_mismatch`, both judged after the request
        is validated.
      schema:
        type: string
    ExposureEnvironment:
      name: environment
      in: query
      required: true
      description: The key of the environment whose exposures to read.
      schema:
        type: string
    EnvironmentKey:
      name: environment
      in: path
      required: true
      description: The environment's key.
      schema:
        type: string
    UnitTypeKey:
      name: unit_type
      in: path
      required: true
      description: The unit type's key.
      schema:
        type: string
    AttributeKey:
      name: attribute
      in: path
      required: true
      description: The attribute's key.
      schema:
        type: string
    SessionID:
      name: session
      in: path
      required: true
      description: The session's identifier, in either case.
      schema:
        type: string
    IdentityID:
      name: identity
      in: path
      required: true
      description: The identity's identifier.
      schema:
        type: string
    MemberID:
      name: member
      in: path
      required: true
      description: The member's identifier.
      schema:
        type: string
    GrantID:
      name: grant
      in: path
      required: true
      description: The grant's identifier.
      schema:
        type: string
    TokenID:
      name: token
      in: path
      required: true
      description: The API token's identifier.
      schema:
        type: string
    SdkKeyID:
      name: sdk_key
      in: path
      required: true
      description: The SDK key's identifier.
      schema:
        type: string
    ProjectKey:
      name: project
      in: path
      required: true
      description: The project's key.
      schema:
        type: string
  headers:
    ETag:
      description: The entity's version as a strong entity tag, such as `"7"`, to send back in `If-Match`.
      schema:
        type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token, `fn_pat_…` for a personal access token or `fn_prj_…` for a project token, in the `Authorization` header. A token in the query string is never read.
    session:
      type: apiKey
      in: cookie
      name: flagnetic_session
      description: The session cookie `POST /auth/sign-in` sets, for the console. Ignored when an `Authorization` header is present.
  responses:
    BadRequest:
      description: "`invalid_request`: a parameter that is malformed or out of its range, such as a cursor this API did not return."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`not_found`: no such project, or nothing under that identifier in it. An unknown project is answered before any permission is judged."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "The change conflicts with what exists, such as `already_exists` for a key already in use."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: "`provider_unreachable` or `smtp_failed`: a system the server asked, such as an identity provider or the SMTP server, did not answer as needed; `failure` says why."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Invalid:
      description: The request is well formed but breaks a rule; `errors` names each field to fix.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: |
        No credential, or one that is not accepted: `unauthenticated` without
        a credential (a session cookie the server did not issue counts as
        none); `invalid_token`, `token_revoked` or `token_expired` for an API
        token, with a `WWW-Authenticate` header naming the code;
        `session_expired` for a session that has ended, whose cookie is
        cleared; `invalid_credentials` for a sign-in.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestTooLarge:
      description: "`request_too_large`: the body is larger than the operation accepts; one that checks a password accepts 8 KiB."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: "`unsupported_media_type`: the body is not sent as `application/json`, which the operations opening a session require so a form on another site cannot call them."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyAttempts:
      description: |
        Refused before the password is checked: `locked` while the email is
        locked by consecutive failures (from an address its member signed in
        from within thirty days, by that address's own consecutive failures
        on it), `rate_limited` while the address is
        throttled. `retry_after` and the `Retry-After` header give the
        seconds until the attempt can be made again.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvitationGone:
      description: "`invitation_gone`: the link opens no invitation that can be accepted: it was never issued, has been used or replaced, or has expired."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PasswordResetGone:
      description: "`reset_gone`: the link opens no password reset that can be completed: it was never issued, has been used or ended by another, has expired, or its member is not active."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Busy:
      description: |
        `busy`: the replica is checking as many passwords as it may at once
        and no turn freed within two seconds. The attempt was not counted as
        a failure; retry after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    VersionMismatch:
      description: "`version_mismatch`: the entity changed since the version `If-Match` names; `current_version` is the version it has now."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: "`precondition_required`: the write names no version in `If-Match`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PasswordRefused:
      description: |
        A password is no way in for this email: its domain is enforced to an
        auth provider (`sso_required`, with the `provider` to sign in
        through), or local login is disabled (`local_login_disabled`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The caller may not perform the operation: `forbidden` (with the
        missing `permission`), `session_required`, `insufficient_scope`,
        `cross_origin` for a request signed in by the session cookie, a read
        included, that the browser says comes from another origin, or, for a
        write, `change_request_required` when it would change what a
        protected environment's SDKs receive; `detail` names those
        environments.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: A problem document (RFC 9457). Code-specific values are further members.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable snake_case name of the problem, which clients branch on.
        detail:
          type: string
          description: An English explanation for humans; never what a client branches on.
        request_id:
          type: string
        retry_after:
          type: integer
          description: Seconds to wait before retrying, for a rate limit.
        permission:
          type: string
          description: The permission the caller lacks, for `forbidden`, or the role's permission the caller lacks, for `role_not_allowed`.
        current_version:
          type: integer
          format: int64
          description: The version the entity has now, for `version_mismatch`.
        references:
          type: array
          description: What still names what the write would remove or hide, for `in_use`.
          items:
            $ref: "#/components/schemas/Reference"
        provider:
          type: string
          description: The slug of the auth provider to sign in through instead, for `sso_required`.
        used_by:
          type: array
          description: What keeps an auth provider from being deleted, disabled or edited, for `provider_in_use`, such as `identities`, `enforced domains` or `only way in` (the only enabled provider while local login is disabled).
          items:
            type: string
        failure:
          type: string
          description: Why a system the server asked did not answer as needed, for `provider_unreachable`; for `smtp_failed` the step that failed, `connection`, `tls`, `authentication` or `rejected`; for `sink_not_ready` the failure class of the target's check, such as `connect` or `status`.
        failure_status:
          type: integer
          description: The HTTP status the target answered, for `sink_not_ready`, when it answered.
        failure_code:
          type: string
          description: The target's own error code, for `sink_not_ready`, when it speaks one, such as a ClickHouse exception or an S3 error code.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
    Violation:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: JSON Pointer into the request body.
        code:
          type: string
        detail:
          type: string
        params:
          type: object
          additionalProperties: true
          description: The values of the rule broken, such as the bounds of a length, for a client to explain the violation in its own language.
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    AuthProviderKind:
      type: string
      description: The protocol the provider speaks.
      enum: [oidc, saml]
    AuthProviderClaims:
      type: object
      description: |
        The claims of an OIDC provider's tokens, or the attributes of a SAML provider's assertions, that carry what
        the instance reads of a person. A SAML provider reads the email from the NameID when its format is
        `emailAddress`, else from the attribute named here.
      required: [email, name, groups]
      properties:
        email:
          type: string
          description: Default `email`.
        name:
          type: string
          description: Default `name`.
        groups:
          type: string
          description: Default `groups`.
    AuthProviderClaimsPatch:
      type: object
      description: The claims to rename; each absent one is left as it is.
      properties:
        email:
          type: string
        name:
          type: string
        groups:
          type: string
    SAMLNameIDFormat:
      type: string
      description: The format of the subject identifier requested of a SAML identity provider.
      enum: [unspecified, emailAddress, persistent, transient]
    IdPCertificate:
      type: object
      description: A certificate a SAML identity provider's signatures are checked against.
      required: [sha256, not_after]
      properties:
        sha256:
          type: string
          description: The lowercase hex SHA-256 of the certificate.
        not_after:
          type: string
          format: date-time
    SPCertificate:
      type: object
      description: A certificate the instance presents to a SAML identity provider.
      required: [sha256, not_after, status]
      properties:
        sha256:
          type: string
          description: The lowercase hex SHA-256 of the certificate.
        not_after:
          type: string
          format: date-time
        status:
          type: string
          enum: [current, next]
          description: |
            `current` signs the authentication requests; `next` is the certificate a pending
            rotation will make current.
    AuthProvider:
      type: object
      required: [id, slug, kind, display_name, enabled, domains, link_by_email, auto_provision, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,63}$"
          description: Names the provider in sign-in buttons and URLs; never changes.
        kind:
          $ref: "#/components/schemas/AuthProviderKind"
        display_name:
          type: string
          description: What the sign-in button says, 1 to 200 characters.
        enabled:
          type: boolean
        domains:
          type: array
          description: The email domains the provider vouches for, lowercase.
          items:
            type: string
        link_by_email:
          type: boolean
          description: Whether a sign-in whose email is in `domains` is linked to the existing member with that email.
        auto_provision:
          type: boolean
          description: Whether a sign-in whose email is in `domains` creates its member.
        issuer:
          type: string
          description: The OIDC provider's issuer URL.
        client_id:
          type: string
        client_secret_set:
          type: boolean
          description: Whether a client secret is stored; the secret itself is never answered.
        scopes:
          type: array
          items:
            type: string
        claims:
          $ref: "#/components/schemas/AuthProviderClaims"
        require_verified_email:
          type: boolean
          description: Whether a sign-in whose token does not say the email is verified is refused.
        redirect_uri:
          type: string
          description: |
            OIDC only: the redirect URI to register at the identity provider, built from
            `FLAGNETIC_BASE_URL`; absent while the instance has none.
        idp_metadata_url:
          type: string
          description: |
            SAML only: where the identity provider's metadata is fetched from, and read again daily; absent
            when the metadata was pasted, which is never refreshed.
        idp_entity_id:
          type: string
          description: SAML only, read from the identity provider's metadata.
        idp_sso_url:
          type: string
          description: "SAML only: the identity provider's HTTP-Redirect single sign-on address, read from its metadata."
        idp_certificates:
          type: array
          description: "SAML only: the certificates the identity provider signs with, read from its metadata."
          items:
            $ref: "#/components/schemas/IdPCertificate"
        idp_metadata_refreshed_at:
          type: string
          format: date-time
          description: "SAML only: when the identity provider's metadata was last read, at creation, on an edit of its source or by the daily refresh."
        sign_requests:
          type: boolean
          description: "SAML only: whether the authentication requests are signed."
        name_id_format:
          $ref: "#/components/schemas/SAMLNameIDFormat"
        acs_url:
          type: string
          description: |
            SAML only: the address the identity provider posts its responses to, built from
            `FLAGNETIC_BASE_URL`; absent while the instance has none.
        entity_id:
          type: string
          description: |
            SAML only: the instance's entity ID for the provider, which is its metadata address; absent while
            the instance has no `FLAGNETIC_BASE_URL`.
        metadata_url:
          type: string
          description: "SAML only: where the instance serves its metadata, to import into the identity provider."
        sp_certificates:
          type: array
          description: |
            SAML only: the certificates the instance presents, the current one and, while a rotation is
            pending, the next. The metadata at `metadata_url` lists them all.
          items:
            $ref: "#/components/schemas/SPCertificate"
        rotation_pending:
          type: boolean
          description: "SAML only: whether a certificate rotation was started and not completed."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    GroupMapping:
      type: object
      description: |
        What members of a directory group are granted: a role in a project, or
        instance admin.
      required: [group]
      properties:
        group:
          type: string
          description: The directory group, matched exactly as the provider claims it. Not blank.
        project:
          type: string
          description: The key of the project the role is granted in. Sent with `role`, never with `instance_admin`.
        role:
          type: string
          description: One of the built-in roles `owner`, `maintainer`, `developer` and `viewer`.
        instance_admin:
          type: boolean
          description: Makes the members of the group instance admins. Sent alone, and only as `true`.
    GroupMappings:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupMapping"
    GroupMappingsRun:
      type: object
      description: What running the mappings for every member the provider knows did.
      required: [granted, revoked, kept_instance_admin]
      properties:
        granted:
          type: integer
          description: The grants made, and the members made instance admin.
        revoked:
          type: integer
          description: The grants removed, and the members who are no longer instance admin.
        kept_instance_admin:
          type: integer
          description: The members who stay instance admin although the mappings no longer make them one, because they are the last active instance admin.
    AuthProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthProvider"
    AuthProviderCreate:
      type: object
      description: |
        A provider of kind `oidc` is created from `issuer`, `client_id`, `client_secret` and its optional OIDC
        fields; one of kind `saml` from `idp_metadata_url` or `idp_metadata_xml` and its optional SAML fields. A
        field of the other kind is refused 422.
      required: [slug, kind, display_name, domains]
      properties:
        slug:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,63}$"
        kind:
          $ref: "#/components/schemas/AuthProviderKind"
        display_name:
          type: string
        enabled:
          type: boolean
          description: Default true.
        domains:
          type: array
          items:
            type: string
        link_by_email:
          type: boolean
          description: Default false.
        auto_provision:
          type: boolean
          description: Default false.
        issuer:
          type: string
          description: "OIDC: `https`, or `http` on a loopback address."
        client_id:
          type: string
        client_secret:
          type: string
          format: password
          writeOnly: true
        scopes:
          type: array
          description: Default `openid`, `email` and `profile`.
          items:
            type: string
        claims:
          $ref: "#/components/schemas/AuthProviderClaimsPatch"
        require_verified_email:
          type: boolean
          description: Default true.
        idp_metadata_url:
          type: string
          description: "SAML: where the identity provider's metadata is fetched from, `https` or `http` on a loopback address, at most 1 MiB. Exactly one of this and `idp_metadata_xml`."
        idp_metadata_xml:
          type: string
          writeOnly: true
          description: "SAML: the identity provider's metadata, pasted, at most 1 MiB."
        sign_requests:
          type: boolean
          description: "SAML: whether the authentication requests are signed. Default true."
        name_id_format:
          $ref: "#/components/schemas/SAMLNameIDFormat"
    AuthProviderPatch:
      type: object
      description: The properties to change; each absent one is left as it is.
      properties:
        display_name:
          type: string
        domains:
          type: array
          items:
            type: string
        link_by_email:
          type: boolean
        auto_provision:
          type: boolean
        issuer:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
          format: password
          writeOnly: true
        scopes:
          type: array
          items:
            type: string
        claims:
          $ref: "#/components/schemas/AuthProviderClaimsPatch"
        require_verified_email:
          type: boolean
        idp_metadata_url:
          type: string
          description: "SAML: fetch the identity provider's metadata from here instead; the metadata is read again."
        idp_metadata_xml:
          type: string
          writeOnly: true
          description: "SAML: use this pasted metadata instead; it is read again."
        sign_requests:
          type: boolean
        name_id_format:
          $ref: "#/components/schemas/SAMLNameIDFormat"
    AuthProviderTest:
      type: object
      description: |
        What the provider answers: the discovery document of an OIDC provider, the metadata of a SAML
        provider.
      properties:
        idp_entity_id:
          type: string
          description: SAML only.
        idp_sso_url:
          type: string
          description: SAML only.
        idp_certificates:
          type: array
          description: SAML only.
          items:
            $ref: "#/components/schemas/IdPCertificate"
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string
        userinfo_endpoint:
          type: string
          description: Absent when the provider offers none.
        scopes_supported:
          type: array
          description: Absent when the document does not list them.
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          description: Absent when the document does not list them; sign-in needs `S256`.
          items:
            type: string
    AuthMethods:
      type: object
      required: [local_login_enabled, password_reset_available, providers]
      properties:
        local_login_enabled:
          type: boolean
          description: Whether a member signs in with their email and password.
        password_reset_available:
          type: boolean
          description: "Whether a member can ask for a password reset by mail (`POST /auth/password-reset`): the instance has an SMTP server, self-service password reset is on, local login is enabled and, given an `email`, its domain is not enforced. The sign-in page offers the forgotten-password link only then."
        providers:
          type: array
          description: The enabled auth providers a member signs in through, ordered by display name.
          items:
            $ref: "#/components/schemas/AuthMethodProvider"
        enforced_provider:
          $ref: "#/components/schemas/AuthMethodProvider"
    AuthMethodProvider:
      type: object
      description: An auth provider as the sign-in page offers it. As `enforced_provider`, the provider the given email's domain is enforced to, the only way it signs in; absent when the domain is not enforced or no email was given.
      required: [slug, display_name, kind]
      properties:
        slug:
          type: string
        display_name:
          type: string
        kind:
          $ref: "#/components/schemas/AuthProviderKind"
    MemberStatus:
      type: string
      enum: [invited, active, deactivated]
    Me:
      type: object
      required: [credential, client_ip, max_token_lifetime_seconds, require_token_expiry]
      properties:
        member:
          $ref: "#/components/schemas/MeMember"
        credential:
          $ref: "#/components/schemas/Credential"
        client_ip:
          type: string
          description: The address the request came from, as the server sees it behind its trusted proxies.
        max_token_lifetime_seconds:
          type: integer
          format: int64
          nullable: true
          description: The furthest ahead, in seconds, the instance lets an API token expire; null for no bound. Answered to every caller, so a client can offer only the expiries the instance accepts.
        require_token_expiry:
          type: boolean
          description: Whether the instance refuses an API token that never expires.
    Member:
      type: object
      description: A member as an instance admin sees them.
      required: [id, email, display_name, status, instance_admin, provider, created_at, last_sign_in_at, project_count]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/MemberStatus"
        instance_admin:
          type: boolean
        provider:
          type: string
          nullable: true
          description: |
            The slug of the auth provider whose SCIM token created or adopted
            the member, null for any other. A provisioned member's email,
            name and status follow that provider; changing them here is
            refused 409 `member_provisioned`.
        created_at:
          type: string
          format: date-time
        last_sign_in_at:
          type: string
          format: date-time
          nullable: true
          description: When the member last signed in; null until they do.
        project_count:
          type: integer
          description: How many projects the member holds a grant in; none while they are invited.
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    MemberPatch:
      type: object
      properties:
        email:
          type: string
          description: One address of the form name@domain, at most 254 characters.
        display_name:
          type: string
          description: Not blank, at most 200 characters.
        instance_admin:
          type: boolean
    MePatch:
      type: object
      properties:
        display_name:
          type: string
          description: Not blank, at most 200 characters.
        locale:
          type: string
          nullable: true
          description: The console language, `en` or `ru`; null follows the browser. Absent leaves it as it is.
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          description: 12 to 128 characters, or the instance's minimum length; not containing the part of the email before the @, nor a common password.
    MemberInvite:
      type: object
      required: [email, display_name]
      properties:
        email:
          type: string
          description: One address of the form name@domain, at most 254 characters.
        display_name:
          type: string
          description: Not blank, at most 200 characters.
        grant:
          $ref: "#/components/schemas/InvitationGrantCreate"
    InvitationGrantCreate:
      type: object
      description: |
        The role in a project the invitation grants once accepted. An
        unknown project or a role that is none of the built-in ones is
        refused `invalid_grant`.
      required: [project, role]
      properties:
        project:
          type: string
          description: The project's key.
        role:
          type: string
          description: One of the built-in roles `owner`, `maintainer`, `developer` and `viewer`.
    ProjectInvitationCreate:
      type: object
      required: [email, display_name, role]
      properties:
        email:
          type: string
          description: One address of the form name@domain, at most 254 characters.
        display_name:
          type: string
          description: Not blank, at most 200 characters.
        role:
          type: string
          description: One of the built-in roles `owner`, `maintainer`, `developer` and `viewer`, each a role the caller holds every permission of in the project.
    ProjectInvitation:
      type: object
      description: A member invited with a role in a project, which accepting their invitation grants them.
      required: [member, email, display_name, role, invited_by, expires_at]
      properties:
        member:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/RoleName"
        invited_by:
          type: string
          format: uuid
          nullable: true
          description: The member who issued the invitation; null when none did.
        expires_at:
          type: string
          format: date-time
          description: When the invitation's link stops working; a member whose link expired is invited again for a fresh one.
    ProjectInvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectInvitation"
    IssuedInvitation:
      type: object
      description: >-
        An invitation just issued. With SMTP configured and `FLAGNETIC_BASE_URL` set it is mailed to the invited
        person and its link is never shown; otherwise its link is shown this once, for the issuer to pass on.
      required: [mailed, expires_at]
      properties:
        mailed:
          type: boolean
          description: >-
            Whether the link is being mailed to the invited person, which it is whenever the instance has an SMTP
            server and `FLAGNETIC_BASE_URL` is set. A mail that does not arrive is replaced by reissuing the
            invitation.
        url:
          type: string
          description: The one-time link to pass on to the invited person; absent when the link is mailed.
        expires_at:
          type: string
          format: date-time
    MemberInvitation:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"
        invitation:
          $ref: "#/components/schemas/IssuedInvitation"
    Invitation:
      type: object
      description: What an invitation's link opens.
      required: [email, display_name, expires_at, password_allowed, providers]
      properties:
        email:
          type: string
          description: The invited member's email with all but the first character of its local part hidden, such as `g***@example.com`.
        display_name:
          type: string
        expires_at:
          type: string
          format: date-time
        project:
          $ref: "#/components/schemas/InvitationProject"
        role:
          type: string
          description: The built-in role accepting grants in `project`; absent with it.
        invited_by:
          type: string
          description: The display name of the member who issued the invitation; absent when none did.
        password_allowed:
          type: boolean
          description: Whether the invitation can be accepted with a password; false while local login is disabled or when the invited email's domain is enforced to an auth provider.
        enforced_provider:
          $ref: "#/components/schemas/AuthMethodProvider"
        providers:
          type: array
          description: The enabled auth providers signing in through which accepts the invitation, ordered by display name; those whose domains hold the invited email, only `enforced_provider` when the email's domain is enforced to it, and none when no provider vouches for the email.
          items:
            $ref: "#/components/schemas/AuthMethodProvider"
    InvitationProject:
      type: object
      description: The project an invitation grants a role in. Absent once the invitation's grant was dropped.
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
    InvitationAcceptance:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    PasswordStatus:
      type: object
      description: Whether a member holds a password.
      required: [set]
      properties:
        set:
          type: boolean
        set_at:
          type: string
          format: date-time
          description: When the password was last set; absent when none is.
    LinkedIdentity:
      type: object
      description: The subject an auth provider knows a member by.
      required: [id, provider, provider_name, kind, provider_enabled, subject, linked_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          description: The slug of the auth provider.
        provider_name:
          type: string
          description: The auth provider's display name.
        kind:
          $ref: "#/components/schemas/AuthProviderKind"
        provider_enabled:
          type: boolean
          description: Whether the auth provider is enabled; an identity at a disabled one is no way in.
        subject:
          type: string
          description: The provider's identifier of the person.
        linked_at:
          type: string
          format: date-time
        last_sign_in_at:
          type: string
          format: date-time
          description: When the member last signed in through the identity; absent until they do.
    MemberAuthMethods:
      type: object
      description: The ways a member holds to sign in.
      required: [password, identities]
      properties:
        password:
          $ref: "#/components/schemas/PasswordStatus"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/LinkedIdentity"
    IdentityLinkStart:
      type: object
      properties:
        return_to:
          type: string
          description: A path of this instance to return the browser to once linked; `/settings` when absent or not a path of this instance.
    IdentityLinkStarted:
      type: object
      required: [start_url]
      properties:
        start_url:
          type: string
          description: Where to send the browser to authenticate at the auth provider.
    IssuedPasswordReset:
      type: object
      description: A password reset just issued. Its link is shown this once.
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: The one-time link to pass on to the member.
        expires_at:
          type: string
          format: date-time
    PasswordReset:
      type: object
      description: What a password reset's link opens.
      required: [email, display_name, expires_at]
      properties:
        email:
          type: string
          description: The member's email with all but the first character of its local part hidden, such as `g***@example.com`.
        display_name:
          type: string
        expires_at:
          type: string
          format: date-time
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The email the member signs in with, whatever its case.
    PasswordResetCompletion:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    MeMember:
      type: object
      description: The member the credential acts for; absent for a project token, which acts for none.
      required: [id, email, display_name, status, instance_admin, locale]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/MemberStatus"
        instance_admin:
          type: boolean
        locale:
          type: string
          nullable: true
          description: The console language the member chose; null follows the browser.
    Credential:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [token, session]
        token_id:
          type: string
          format: uuid
          description: The API token in use, for the token method.
        token_name:
          type: string
        project:
          type: string
          description: The key of the project a project token belongs to; absent for any other credential.
        role:
          $ref: "#/components/schemas/RoleName"
    Key:
      type: string
      pattern: "^[a-z][a-z0-9_-]{0,63}$"
      description: Names the entity in URLs, SDK calls and rules, and never changes.
    Name:
      type: string
      minLength: 1
      maxLength: 200
    Description:
      type: string
      maxLength: 2000
    Project:
      type: object
      required: [id, key, name, description, member_count, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        member_count:
          type: integer
          description: How many active members hold a grant in the project.
        version:
          $ref: "#/components/schemas/Version"
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    ProjectCreate:
      type: object
      required: [key, name]
      properties:
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    ProjectPatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `key_immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    Permission:
      type: string
      description: A permission of the catalog, named entity.verb, such as `environment.manage`.
    RoleName:
      type: string
      enum: [owner, maintainer, developer, viewer]
    Role:
      type: object
      required: [name, permissions]
      properties:
        name:
          $ref: "#/components/schemas/RoleName"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    SessionMethod:
      type: string
      enum: [local, oidc, saml]
      description: >-
        How the member signed in; `local` is with their email and password, `oidc` through an OIDC auth provider and
        `saml` through a SAML one, named by `provider`.
    Session:
      type: object
      description: One device a member is signed in on.
      required: [id, method, client_ip, user_agent, created_at, last_seen_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        method:
          $ref: "#/components/schemas/SessionMethod"
        provider:
          type: string
          description: The slug of the auth provider the session opened through; absent for a local sign-in.
        client_ip:
          type: string
          nullable: true
          description: The address the session opened from.
        user_agent:
          type: string
          description: At most 256 bytes of the browser's User-Agent at sign-in.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: The session's last request, written at most once a minute.
        expires_at:
          type: string
          format: date-time
          description: When the absolute timeout in force ends the session, unless the idle timeout ends it first.
        current:
          type: boolean
          description: Whether this is the session the request is signed in to.
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    SessionRevocation:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          description: How many sessions were revoked.
    AuthSettings:
      type: object
      description: The instance's rules for sessions, API tokens and passwords.
      required: [session_idle_timeout_seconds, session_absolute_timeout_seconds, token_max_lifetime_seconds, token_expiry_required, password_min_length, self_service_password_reset, local_login_enabled, sso_enforced_domains]
      properties:
        session_idle_timeout_seconds:
          type: integer
          format: int64
          description: A session ends this long after its last request. 86400 (a day) on a fresh instance.
        session_absolute_timeout_seconds:
          type: integer
          format: int64
          description: A session ends this long after it opened, however much it is used. 2592000 (30 days) on a fresh instance.
        token_max_lifetime_seconds:
          type: integer
          format: int64
          description: The furthest ahead an API token may expire. 31536000 (365 days) on a fresh instance.
        token_expiry_required:
          type: boolean
          description: Whether an API token must be created with an expiry. False on a fresh instance.
        password_min_length:
          type: integer
          description: The fewest characters a password chosen from now on has, never below 12. 12 on a fresh instance.
        self_service_password_reset:
          type: boolean
          description: Whether a member can ask for a password reset by mail (`POST /auth/password-reset`). It also takes an SMTP server. True on a fresh instance. An instance admin can still issue a password reset whatever this says.
        local_login_enabled:
          type: boolean
          description: Whether members may sign in with a password at all. Off, every sign-in, invitation acceptance and password reset by password is refused `local_login_disabled`, and members sign in through auth providers. True on a fresh instance.
        sso_enforced_domains:
          type: array
          description: The email domains whose people sign in only through one auth provider, in the order given. A password is no way in for them (`sso_required`, naming the provider), nor is any other provider. Empty on a fresh instance.
          items:
            $ref: "#/components/schemas/SsoEnforcedDomain"
    SsoEnforcedDomain:
      type: object
      description: An email domain sent to one auth provider.
      required: [domain, provider]
      properties:
        domain:
          type: string
          description: The domain, such as `example.com`, stored lowercase; its subdomains are not included. It must be one of the provider's domains.
        provider:
          type: string
          description: The slug of the enabled auth provider its people sign in through.
    SmtpSecurity:
      type: string
      enum: [starttls, tls, none]
      description: "`starttls` upgrades a plain connection and requires the server to offer it, `tls` speaks TLS from the first byte, `none` secures nothing. TLS 1.2 or later, the server's certificate verified, in both secure modes."
    SmtpSettings:
      type: object
      description: The SMTP server the instance mails through. The password is never shown.
      required: [host, port, security, username, password_set, from, updated_at]
      properties:
        host:
          type: string
        port:
          type: integer
        security:
          $ref: "#/components/schemas/SmtpSecurity"
        username:
          type: string
          description: Who to authenticate as; empty for no authentication.
        password_set:
          type: boolean
          description: Whether a password is stored.
        from:
          type: string
          description: The sender of every mail, such as `Flagnetic <flags@example.com>`.
        updated_at:
          type: string
          format: date-time
    SmtpSettingsUpdate:
      type: object
      description: The SMTP server to set.
      required: [host, port, security, from]
      properties:
        host:
          type: string
          description: A host name or address, 1 to 253 characters without spaces.
        port:
          type: integer
          description: From 1 to 65535.
        security:
          $ref: "#/components/schemas/SmtpSecurity"
        username:
          type: string
          description: Who to authenticate as; empty or left out for no authentication, which drops the stored password too. At most 256 characters on one line.
        password:
          type: string
          writeOnly: true
          description: The password for the username. Left out, the stored one is kept while `host`, `port`, `security` and `username` stay as stored; a write that changes any of them must send the password again (`credentials_together` at `/password`). With a username it must not be empty.
        from:
          type: string
          description: One address, optionally with a display name.
    Scope:
      type: string
      enum: [read, "flags:write", "experiments:write", "project:admin", "instance:admin"]
      description: What an API token may touch. Each permission falls under one scope, and a token exercises it only when it carries that scope.
    ApiToken:
      type: object
      description: A personal access token, by its hint; its value is shown only when it is created.
      required: [id, name, hint, scopes, expires_at, created_at, last_used_at, last_used_ip, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          type: string
          description: The value's prefix and its first four characters, such as `fn_pat_Ab3d`.
        scopes:
          type: array
          description: The scopes the token carries, `read` first.
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; null for a token that never expires.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the token was last presented, recorded at most once a minute; null until it is used.
        last_used_ip:
          type: string
          nullable: true
          description: The address the token was last presented from.
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
    ApiTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 200 characters, not blank, to tell the token apart.
        scopes:
          type: array
          description: The scopes the token carries; `read` alone when absent, and `read` is added to any write scope.
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; absent or null for a token that never expires, unless the instance requires an expiry.
    CreatedApiToken:
      type: object
      description: A personal access token just created, with its value.
      required: [token, value]
      properties:
        token:
          $ref: "#/components/schemas/ApiToken"
        value:
          type: string
          format: password
          description: The token's value, `fn_pat_` and 40 characters, shown this once.
    ScimToken:
      type: object
      description: A SCIM token, by its hint; its value is shown only when it is created.
      required: [id, provider, hint, expires_at, created_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          description: The slug of the auth provider the token is bound to, for life.
        hint:
          type: string
          description: The value's prefix and its first four characters, such as `fn_scim_Ab3d`.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; null for a token that never expires.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the token was last presented, recorded at most once a minute; null until it is used.
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ScimGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimGroup"
    ScimGroup:
      type: object
      description: A group an auth provider's directory pushed through SCIM.
      required: [id, display_name, external_id, member_count]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: The group's name, which the provider's group mappings match exactly.
        external_id:
          type: string
          nullable: true
          description: The directory's own identifier of the group; null when it sent none.
        member_count:
          type: integer
          description: How many of the provider's provisioned members the group holds.
    ScimTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimToken"
    ScimTokenCreate:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          description: The slug of the auth provider the token is bound to. It cannot change.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; absent or null for a token that never expires.
    CreatedScimToken:
      type: object
      description: A SCIM token just created, with its value.
      required: [token, value]
      properties:
        token:
          $ref: "#/components/schemas/ScimToken"
        value:
          type: string
          format: password
          description: The token's value, `fn_scim_` and 40 characters, shown this once.
    ProjectToken:
      type: object
      description: A token belonging to a project, by its hint; its value is shown only when it is created.
      required: [id, name, hint, role, scopes, expires_at, created_at, created_by, last_used_at, last_used_ip, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          type: string
          description: The value's prefix and its first four characters, such as `fn_prj_Ab3d`.
        role:
          $ref: "#/components/schemas/RoleName"
        scopes:
          type: array
          description: The scopes the token carries, `read` first.
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; null for a token that never expires.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The member who created the token; it keeps working when they leave.
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the token was last presented, recorded at most once a minute; null until it is used.
        last_used_ip:
          type: string
          nullable: true
          description: The address the token was last presented from.
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ProjectTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectToken"
    ProjectTokenCreate:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          description: 1 to 200 characters, not blank, to tell the token apart.
        role:
          type: string
          description: One of the built-in roles `owner`, `maintainer`, `developer` and `viewer`, which the token holds in the project.
        scopes:
          type: array
          description: The scopes the token carries; `read` alone when absent, and `read` is added to any write scope. Never `instance:admin`.
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; absent or null for a token that never expires, unless the instance requires an expiry.
    CreatedProjectToken:
      type: object
      description: A project token just created, with its value.
      required: [token, value]
      properties:
        token:
          $ref: "#/components/schemas/ProjectToken"
        value:
          type: string
          format: password
          description: The token's value, `fn_prj_` and 40 characters, shown this once.
    SdkKeyKind:
      type: string
      enum: [server, client]
      description: |
        `server` downloads the environment's ruleset, private segments
        included, and belongs on a server; `client` never receives a
        ruleset, only the values remote evaluation serves it, and may be
        shipped in a browser or an app.
    SdkKeyStatus:
      type: string
      enum: [active, rotating, expired, revoked]
      description: |
        What the key is now: `revoked` once revoked, whatever its expiry;
        `expired` once the overlap of its rotation has ended; `rotating`
        within it; `active` otherwise.
    SdkInventory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SdkInventoryItem"
    SdkInventoryItem:
      type: object
      required: [sdk_name, sdk_version, platform, app_version, sdk_key, first_seen, last_seen, last_ruleset_version]
      properties:
        sdk_name:
          type: string
          description: The SDK's name, such as `flagnetic-go`, or `unknown` for a client whose `User-Agent` names no Flagnetic SDK.
        sdk_version:
          type: string
          description: Empty for `unknown`.
        platform:
          type: string
          nullable: true
        app_version:
          type: string
          nullable: true
        sdk_key:
          $ref: "#/components/schemas/SdkInventoryKey"
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        last_ruleset_version:
          type: integer
          format: int64
          nullable: true
          description: The ruleset version the SDK last fetched or was sent; null when it never was.
    SdkInventoryKey:
      type: object
      description: The SDK key the requests presented.
      required: [id, kind, name, key_id]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SdkKeyKind"
        name:
          type: string
        key_id:
          type: string
    SdkKey:
      type: object
      description: An SDK key of an environment; its value is shown only when it is created or is a rotation's replacement.
      required: [id, kind, name, key_id, status, allowed_origins, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SdkKeyKind"
        name:
          type: string
        key_id:
          type: string
          description: The first 8 characters of the value after its `fn_srv_` or `fn_cli_` prefix, to tell which key a service holds.
        status:
          $ref: "#/components/schemas/SdkKeyStatus"
        allowed_origins:
          type: array
          description: The browser origins a client key is accepted from, normalized; empty allows any origin. Always empty on a server key.
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When an SDK last presented the key, recorded at most once a minute; null until it is used.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: The end of the rotation overlap of a rotated key; null for a key never rotated.
        revoked_at:
          type: string
          format: date-time
          nullable: true
    SdkKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SdkKey"
    SdkKeyCreate:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          description: "`server` or `client` (`unknown_kind` otherwise)."
        name:
          type: string
          description: 1 to 200 characters, not blank, to tell which service holds the key.
        allowed_origins:
          type: array
          description: For a client key, the browser origins it is accepted from, at most 50; absent or empty allows any origin.
          items:
            type: string
    SdkKeyPatch:
      type: object
      required: [allowed_origins]
      properties:
        name:
          type: string
          description: The key's new name, 1 to 200 characters, not blank; the name is kept when absent.
        allowed_origins:
          type: array
          description: The key's allowed origins, replacing the ones it has; `[]` allows any origin and is the only value a server key takes.
          items:
            type: string
    SdkKeyRotation:
      type: object
      properties:
        overlap_seconds:
          type: integer
          format: int64
          description: How long the rotated key keeps working, 0 to 7776000 (90 days, `out_of_range` otherwise); 604800 (7 days) when absent. 0 ends it at once.
    CreatedSdkKey:
      type: object
      description: An SDK key just created, with its value.
      required: [key, value]
      properties:
        key:
          $ref: "#/components/schemas/SdkKey"
        value:
          type: string
          format: password
          description: The key's value, `fn_srv_` or `fn_cli_` and 40 characters, shown this once.
    Grant:
      type: object
      description: One role held by one member in one project.
      required: [id, member, role, source, provider, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        member:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/RoleName"
        source:
          type: string
          enum: [manual, sso]
          description: |
            `manual` for a grant made by hand, `sso` for one an auth provider's
            group mapping made, which is removed only by the provider and refused
            `sso_sourced` by hand. Grants of several sources sit side by side.
        provider:
          type: string
          nullable: true
          description: The slug of the auth provider whose group mapping made an `sso` grant; null otherwise.
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The member who made the grant; null for an `sso` grant.
        created_at:
          type: string
          format: date-time
    GrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
    GrantCreate:
      type: object
      required: [member, role]
      properties:
        member:
          type: string
          format: uuid
          description: The member to grant the role to.
        role:
          type: string
          description: One of the built-in roles `owner`, `maintainer`, `developer` and `viewer`.
    ProjectMember:
      type: object
      description: A member holding grants in a project, with those grants.
      required: [member, email, display_name, status, grants]
      properties:
        member:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/MemberStatus"
        grants:
          type: array
          description: The member's grants in the project, oldest first.
          items:
            $ref: "#/components/schemas/Grant"
    ProjectMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
    ProjectMe:
      type: object
      required: [grants, permissions]
      properties:
        grants:
          type: array
          description: The grants the caller's member holds in the project; none for a project token or an instance admin acting without one.
          items:
            $ref: "#/components/schemas/Grant"
        permissions:
          type: array
          description: The caller's effective permissions in the project, narrowed by the scopes of the credential in use, in catalog order.
          items:
            $ref: "#/components/schemas/Permission"
    Environment:
      type: object
      required: [id, key, name, sort_order, version, protected]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        sort_order:
          type: integer
          description: Where the environment is listed among its project's, the first created first.
        version:
          $ref: "#/components/schemas/Version"
        protected:
          type: boolean
          description: >-
            Whether a change to what the environment's SDKs receive needs an
            approved change request. Set through
            `PUT …/environments/{environment}/protection`. A new project's
            production environment starts protected.
    EnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
    EnvironmentCreate:
      type: object
      required: [key, name]
      properties:
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
    EnvironmentProtection:
      type: object
      required: [protected]
      properties:
        protected:
          type: boolean
    EnvironmentPatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `key_immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
    UnitType:
      type: object
      required: [id, key, name, description, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        version:
          $ref: "#/components/schemas/Version"
    UnitTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UnitTypeListItem"
    UnitTypeListItem:
      allOf:
        - $ref: "#/components/schemas/UnitType"
        - type: object
          required: [usage_count]
          properties:
            usage_count:
              $ref: "#/components/schemas/DeclarationUsageCount"
    DeclarationUsageCount:
      type: integer
      minimum: 0
      description: |
        How many flags (archived ones included, each counted once whatever
        its environments) and segments name it, in a rule's condition, a
        rollout, an override or a segment's condition. Deleting it is
        refused while this is above zero.
    UnitTypeCreate:
      type: object
      required: [key, name]
      properties:
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    UnitTypePatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `key_immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    AttributeType:
      type: string
      enum: [string, number, boolean, semver, date, list]
      description: The type of an attribute's values; `semver` is a semantic version, `list` a list of strings.
    Attribute:
      type: object
      required: [id, key, type, name, description, standard, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        type:
          $ref: "#/components/schemas/AttributeType"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        standard:
          type: boolean
          description: Predeclared in every project; renamable, never deleted or retyped.
        version:
          $ref: "#/components/schemas/Version"
    AttributeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttributeListItem"
    AttributeListItem:
      allOf:
        - $ref: "#/components/schemas/Attribute"
        - type: object
          required: [usage_count]
          properties:
            usage_count:
              $ref: "#/components/schemas/DeclarationUsageCount"
    DiscoveredAttribute:
      type: object
      required: [key, observed_types, first_seen, last_seen, count]
      properties:
        key:
          type: string
        observed_types:
          type: array
          description: "The JSON types seen, in the order first seen: `string`, `number`, `boolean`, `list` or `object`."
          items:
            type: string
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        count:
          type: integer
          format: int64
          description: How many evaluated contexts carried it.
    DiscoveredAttributeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredAttribute"
    DiscoveredAttributeDeclaration:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AttributeType"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    AttributeCreate:
      type: object
      required: [key, type, name]
      properties:
        key:
          $ref: "#/components/schemas/Key"
        type:
          $ref: "#/components/schemas/AttributeType"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    AttributePatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `key_immutable` whatever its value.
        type:
          type: string
          description: Refused with `type_immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
    ActorKind:
      type: string
      enum: [member, token, cli, system, sso, scim]
    AuditEntry:
      type: object
      description: Who changed what, when, from which value to which. Secrets are never recorded; a token appears by its hint.
      required: [id, occurred_at, project_id, environment_id, actor, action, entity, before, after, kill_switch,
        request_id, change_request_id]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        project_id:
          type: string
          format: uuid
          nullable: true
          description: The project the change belongs to, kept after the project is gone; null for the instance.
        environment_id:
          type: string
          format: uuid
          nullable: true
          description: The environment the change addressed, if any.
        actor:
          $ref: "#/components/schemas/Actor"
        action:
          type: string
          description: entity.verb, such as `environment.updated`.
        entity:
          $ref: "#/components/schemas/AuditEntity"
        before:
          nullable: true
          description: The entity's values before the change; null when it was created.
        after:
          nullable: true
          description: The entity's values after the change; null when it was deleted.
        kill_switch:
          type: boolean
          description: Whether the entry records a kill switch, switching a flag off in an emergency.
        request_id:
          type: string
          nullable: true
          description: The request that made the change; null outside a request, such as for the command line.
        change_request_id:
          type: string
          format: uuid
          nullable: true
          description: The change request whose application made the change; null for any other change.
    Actor:
      type: object
      required: [kind, id, name, member_id]
      properties:
        kind:
          $ref: "#/components/schemas/ActorKind"
        id:
          type: string
          description: The member's or token's identifier, or a fixed name for the command line and the system.
        name:
          type: string
          description: The actor's name when the change was made.
        member_id:
          type: string
          format: uuid
          nullable: true
          description: The member who acted, directly or through their personal access token.
    AuditEntity:
      type: object
      required: [kind, id, key]
      properties:
        kind:
          type: string
        id:
          type: string
        key:
          type: string
          description: The entity's key or name when the change was made.
    AuditEntryList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last.
    Reference:
      type: object
      required: [kind, key, environment]
      properties:
        kind:
          type: string
          description: What names it, such as `flag`, `segment` or `experiment`.
        key:
          type: string
        environment:
          type: string
          nullable: true
          description: The key of the environment it is named in; null when it is named in every environment.
    Version:
      type: integer
      format: int64
      minimum: 1
      description: Counts the entity's accepted changes, from 1; send it back in `If-Match` to change the entity.
    FlagType:
      type: string
      enum: [boolean, string, number, json]
    Lifetime:
      type: string
      enum: [permanent, temporary]
      description: A temporary flag is meant to be removed by its expected removal date; a permanent one stays.
    VariationKey:
      type: string
      pattern: "^[a-zA-Z0-9_.-]{1,64}$"
    VariationValue:
      description: |
        A JSON value of the flag's type, never null, of at most 64 KiB once
        compact (`too_long`), nesting arrays and objects at most 32 deep
        (`too_deep`).
      # The generated code imports encoding/json already, so the type needs
      # no import of its own.
      x-go-type: json.RawMessage
    Variation:
      type: object
      required: [key, value, name, description]
      properties:
        key:
          $ref: "#/components/schemas/VariationKey"
        value:
          $ref: "#/components/schemas/VariationValue"
        name:
          type: string
        description:
          type: string
    VariationInput:
      type: object
      required: [key, value]
      properties:
        key:
          $ref: "#/components/schemas/VariationKey"
        value:
          $ref: "#/components/schemas/VariationValue"
        name:
          type: string
          description: Defaults to the key.
        description:
          $ref: "#/components/schemas/Description"
    ExperimentDecision:
      type: object
      required: [outcome, winner_variation, note]
      properties:
        outcome:
          $ref: "#/components/schemas/ExperimentOutcome"
        winner_variation:
          type: string
          nullable: true
          description: The variation that won; null for a removal.
        note:
          type: string
          maxLength: 2000
          description: Why, as the members who decided wrote it; empty for none.
    ExperimentOutcome:
      type: string
      enum: [winner, removed]
      description: |
        `winner` serves the winning variation where the experiment was
        served; `removed` deletes the experiment's rules.
    ExperimentStop:
      type: object
      required: [outcome]
      properties:
        outcome:
          $ref: "#/components/schemas/ExperimentOutcome"
        winner_variation:
          type: string
          description: The variation that won, one the experiment compares; required for `winner`, absent for `removed`.
        note:
          type: string
          maxLength: 2000
          description: Why; empty or absent for none.
    ExperimentDecisionNote:
      type: object
      required: [note]
      properties:
        note:
          type: string
          maxLength: 2000
          description: Why; empty clears it.
    ExperimentStatus:
      type: string
      enum: [draft, running, stopped, archived]
    ExperimentWeight:
      type: object
      description: |
        The share of the allocated traffic one variation of the experiment's
        flag gets. The order of an experiment's weights fixes the cumulative
        bucket ranges.
      required: [variation, weight]
      properties:
        variation:
          type: string
          description: The key of a variation of the experiment's flag.
        weight:
          type: integer
          minimum: 0
          maximum: 10000
          description: In basis points (0.01 %); the weights of an experiment sum to 10,000.
    Experiment:
      type: object
      required: [id, key, name, hypothesis, owner, tags, flag, unit_type, variations, traffic_allocation,
        inclusion_salt, variation_salt, status, expected_end_at, started_at, stopped_at, archived_at, decision,
        created_by, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$"
          description: Names the experiment in rules and in the exposures SDKs report; unique, case sensitively, in the project, and never changes.
        name:
          $ref: "#/components/schemas/Name"
        hypothesis:
          type: string
          maxLength: 2000
          description: What the experiment expects to find, written before it runs.
        owner:
          type: string
          format: uuid
          description: The member accountable for the experiment.
        tags:
          type: array
          items:
            type: string
        flag:
          type: string
          description: The key of the flag whose variations the experiment compares.
        unit_type:
          type: string
          description: The key of the declared unit type whose units are split.
        variations:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentWeight"
        traffic_allocation:
          type: integer
          minimum: 0
          maximum: 10000
          description: The share of units included, in basis points.
        inclusion_salt:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Decides whether a unit is included; no other experiment or rollout of the project has it.
        variation_salt:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Decides which variation an included unit gets; no other experiment or rollout of the project has it.
        status:
          $ref: "#/components/schemas/ExperimentStatus"
        expected_end_at:
          type: string
          format: date
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        stopped_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        decision:
          allOf:
            - $ref: "#/components/schemas/ExperimentDecision"
          nullable: true
          description: What the stop decided; null until the experiment stops, and for one archived from its draft.
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The member who created the experiment; null when a project token did.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
    ExperimentList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last.
    ExperimentCreate:
      type: object
      required: [key, name, flag, unit_type, variations]
      properties:
        key:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$"
          description: Names the experiment in rules and in the exposures SDKs report; unique, case sensitively, in the project, and never changes.
        name:
          $ref: "#/components/schemas/Name"
        hypothesis:
          type: string
          maxLength: 2000
        owner:
          type: string
          format: uuid
          description: An active member holding a grant in the project, or an instance admin (`invalid_owner` otherwise); the calling member when absent, which a project token cannot leave it.
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 64
        flag:
          type: string
          description: The key of a flag of the project that is not archived.
        unit_type:
          type: string
          description: The key of a unit type the project declares.
        variations:
          type: array
          minItems: 2
          maxItems: 50
          items:
            $ref: "#/components/schemas/ExperimentWeight"
        traffic_allocation:
          type: integer
          minimum: 0
          maximum: 10000
          description: Every unit's (10,000) when absent.
        expected_end_at:
          type: string
          format: date
    ExperimentPatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
        hypothesis:
          type: string
          maxLength: 2000
        owner:
          type: string
          format: uuid
          description: A new owner must be an active member holding a grant in the project, or an instance admin.
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 64
        flag:
          type: string
          description: The key of a flag of the project that is not archived; the variations are judged against it.
        unit_type:
          type: string
          description: The key of a unit type the project declares.
        variations:
          type: array
          minItems: 2
          maxItems: 50
          items:
            $ref: "#/components/schemas/ExperimentWeight"
        traffic_allocation:
          type: integer
          minimum: 0
          maximum: 10000
        expected_end_at:
          type: string
          format: date
    ExperimentClone:
      type: object
      required: [key]
      properties:
        key:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$"
          description: The clone's key, unique, case sensitively, in the project (`already_exists`).
        name:
          $ref: "#/components/schemas/Name"
    ExperimentAssignment:
      type: object
      required: [experiment, unit_type, unit_id, inclusion_salt, variation_salt, inclusion_bucket, variation_bucket,
        traffic_allocation, included, variation, sql]
      properties:
        experiment:
          type: string
          description: The experiment's key.
        unit_type:
          type: string
        unit_id:
          type: string
        inclusion_salt:
          type: string
        variation_salt:
          type: string
        inclusion_bucket:
          type: integer
          minimum: 0
          maximum: 9999
          description: "`murmur3_32(\"{inclusion_salt}.{unit_id}\") mod 10000`."
        variation_bucket:
          type: integer
          minimum: 0
          maximum: 9999
          description: |
            `murmur3_32("{variation_salt}.{unit_id}") mod 10000`. Given for a
            unit left out too: the bucket it would be assigned by should the
            allocation grow to include it.
        traffic_allocation:
          type: integer
          minimum: 0
          maximum: 10000
        included:
          type: boolean
          description: Whether the inclusion bucket is below the traffic allocation.
        variation:
          type: string
          nullable: true
          description: The variation the unit is assigned; null when it is not included.
        sql:
          type: string
          description: |
            A ClickHouse query recomputing both buckets, `included` and
            `variation` for the unit. Its subquery `(SELECT '<unit_id>' AS
            unit_id)` stands for any table with a `unit_id` column.
    HashCheckRequest:
      type: object
      required: [unit_ids]
      properties:
        unit_ids:
          type: array
          description: 1000 to 200000 unit IDs, each 1 to 256 bytes, as often as each occurs.
          items:
            type: string
        salt:
          type: string
          description: The salt to hash with, 1 to 256 bytes; a random one in an experiment salt's form when omitted.
        second_salt:
          type: string
          description: A second salt, 1 to 256 bytes, to test both salts' buckets for independence.
        bins:
          type: integer
          default: 100
          description: How many bins the 10000 buckets are grouped into, 2 to 10000.
    HashCheck:
      type: object
      required: [salt, bins, counts, min, max, chi_square, df, p_value, verdict]
      properties:
        salt:
          type: string
          description: The salt hashed with, the one given or the random one drawn.
        second_salt:
          type: string
        bins:
          type: integer
        counts:
          type: array
          description: How many unit IDs fell into each bin, in bin order.
          items:
            type: integer
        min:
          type: integer
          description: The smallest count of a bin.
        max:
          type: integer
          description: The largest count of a bin.
        chi_square:
          type: number
          format: double
        df:
          type: integer
          description: The degrees of freedom, `bins − 1`.
        p_value:
          type: number
          format: double
        verdict:
          type: string
          enum: [uniform, not_uniform]
          description: "`uniform` when `p_value` is at least 0.001."
        independence:
          $ref: "#/components/schemas/HashCheckIndependence"
    HashCheckIndependence:
      type: object
      description: The test of independence, present only with `second_salt`.
      required: [chi_square, df, p_value, verdict]
      properties:
        chi_square:
          type: number
          format: double
        df:
          type: integer
          description: (non-empty rows − 1) × (non-empty columns − 1).
        p_value:
          type: number
          format: double
        verdict:
          type: string
          enum: [independent, dependent, untestable]
          description: |
            `independent` when `p_value` is at least 0.001; `untestable` when
            there are no degrees of freedom, every unit ID having fallen into
            one bin under one of the salts.
    ExperimentExposures:
      type: object
      required: [variations, conflicts, rejections, as_of, sample_ratio]
      properties:
        variations:
          type: array
          items:
            $ref: "#/components/schemas/VariationExposures"
        conflicts:
          $ref: "#/components/schemas/ConflictTotals"
        rejections:
          type: array
          description: The exposures refused, by reason, those with a count only.
          items:
            $ref: "#/components/schemas/ExposureRejections"
        as_of:
          type: string
          format: date-time
          nullable: true
          description: When the exposure rollup last moved; null before it first did.
        sample_ratio:
          allOf:
            - $ref: "#/components/schemas/SampleRatioCheck"
          nullable: true
          description: The latest sample-ratio check in the environment; null before the first.
    SampleRatioCheck:
      type: object
      required: [n, chi_square, p_value, skipped_reason, active, final, checked_at]
      properties:
        n:
          type: integer
          format: int64
          description: The first exposures of the variations the experiment weighs.
        chi_square:
          type: number
          format: double
          nullable: true
          description: "`X²`; null when the check was skipped."
        p_value:
          type: number
          format: double
          nullable: true
          description: The chi-square upper tail of `X²`; null when the check was skipped.
        skipped_reason:
          allOf:
            - $ref: "#/components/schemas/SampleRatioSkippedReason"
          nullable: true
          description: Why the check computed no statistic; null when it did.
        active:
          type: boolean
          description: An `srm` alert is active in the environment, acknowledged or not.
        checked_at:
          type: string
          format: date-time
          description: When the check ran; a stopped experiment's is its stop until the final check replaces it.
        final:
          type: boolean
          description: |
            Whether this is the result the experiment keeps. Every result of a running experiment is final. The
            stop takes its own result at its time, not final, since exposures accepted before the stop may not
            have been rolled up yet; once the exposure rollup has read every exposure received at or before the
            stop, the next round of the checks takes the final one over exactly those exposures, with
            `checked_at` the round's time. Nothing replaces a final result.
    SampleRatioSkippedReason:
      type: string
      enum: [below_minimum_sample, expected_below_5]
      description: "`below_minimum_sample`: fewer than 1,000 first exposures. `expected_below_5`: a variation expects fewer than 5."
    ExperimentAlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentAlert"
    ExperimentAlertKind:
      type: string
      enum: [srm, no_exposures, exposure_conflicts, past_expected_end]
      description: |
        `srm`: the sample-ratio check found first exposures out of line
        with the weights. `no_exposures`: no exposure for 24 hours in an
        environment holding the rule. `exposure_conflicts`: too many units
        exposed to another variation than their first one.
        `past_expected_end`: the experiment runs past its expected end.
    ExperimentAlert:
      type: object
      required: [id, kind, environment, raised_at, cleared_at, acknowledged_at, details]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ExperimentAlertKind"
        environment:
          type: string
          nullable: true
          description: The key of the environment the alert is about; null for one about the experiment as a whole.
        raised_at:
          type: string
          format: date-time
        cleared_at:
          type: string
          format: date-time
          nullable: true
          description: When the condition cleared; null while the alert is active.
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
          description: When it was first acknowledged; null otherwise.
        details:
          $ref: "#/components/schemas/ExperimentAlertDetails"
    ExperimentAlertDetails:
      type: object
      description: What the check found when it raised the alert; the block of the alert's kind is set, every other one is null.
      required: [sample_ratio, no_exposures, exposure_conflicts, past_expected_end]
      properties:
        sample_ratio:
          allOf:
            - $ref: "#/components/schemas/SampleRatioAlertDetails"
          nullable: true
        no_exposures:
          allOf:
            - $ref: "#/components/schemas/NoExposuresAlertDetails"
          nullable: true
        exposure_conflicts:
          allOf:
            - $ref: "#/components/schemas/ExposureConflictsAlertDetails"
          nullable: true
        past_expected_end:
          allOf:
            - $ref: "#/components/schemas/PastExpectedEndAlertDetails"
          nullable: true
    NoExposuresAlertDetails:
      type: object
      required: [last_exposure_at, since]
      properties:
        last_exposure_at:
          type: string
          format: date-time
          nullable: true
          description: When the server last received an exposure in the environment, overrides aside; null when it never did.
        since:
          type: string
          format: date-time
          description: Since when no exposure came, the later of the start and the last exposure.
    ExposureConflictsAlertDetails:
      type: object
      required: [conflicts, conflicting_units, first_exposures, threshold]
      properties:
        conflicts:
          type: integer
          format: int64
          description: The exposures naming another variation than their unit's first exposure.
        conflicting_units:
          type: integer
          format: int64
          description: The units with at least one such exposure.
        first_exposures:
          type: integer
          format: int64
          description: The first exposures in the environment.
        threshold:
          type: integer
          format: int64
          description: "`max(3, min(10, ceil(first_exposures / 1000)))`, which `conflicts` reached."
    PastExpectedEndAlertDetails:
      type: object
      required: [expected_end_at]
      properties:
        expected_end_at:
          type: string
          format: date
          description: The expected end the experiment passed.
    SampleRatioAlertDetails:
      type: object
      required: [n, chi_square, p_value, variations]
      properties:
        n:
          type: integer
          format: int64
        chi_square:
          type: number
          format: double
        p_value:
          type: number
          format: double
        variations:
          type: array
          description: The variations the experiment weighs, in its order.
          items:
            $ref: "#/components/schemas/SampleRatioVariation"
    SampleRatioVariation:
      type: object
      required: [variation, observed, expected, observed_share, expected_share]
      properties:
        variation:
          type: string
        observed:
          type: integer
          format: int64
          description: The variation's first exposures.
        expected:
          type: number
          format: double
          description: "`N × weight / 10000`."
        observed_share:
          type: number
          format: double
        expected_share:
          type: number
          format: double
    ConflictTotals:
      type: object
      required: [total, units]
      properties:
        total:
          type: integer
          format: int64
          description: The exposures naming another variation than their unit's first exposure.
        units:
          type: integer
          format: int64
          description: The units with at least one conflict.
    ExposureRejections:
      type: object
      required: [reason, count]
      properties:
        reason:
          type: string
          description: The rejection code, such as `unknown_variation`.
        count:
          type: integer
          format: int64
    VariationExposures:
      type: object
      required: [variation, exposures, overridden, first_exposures, observed_share, expected_share]
      properties:
        variation:
          type: string
        exposures:
          type: integer
          format: int64
          description: The non-override exposures naming the variation.
        overridden:
          type: integer
          format: int64
          description: The override exposures naming the variation.
        first_exposures:
          type: integer
          format: int64
          description: The units whose first exposure names the variation.
        observed_share:
          type: number
          format: double
          description: The variation's share of first exposures, 0 without any.
        expected_share:
          type: number
          format: double
          description: The share the variation's weight asks for, 0 for a variation the experiment does not weigh.
    ExposureTimeline:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExposureDay"
    ExposureDay:
      type: object
      required: [day, variation, exposures, overridden, first_exposures]
      properties:
        day:
          type: string
          format: date
        variation:
          type: string
        exposures:
          type: integer
          format: int64
        overridden:
          type: integer
          format: int64
        first_exposures:
          type: integer
          format: int64
    ExposureConflicts:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ExposureConflict"
    ExposureConflict:
      type: object
      required: [unit_type, unit_id, first_variation, conflicting_variation, conflicting_at]
      properties:
        unit_type:
          type: string
        unit_id:
          type: string
        first_variation:
          type: string
          description: The variation of the unit's first exposure.
        conflicting_variation:
          type: string
          description: The other variation the unit was last exposed to.
        conflicting_at:
          type: string
          format: date-time
          description: When that exposure occurred.
    FlagDefinition:
      type: object
      required: [id, key, type, name, description, owner, tags, lifetime, expected_removal_at, automatic_exposure,
        variations, archived_at, created_by, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$"
          description: Names the flag in code, such as `checkout.newFlow`; unique, case sensitively, in the project, and never changes.
        type:
          $ref: "#/components/schemas/FlagType"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        owner:
          type: string
          format: uuid
          description: The member accountable for the flag.
        tags:
          type: array
          items:
            type: string
        lifetime:
          $ref: "#/components/schemas/Lifetime"
        expected_removal_at:
          type: string
          format: date-time
          nullable: true
          description: When a temporary flag is expected to be removed; null for a permanent one.
        automatic_exposure:
          type: boolean
          description: SDKs record an exposure after every evaluation whose result carries an experiment.
        variations:
          type: array
          items:
            $ref: "#/components/schemas/Variation"
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: When the flag was archived, hidden from SDKs; null while it is not.
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The member who created the flag; null when a project token did.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
    Flag:
      description: |
        A flag's definition with its configuration in every environment, and
        when an SDK last evaluated it in each, both by the environments'
        order.
      allOf:
        - $ref: "#/components/schemas/FlagDefinition"
        - type: object
          required: [environments, last_evaluated]
          properties:
            environments:
              type: array
              items:
                $ref: "#/components/schemas/FlagConfiguration"
            last_evaluated:
              type: array
              items:
                $ref: "#/components/schemas/FlagLastEvaluated"
    FlagConfiguration:
      type: object
      description: What the flag serves in one environment.
      required: [environment, on, off_variation, fallthrough, prerequisites, overrides, rules, updated_at, updated_by,
        version]
      properties:
        environment:
          $ref: "#/components/schemas/Key"
        "on":
          type: boolean
        off_variation:
          type: string
          description: The variation served while the flag is off, and when a prerequisite fails.
        fallthrough:
          type: string
          description: The variation served when the flag is on and no rule matches.
        prerequisites:
          type: array
          description: Flags that must serve the named variation for this flag to be evaluated; otherwise it serves its off variation.
          items:
            $ref: "#/components/schemas/Prerequisite"
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/Override"
        rules:
          type: array
          description: Checked in order; the first whose conditions all hold serves.
          items:
            $ref: "#/components/schemas/Rule"
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
          nullable: true
          description: The member whose write made the configuration what it is; null when a project token did.
        version:
          $ref: "#/components/schemas/Version"
        change_requests:
          $ref: "#/components/schemas/WaitingChangeRequests"
    WaitingChangeRequests:
      type: object
      description: >-
        The change requests waiting on the configuration, which any write to it supersedes. Answered by the
        configuration's own operations; a flag's detail and the audit log leave it out.
      required: [open, approved, next_apply_at]
      properties:
        open:
          type: integer
          description: How many are open, awaiting a decision.
        approved:
          type: integer
          description: How many are approved, awaiting application.
        next_apply_at:
          type: string
          format: date-time
          nullable: true
          description: The earliest time one of them is scheduled to be applied at; null when none is scheduled.
    Prerequisite:
      type: object
      required: [flag, variation]
      properties:
        flag:
          type: string
          description: The key of another flag of the project, not archived.
        variation:
          type: string
          description: One of that flag's variations.
    Override:
      type: object
      description: A variation pinned for one unit. Its note and author stay on the server; SDKs receive neither.
      required: [unit_type, unit_id, variation, note, added_by]
      properties:
        unit_type:
          type: string
        unit_id:
          type: string
        variation:
          type: string
        note:
          type: string
          nullable: true
          description: Why the unit is pinned; null for none.
        added_by:
          type: string
          format: uuid
          nullable: true
          description: The member who last wrote the override; null when a project token did.
    OverrideInput:
      type: object
      required: [unit_type, unit_id, variation]
      properties:
        unit_type:
          type: string
          description: A unit type the project declares.
        unit_id:
          type: string
          minLength: 1
          description: The unit's ID, of 1 to 256 bytes, unique per unit type in the configuration.
        variation:
          type: string
        note:
          type: string
          nullable: true
          description: At most 200 characters once trimmed; blank is none.
    Rule:
      type: object
      required: [id, description, conditions, serve]
      properties:
        id:
          type: string
          format: uuid
          description: Given by the server to a new rule and kept across writes.
        description:
          type: string
        conditions:
          type: array
          description: Every one must hold for the rule to match.
          items:
            $ref: "#/components/schemas/Condition"
        serve:
          $ref: "#/components/schemas/Serve"
    RuleInput:
      type: object
      required: [serve]
      properties:
        id:
          type: string
          format: uuid
          description: The rule of the current configuration this one is; omitted for a new rule.
        description:
          $ref: "#/components/schemas/Description"
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Condition"
        serve:
          $ref: "#/components/schemas/Serve"
    Serve:
      type: object
      description: |
        What a matching rule serves. `variation` serves `variation`;
        `rollout` serves `variation` to `percentage` of the units of
        `unit_type`, in basis points (0 to 10,000), the others continuing to
        the next rule. A rollout's `salt` is given by the server and changes
        only through regenerating it, so a write omits it or sends it
        unchanged. `experiment` serves the experiment `experiment` of the
        flag, which assigns units to variations by its own weights; a rule
        serves a draft or running experiment of its flag
        (`unknown_experiment`, `experiment_of_another_flag` and
        `experiment_not_servable` otherwise), and several rules may serve
        the same one; a rule that served the experiment already keeps
        serving it whatever its status, so stopping or archiving it never
        blocks an edit of the other rules. While the experiment is a draft,
        stopped or archived its rules are left out of the ruleset SDKs
        receive; while it runs they carry its unit type, salts, traffic
        allocation and weights.
      required: [kind]
      properties:
        kind:
          type: string
          description: "`variation`, `rollout` or `experiment`."
        variation:
          type: string
        experiment:
          type: string
          description: The key of the experiment served, for kind `experiment`.
        unit_type:
          type: string
        percentage:
          type: integer
          minimum: 0
          maximum: 10000
        salt:
          type: string
    FlagConfigurationPut:
      type: object
      required: ["on", off_variation, fallthrough]
      properties:
        "on":
          type: boolean
        off_variation:
          type: string
        fallthrough:
          type: string
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/Prerequisite"
        overrides:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/OverrideInput"
        rules:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RuleInput"
    FlagConfigurationRevert:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: The version of this configuration to write again, from its history in this environment.
    ChangeRequestKind:
      type: string
      description: |
        What a change request proposes: `flag_configuration`, a flag's
        configuration in one environment; `definition`, a flag's variations
        and automatic exposure, or a segment's conditions and private
        switch, in every environment; `experiment`, an experiment's start,
        stop with a decision or traffic allocation growth, in every
        environment holding its rule. A client reads `proposed` by the kind
        and the entity named.
      enum: [flag_configuration, definition, experiment]
    ChangeRequestState:
      type: string
      description: |
        `draft` (its author prepares it), `open` (offered for review),
        `approved`, `rejected`, `applied`, `cancelled`, `superseded` (what
        it was based on moved). The last four are final.
      enum: [draft, open, approved, rejected, applied, cancelled, superseded]
    ChangeRequestAuthor:
      type: object
      description: The member or the project token that proposed the change request.
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [member, token]
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The member's display name or the token's name, as it is now.
    ChangeRequestDecision:
      type: object
      description: An approval or a rejection of a change request.
      required: [member, at, comment]
      properties:
        member:
          $ref: "#/components/schemas/ChangeRequestMember"
        at:
          type: string
          format: date-time
        comment:
          type: string
          description: What the member said, empty when an approval said nothing.
    ChangeRequestMember:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The member's display name, as it is now.
    ChangeRequestApplier:
      type: object
      description: The member or the project token that applied a change request, or the system at its scheduled time.
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [member, token, system]
        id:
          type: string
          format: uuid
          nullable: true
          description: The member's or the token's identifier; null for the system.
        name:
          type: string
          description: The member's display name or the token's name, as it is now; empty for the system.
    ScheduleFailure:
      type: object
      description: |
        Why the system failed to apply a scheduled change request, cleared
        when it is applied or cancelled and kept when it is superseded. The
        failure changes neither the change request's state nor its version.
      required: [at, code, message, attempts, stopped]
      properties:
        at:
          type: string
          format: date-time
          description: When the last attempt failed.
        code:
          type: string
          description: The code of the refusal, as a manual application would answer it, or `internal`.
        message:
          type: string
        attempts:
          type: integer
          minimum: 1
          description: The attempts that failed in a row.
        stopped:
          type: boolean
          description: |
            Whether the system stopped trying, after
            `FLAGNETIC_SCHEDULE_MAX_FAILURES` attempts (5 by default). Cancel
            the change request and copy it to propose it again.
    ChangeRequestApprove:
      type: object
      properties:
        comment:
          type: string
          description: Optional, at most 2,000 characters.
    ChangeRequestReject:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          description: Why the change request is rejected, at most 2,000 characters.
    PatchOperation:
      type: object
      description: One operation of an RFC 6902 JSON Patch; `value` is absent from a `remove`.
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace]
        path:
          type: string
          description: A JSON Pointer into `proposed`.
        value:
          description: The value added or replaced, of any JSON type, null included.
          nullable: true
          # Raw, so a null value is written as null and not left out, which
          # would make the operation another one.
          x-go-type: json.RawMessage
    ProposedOverride:
      type: object
      required: [unit_type, unit_id, variation, note]
      properties:
        unit_type:
          type: string
        unit_id:
          type: string
        variation:
          type: string
        note:
          type: string
          nullable: true
    ProposedConfiguration:
      type: object
      description: |
        A flag configuration as a change request proposes it: what it serves
        and the notes and descriptions that stay on the server, without who
        wrote it or when.
      required: ["on", off_variation, fallthrough, prerequisites, overrides, rules]
      properties:
        "on":
          type: boolean
        off_variation:
          type: string
        fallthrough:
          type: string
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/Prerequisite"
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/ProposedOverride"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
    ChangeRequest:
      type: object
      required: [id, kind, state, title, description, base_version, revert_to, proposed, diff, author, approval, rejection, applied_at,
        applied_by, superseded_by, apply_at, schedule_failure, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChangeRequestKind"
        flag:
          type: string
          description: The key of the flag proposed for; for an `experiment` change request, the experiment's flag.
        environment:
          type: string
          description: The key of the environment of a `flag_configuration` change request.
        segment:
          type: string
          description: The key of the segment of a segment's `definition`.
        experiment:
          type: string
          description: The key of the experiment of an `experiment` change request.
        state:
          $ref: "#/components/schemas/ChangeRequestState"
        title:
          type: string
        description:
          type: string
        base_version:
          type: integer
          format: int64
          description: The version of the configuration, the flag, the segment or the experiment the change request is based on.
        revert_to:
          type: integer
          format: int64
          nullable: true
          description: >-
            For a revert, the version of the configuration it returns to, from which the server fills `proposed`;
            null for any other change request.
        proposed:
          description: |
            What the change request proposes, by its kind and the entity it
            names: a `ProposedConfiguration` for `flag_configuration`, a
            `ProposedFlagDefinition` for a flag's `definition`, a
            `ProposedSegmentDefinition` for a segment's, a
            `ProposedExperimentTransition` for `experiment`.
          oneOf:
            - $ref: "#/components/schemas/ProposedConfiguration"
            - $ref: "#/components/schemas/ProposedFlagDefinition"
            - $ref: "#/components/schemas/ProposedSegmentDefinition"
            - $ref: "#/components/schemas/ProposedExperimentTransition"
        diff:
          type: array
          description: |
            The RFC 6902 patch from the entity as the change request is
            based on it to `proposed`. For an `experiment` change request,
            from the experiment (`status`, `traffic_allocation`,
            `decision`) and the rules serving it in each environment holding
            one (`rules`, by environment key) to what the transition leaves
            of them, so a stop shows each rule it rewrites or removes.
          items:
            $ref: "#/components/schemas/PatchOperation"
        author:
          $ref: "#/components/schemas/ChangeRequestAuthor"
        approval:
          description: Who approved the change request, when and why; null unless it was approved.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChangeRequestDecision"
        rejection:
          description: Who rejected the change request, when and why; null unless it was rejected.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChangeRequestDecision"
        applied_at:
          type: string
          format: date-time
          nullable: true
          description: When the change request was applied; null until it is.
        applied_by:
          description: Who applied the change request; null until it is applied.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChangeRequestApplier"
        superseded_by:
          type: string
          format: uuid
          nullable: true
          description: >-
            The audit entry of the write that superseded the change request by changing what it was based on: a direct
            write, an override, the kill switch, a copy, a revert, another change request's application, archiving or
            deleting its flag, deleting its environment, a write to a segment a rule of `proposed` names; for a definition, any write to its flag or segment, and a write
            to the configuration of its flag or of a flag naming its segment, in any environment; for an experiment, any
            write to the experiment, its deletion included, and a write to its flag's configuration in an environment that
            held its rule when the change request was based on it. Null unless a write superseded it; a change request
            found superseded only when it was opened, approved or applied names none, as when another environment has
            started holding the experiment's rule since.
        apply_at:
          type: string
          format: date-time
          nullable: true
          description: When the system applies the change request once approved, in UTC; null when it is applied by hand.
        schedule_failure:
          description: Why the last scheduled application failed; null when none did.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleFailure"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
    ChangeRequestList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRequest"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last.
    ChangeRequestCreate:
      type: object
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [flag_configuration, definition, experiment]
        flag:
          type: string
          description: The key of the flag, for a configuration or a flag's definition.
        environment:
          type: string
          description: The key of the environment, for a configuration only.
        segment:
          type: string
          description: The key of the segment, for a segment's definition only.
        experiment:
          type: string
          description: The key of the experiment, for an `experiment` change request only, which names no flag.
        title:
          type: string
        description:
          type: string
        proposed:
          $ref: "#/components/schemas/ProposedInput"
        revert_to:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Propose reverting a `flag_configuration` to this version of it instead of giving `proposed`, which the
            server fills.
        open:
          type: boolean
          default: false
          description: Open the change request for review at once instead of drafting it.
        apply_at:
          type: string
          format: date-time
          description: When the system applies the change request once approved; absent to apply it by hand.
    ChangeRequestPatch:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        proposed:
          $ref: "#/components/schemas/ProposedInput"
        apply_at:
          type: string
          format: date-time
          nullable: true
          description: The apply time; null removes it. Absent leaves it as it is.
          x-go-type: nullable.Nullable[time.Time]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
    ProposedInput:
      description: |
        What a change request proposes, as a direct write would give it,
        read by the change request's kind and the entity it names: a
        `FlagConfigurationPut` for `flag_configuration`, a
        `FlagDefinitionPut` for a flag's `definition`, a
        `SegmentDefinitionPut` for a segment's, an `ExperimentTransition`
        for `experiment`.
      oneOf:
        - $ref: "#/components/schemas/FlagConfigurationPut"
        - $ref: "#/components/schemas/FlagDefinitionPut"
        - $ref: "#/components/schemas/SegmentDefinitionPut"
        - $ref: "#/components/schemas/ExperimentTransition"
    ExperimentTransition:
      type: object
      description: |
        The transition an `experiment` change request proposes: `start` of
        a draft; `stop` of a running experiment with `decision`, the body a
        direct stop sends; or `set_traffic_allocation`, growing a running
        experiment's traffic allocation to `traffic_allocation`, never
        below the current value. It is checked when it is proposed as the
        transition itself is, and applying it runs the transition exactly
        as a direct call does.
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/ExperimentTransitionAction"
        decision:
          $ref: "#/components/schemas/ExperimentStop"
        traffic_allocation:
          type: integer
          minimum: 0
          maximum: 10000
          description: The traffic allocation to grow to, in basis points; for `set_traffic_allocation` only.
    ExperimentTransitionAction:
      type: string
      enum: [start, stop, set_traffic_allocation]
    ProposedExperimentTransition:
      type: object
      description: The transition of an experiment a change request proposes.
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/ExperimentTransitionAction"
        decision:
          description: A stop's decision; absent for any other transition.
          allOf:
            - $ref: "#/components/schemas/ExperimentDecision"
        traffic_allocation:
          type: integer
          description: The traffic allocation a growth grows to; absent for any other transition.
    FlagDefinitionPut:
      type: object
      description: |
        A flag's definition as a change request proposes it: what every
        environment's ruleset carries of the flag. Its other fields are
        edited directly.
      required: [automatic_exposure, variations]
      properties:
        automatic_exposure:
          type: boolean
        variations:
          type: array
          description: Every variation, in order, matched to the current ones by key.
          items:
            $ref: "#/components/schemas/VariationInput"
    SegmentDefinitionPut:
      type: object
      description: |
        A segment's definition as a change request proposes it: what every
        environment's ruleset carries of the segment. Its name and
        description are edited directly.
      required: [conditions, private]
      properties:
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Condition"
        private:
          type: boolean
    ProposedFlagDefinition:
      type: object
      description: A flag's definition as a change request proposes it.
      required: [automatic_exposure, variations]
      properties:
        automatic_exposure:
          type: boolean
        variations:
          type: array
          items:
            $ref: "#/components/schemas/Variation"
    ProposedSegmentDefinition:
      type: object
      description: A segment's definition as a change request proposes it.
      required: [conditions, private]
      properties:
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        private:
          type: boolean
    FlagConfigurationCopy:
      type: object
      required: [from]
      properties:
        from:
          type: string
          description: The key of the environment whose configuration is copied, another of the project's.
        include_overrides:
          type: boolean
          default: false
          description: Whether the source's overrides replace this environment's; otherwise this environment keeps its own.
    OverridePut:
      type: object
      required: [variation]
      properties:
        variation:
          type: string
        note:
          type: string
          nullable: true
          description: At most 200 characters once trimmed; blank or absent is none.
    Kill:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          description: Why, at most 2,000 characters; recorded in the audit log.
    KillResult:
      type: object
      required: [changed, configuration]
      properties:
        changed:
          type: boolean
          description: False when the flag was off already.
        configuration:
          $ref: "#/components/schemas/FlagConfiguration"
    FlagList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FlagListItem"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last.
    FlagListItem:
      description: A flag's definition with its flag state in every environment, by the environments' order.
      allOf:
        - $ref: "#/components/schemas/FlagDefinition"
        - type: object
          required: [states]
          properties:
            states:
              type: array
              items:
                $ref: "#/components/schemas/FlagState"
    FlagState:
      type: object
      description: What a flag's configuration in one environment serves at a glance.
      required: [environment, "on", has_rules, has_rollout, has_experiment, last_evaluated_at]
      properties:
        environment:
          $ref: "#/components/schemas/Key"
        last_evaluated_at:
          $ref: "#/components/schemas/LastEvaluatedAt"
        "on":
          type: boolean
        has_rules:
          type: boolean
          description: The configuration has at least one rule, whether the flag is on or off.
        has_rollout:
          type: boolean
          description: A rule of the configuration serves a rollout.
        has_experiment:
          type: boolean
          description: A rule of the configuration serves an experiment.
    EventVolume:
      type: object
      required: [days, gaps]
      properties:
        days:
          type: array
          description: By day, then type.
          items:
            $ref: "#/components/schemas/EventVolumeDay"
        gaps:
          type: array
          description: By when their first event was received.
          items:
            $ref: "#/components/schemas/EventGap"
    EventVolumeDay:
      type: object
      required: [day, type, events]
      properties:
        day:
          type: string
          format: date
          description: The UTC day the events were received.
        type:
          $ref: "#/components/schemas/EventType"
        events:
          type: integer
          format: int64
          minimum: 1
    EventType:
      type: string
      description: The type of an event as SDKs post it to `/sdk/v1/events`.
      enum: [evaluation_summary, alias, exposure]
    EventGap:
      type: object
      required: [stream, type, period_start, period_end, rows, dropped_at]
      properties:
        stream:
          type: string
          description: |
            The reader that lost the events: `exposures`,
            `evaluation_summaries` or `aliases`, the rollup streams.
        type:
          $ref: "#/components/schemas/EventType"
        period_start:
          type: string
          format: date-time
          description: When the first event lost was received.
        period_end:
          type: string
          format: date-time
          description: When the last event lost was received.
        rows:
          type: integer
          format: int64
          minimum: 1
          description: |
            The raw rows lost, every project's: an evaluation summary is
            stored as one row per flag, variation and reason it counts.
        dropped_at:
          type: string
          format: date-time
          description: When retention dropped them.
    FlagEvaluations:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FlagEvaluationDay"
    FlagEvaluationDay:
      type: object
      required: [day, source, variation, reason, evaluations]
      properties:
        day:
          type: string
          format: date
          description: The UTC day the evaluations were received.
        source:
          $ref: "#/components/schemas/EvaluationSource"
        variation:
          type: string
          nullable: true
          description: The variation served; null when none was.
        reason:
          type: string
          description: |
            The evaluation reason as counted: a true reason, an SDK's own
            `fallback` or `local_override`, or `targeting_match`, which a
            client SDK counts from the answers it receives.
        evaluations:
          type: integer
          format: int64
          minimum: 0
          description: Stops at the largest int64 rather than overflow.
    EvaluationSource:
      type: string
      description: |
        Who counted the evaluations: an SDK reporting those it made (`sdk`),
        or the server counting every flag of every remote evaluation it
        answered (`remote_evaluation`).
      enum: [sdk, remote_evaluation]
    StaleReason:
      type: string
      enum: [lifetime_exceeded, not_evaluated, owner_inactive, finished_rollout, experiment_overdue]
      description: Why a flag is stale; the operation listing stale flags defines each.
    StaleFlag:
      type: object
      description: A stale flag with why it is stale.
      required: [key, name, owner, lifetime, expected_removal_at, reasons, last_evaluated]
      properties:
        key:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$"
        name:
          $ref: "#/components/schemas/Name"
        owner:
          type: string
          format: uuid
          description: The member accountable for the flag.
        lifetime:
          $ref: "#/components/schemas/Lifetime"
        expected_removal_at:
          type: string
          format: date-time
          nullable: true
          description: When a temporary flag is expected to be removed; null for a permanent one.
        reasons:
          type: array
          minItems: 1
          description: |
            Every reason the flag is stale for, in the order
            `lifetime_exceeded`, `not_evaluated`, `owner_inactive`,
            `finished_rollout`, `experiment_overdue`.
          items:
            $ref: "#/components/schemas/StaleReason"
        last_evaluated:
          type: array
          description: When an SDK last evaluated the flag in each environment, by the environments' order.
          items:
            $ref: "#/components/schemas/FlagLastEvaluated"
        experiment:
          $ref: "#/components/schemas/StaleExperiment"
    StaleExperiment:
      type: object
      description: |
        The running experiment past its expected end that makes the flag
        stale as `experiment_overdue`, present with that reason only. When
        several are, the one due earliest, then the first by key.
      required: [key, expected_end_at]
      properties:
        key:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$"
        expected_end_at:
          type: string
          format: date
    StaleFlagDigest:
      type: object
      description: The stale flags a digest lists.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StaleFlag"
    StaleFlagList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StaleFlag"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last.
    FlagLastEvaluated:
      type: object
      required: [environment, last_evaluated_at]
      properties:
        environment:
          $ref: "#/components/schemas/Key"
        last_evaluated_at:
          $ref: "#/components/schemas/LastEvaluatedAt"
    LastEvaluatedAt:
      type: string
      format: date-time
      nullable: true
      description: |
        When an SDK last evaluated the flag in the environment, by the end of
        the interval its evaluation summary covers or the time of an
        exposure it recorded, never later than the server received them;
        null when none ever did. Remote evaluations the server answered
        never move it.
    FlagCreate:
      type: object
      required: [key, type, name]
      properties:
        key:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{0,127}$"
          description: Names the flag in code, such as `checkout.newFlow`; unique, case sensitively, in the project, and never changes.
        type:
          $ref: "#/components/schemas/FlagType"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        owner:
          type: string
          format: uuid
          description: An active member holding a grant in the project, or an instance admin (`invalid_owner` otherwise); the calling member when absent, which a project token cannot leave it.
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 64
        lifetime:
          $ref: "#/components/schemas/Lifetime"
        expected_removal_at:
          type: string
          format: date-time
          description: For a temporary flag only, which a flag is when `lifetime` is absent; 90 days from now when absent.
        automatic_exposure:
          type: boolean
        variations:
          type: array
          description: Required unless the flag is boolean, whose variations are always `true` and `false`.
          items:
            $ref: "#/components/schemas/VariationInput"
    FlagPatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `immutable` whatever its value.
        type:
          type: string
          description: Refused with `immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        owner:
          type: string
          format: uuid
          description: A new owner must be an active member holding a grant in the project, or an instance admin.
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 64
        lifetime:
          $ref: "#/components/schemas/Lifetime"
        expected_removal_at:
          type: string
          format: date-time
          description: For a temporary flag only. Becoming temporary without one sets 90 days from now; becoming permanent clears it.
        automatic_exposure:
          type: boolean
        variations:
          type: array
          description: Every variation, in order, matched to the current ones by key.
          items:
            $ref: "#/components/schemas/VariationInput"
    ReferenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
    Condition:
      type: object
      description: |
        One comparison inside a rule or a segment. An `attribute` condition
        names an attribute or unit type, an operator (`op`) and a `value`
        (none for `exists`, `not_exists` and `is_empty`); `in_segment` and
        `not_in_segment` name a `segment`; `prerequisite` names a `flag` and
        one of its `variation`s. A segment holds attribute conditions only.
      required: [kind]
      properties:
        kind:
          type: string
          description: "`attribute`, `in_segment`, `not_in_segment` or `prerequisite`."
        attribute:
          type: string
        op:
          type: string
        value:
          description: A string, number, boolean or list, as the operator and the attribute's type need; null is no value.
          nullable: true
        segment:
          type: string
        flag:
          type: string
        variation:
          type: string
    Segment:
      type: object
      required: [id, key, name, description, private, conditions, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        private:
          type: boolean
          description: Its conditions never leave the server; only server-side evaluation uses it.
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
    SegmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SegmentListItem"
    SegmentListItem:
      allOf:
        - $ref: "#/components/schemas/Segment"
        - type: object
          required: [usage_count]
          properties:
            usage_count:
              type: integer
              minimum: 0
              description: |
                How many flags' rules name the segment, archived flags
                included, each flag counted once whatever its environments.
                Deleting it is refused while this is above zero.
    SegmentCreate:
      type: object
      required: [key, name]
      properties:
        key:
          $ref: "#/components/schemas/Key"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        private:
          type: boolean
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Condition"
    SegmentPatch:
      type: object
      properties:
        key:
          type: string
          description: Refused with `immutable` whatever its value.
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        private:
          type: boolean
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Condition"
    EvaluationRequest:
      type: object
      required: [context]
      properties:
        context:
          $ref: "#/components/schemas/EvaluationContext"
        flags:
          type: array
          description: The keys of the flags to evaluate; absent for every flag that is not archived.
          items:
            type: string
        draft:
          $ref: "#/components/schemas/EvaluationDraft"
    EvaluationContext:
      type: object
      description: |
        What flags are evaluated for: unit IDs by unit type, each of at most
        256 bytes, an empty one counting as absent; and attribute values by
        key, as SDKs send them. A context with no units is valid: rules on
        attributes apply, while rollouts and overrides are skipped.
      properties:
        units:
          type: object
          additionalProperties:
            type: string
        attributes:
          type: object
          additionalProperties: true
    EvaluationDraft:
      type: object
      description: An unsaved configuration of one flag in the environment, evaluated in place of the saved one and never stored.
      required: [flag, configuration]
      properties:
        flag:
          type: string
          description: The key of a flag of the project that is not archived.
        configuration:
          $ref: "#/components/schemas/FlagConfigurationPut"
    Evaluation:
      type: object
      required: [ruleset_version, flags]
      properties:
        ruleset_version:
          type: integer
          format: int64
          description: The version of the environment's saved ruleset, which a draft does not move.
        flags:
          type: object
          description: The result of each flag evaluated, by flag key.
          additionalProperties:
            $ref: "#/components/schemas/EvaluationResult"
    EvaluatedExperiment:
      type: object
      description: |
        The running experiment a result comes from, as an SDK's exposure
        carries it: present with reason `experiment`, and with reason
        `override` when the unit, without the override, would be in a
        running experiment. Recomputing either bucket takes the salt and
        the unit: `murmur3_32(salt + "." + unit_id) % 10000`.
      required: [key, variation, unit_type, unit_id, inclusion_salt, variation_salt, inclusion_bucket, variation_bucket, override]
      properties:
        key:
          type: string
        variation:
          type: string
          description: The served variation; the override's when an override decided the result.
        unit_type:
          type: string
        unit_id:
          type: string
        inclusion_salt:
          type: string
        variation_salt:
          type: string
        inclusion_bucket:
          type: integer
          description: The unit is included when it is below the traffic allocation.
        variation_bucket:
          type: integer
          description: Picks the variation by the weights' cumulative ranges.
        override:
          type: boolean
          description: Whether an override influenced the result; analysis leaves such exposures out.
    EvaluationResult:
      type: object
      description: |
        What one flag serves the context, and why, as the reference
        evaluator computes it. `type` and `automatic_exposure` are absent
        only for `flag_not_found`.
      required: [reason, override_influenced]
      properties:
        type:
          $ref: "#/components/schemas/FlagType"
        value:
          $ref: "#/components/schemas/VariationValue"
        variation:
          type: string
          description: The served variation's key; absent for an error.
        reason:
          type: string
          description: "`off`, `override`, `rule`, `rollout`, `experiment`, `fallthrough`, `prerequisite_failed` or `error`."
        rule_id:
          type: string
          format: uuid
          description: The rule that served, for reasons `rule`, `rollout` and `experiment`.
        experiment:
          $ref: "#/components/schemas/EvaluatedExperiment"
        automatic_exposure:
          type: boolean
        prerequisite:
          type: string
          description: The key of the flag-level prerequisite that failed, for reason `prerequisite_failed`.
        bucket:
          type: integer
          description: The unit's bucket, 0 to 9,999, for reason `rollout`; the unit is in the rollout because its bucket is below the percentage.
        salt:
          type: string
          description: The salt of the rollout that served, for reason `rollout`.
        error_code:
          type: string
          description: "Why the result is an error: `flag_not_found`, `prerequisite_cycle` or `inconsistent_ruleset`."
        override_influenced:
          type: boolean
          description: Whether an override decided the result, directly or through a prerequisite.
    WebhookEventType:
      type: string
      x-go-type: string
      description: |
        A type of the event catalogue, or `*` for every type but
        `audit.entry`. `GET /webhook-event-types` lists the catalogue with
        what emits each type.
      enum:
        - "flag.created"
        - "flag.updated"
        - "flag.deleted"
        - "flag.switched_on"
        - "flag.switched_off"
        - "flag.kill_switch"
        - "flag.rules_changed"
        - "flag.reverted"
        - "segment.created"
        - "segment.updated"
        - "segment.deleted"
        - "experiment.started"
        - "experiment.stopped"
        - "experiment.archived"
        - "experiment.traffic_allocation_changed"
        - "experiment.srm_detected"
        - "experiment.srm_cleared"
        - "experiment.no_exposures"
        - "experiment.exposure_conflicts"
        - "experiment.past_expected_end"
        - "change_request.opened"
        - "change_request.approved"
        - "change_request.rejected"
        - "change_request.applied"
        - "change_request.cancelled"
        - "change_request.superseded"
        - "change_request.scheduled"
        - "change_request.schedule_failed"
        - "grant.created"
        - "grant.deleted"
        - "sdk_key.created"
        - "sdk_key.revoked"
        - "sink.failing"
        - "sink.at_risk"
        - "sink.stopped"
        - "sink.data_lost"
        - "project.imported"
        - "webhook.disabled"
        - "report.stale_flags"
        - "audit.entry"
        - "ping"
        - "*"
    WebhookEventTypeInfo:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
        description:
          type: string
          description: What emits an event of this type.
    WebhookEventTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventTypeInfo"
    WebhookDisabledReason:
      type: string
      enum: [persistent_failure]
      description: Why the platform disabled a subscription.
    WebhookCreator:
      type: object
      description: The member or the project token that created a webhook subscription.
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [member, token]
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The member's display name or the token's name, as it is now.
    Webhook:
      type: object
      required: [id, name, url, events, environments, enabled, disabled_reason, created_by, last_success_at,
        consecutive_failures, previous_secret_expires_at, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        url:
          type: string
          description: |
            Where every event is posted: `https` unless the operator set
            `FLAGNETIC_WEBHOOK_ALLOW_HTTP`.
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        environments:
          type: array
          description: |
            The keys of the environments whose events are sent; empty for
            every one. An event of no environment is always sent.
          items:
            type: string
        enabled:
          type: boolean
        disabled_reason:
          allOf:
            - $ref: "#/components/schemas/WebhookDisabledReason"
          nullable: true
          description: Why the platform disabled the subscription; null when it is enabled or a member disabled it.
        created_by:
          allOf:
            - $ref: "#/components/schemas/WebhookCreator"
          nullable: true
        last_success_at:
          type: string
          format: date-time
          nullable: true
          description: When a call last succeeded; null before the first.
        consecutive_failures:
          type: integer
          description: The calls that failed since the last success or the last enable.
        previous_secret_expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Until when the secret the last rotation replaced signs beside the
            current one; null outside a rotation's overlap.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
    WebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                Base64url of 32 random bytes, the key of every signature
                under this subscription. Shown once, by the operation that
                issued it: it is stored sealed and never answered again.
    WebhookCreate:
      type: object
      required: [name, url, events]
      properties:
        name:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        environments:
          type: array
          description: The keys of the environments whose events to send; empty or absent for every one.
          items:
            type: string
        enabled:
          type: boolean
          description: Whether events are sent; true when absent.
    WebhookPatch:
      type: object
      description: The properties to change; each absent one is left as it is.
      properties:
        name:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        environments:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    WebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
    SinkKind:
      type: string
      enum: [clickhouse, object_storage, webhook]
      description: Which target a sink delivers to; fixed when the sink is created.
    SinkEventKind:
      type: string
      enum: [exposure, alias, evaluation_summary]
      description: |
        A kind of raw event a sink exports, each delivered through a stream of its own.
        The columns of each kind's rows, with their types, are in
        [Exported events](https://github.com/azverinus/flagnetic/blob/main/docs/exported-events.md).
    SinkHealth:
      type: string
      enum: [disabled, stopped, failing, degraded, lagging, healthy]
      description: |
        The first that holds: `disabled` by a member; `stopped` after the
        target kept rejecting batches, until resumed; `failing` while a
        stream cannot reach its target; `degraded` while a dead letter waits;
        `lagging` while the oldest undelivered event is older than the
        operator's `FLAGNETIC_SINK_LAG_WARNING`; otherwise `healthy`.
    SinkFailureClass:
      type: string
      enum: [dns, connect, tls, timeout, refused_target, redirect, status, rejected]
      description: |
        Why a call to a target failed, from a closed list; a target's own
        words are never kept or answered.
    SinkFailure:
      type: object
      description: The last failed call of a stream.
      required: [class, status, code, at]
      properties:
        class:
          $ref: "#/components/schemas/SinkFailureClass"
        status:
          type: integer
          nullable: true
          description: The HTTP status the target answered, when it did.
        code:
          type: string
          nullable: true
          description: The protocol's own error code, such as a ClickHouse exception or an S3 error code, when the target speaks one.
        at:
          type: string
          format: date-time
    SinkStream:
      type: object
      description: One event kind's delivery. Cursors are never exposed.
      required: [event_kind, last_delivered_at, last_failure]
      properties:
        event_kind:
          $ref: "#/components/schemas/SinkEventKind"
        last_delivered_at:
          type: string
          format: date-time
          nullable: true
        last_failure:
          allOf:
            - $ref: "#/components/schemas/SinkFailure"
          nullable: true
    SinkClickHouse:
      type: object
      description: |
        A ClickHouse sink's configuration, written to its HTTP interface. The
        platform creates `{table_prefix}_exposures`, `_aliases` and
        `_evaluation_summaries` when it enables the sink and `create_tables`
        is true.
      required: [url, database, table_prefix, username, password, tls_skip_verify, create_tables, settings]
      properties:
        url:
          type: string
          description: Where the HTTP interface answers; http or https, without credentials.
        database:
          type: string
        table_prefix:
          type: string
          description: Letters, digits and underscores, not starting with a digit.
        username:
          type: string
        password:
          type: string
          description: Always `***`; the stored password is never answered.
        tls_skip_verify:
          type: boolean
        create_tables:
          type: boolean
        settings:
          type: object
          description: ClickHouse settings sent with every insert. The ones delivery sets itself are refused.
          additionalProperties:
            type: string
    SinkObjectStorage:
      type: object
      description: An object storage sink's configuration, for any S3-compatible service.
      required: [endpoint, region, bucket, prefix, access_key_id, secret_access_key, path_style, format, compression]
      properties:
        endpoint:
          type: string
          description: A scheme, a host and a port; empty for AWS.
        region:
          type: string
          description: Empty asks the bucket.
        bucket:
          type: string
        prefix:
          type: string
          description: Without outer slashes.
        access_key_id:
          type: string
        secret_access_key:
          type: string
          description: Always `***`; the stored key is never answered.
        path_style:
          type: boolean
        format:
          type: string
          enum: [jsonl, parquet]
        compression:
          type: string
          enum: [gzip, zstd, none]
          description: For `jsonl`; `parquet` files are always `zstd`.
    SinkWebhook:
      type: object
      description: A webhook sink's configuration. Its secret is the sink's, drawn by the server.
      required: [url, headers]
      properties:
        url:
          type: string
          description: |
            Where every batch is posted: `https` unless the operator set
            `FLAGNETIC_WEBHOOK_ALLOW_HTTP`.
        headers:
          type: object
          description: Sent with every call, before the platform's own. Names starting `X-Flagnetic-` are refused.
          additionalProperties:
            type: string
    Sink:
      type: object
      description: |
        A project's sink. It carries exactly the one of `clickhouse`,
        `object_storage` and `webhook` that its `kind` names.
        What a sink writes, with the compatibility promise, is in
        [Exported events](https://github.com/azverinus/flagnetic/blob/main/docs/exported-events.md);
        how to run one is in [Sinks](https://github.com/azverinus/flagnetic/blob/main/docs/sinks.md).
      required: [id, name, kind, event_kinds, environments, batch_size, flush_interval, enabled, health, at_risk,
        lag_seconds, dead_letters, gaps, stopped_at, warnings, streams, created_at, updated_at, version]
      oneOf:
        - required: [clickhouse]
        - required: [object_storage]
        - required: [webhook]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        kind:
          $ref: "#/components/schemas/SinkKind"
        clickhouse:
          $ref: "#/components/schemas/SinkClickHouse"
        object_storage:
          $ref: "#/components/schemas/SinkObjectStorage"
        webhook:
          $ref: "#/components/schemas/SinkWebhook"
        event_kinds:
          type: array
          description: The event kinds exported; empty for all of them.
          items:
            $ref: "#/components/schemas/SinkEventKind"
        environments:
          type: array
          description: The keys of the environments whose events are exported; empty for every one.
          items:
            type: string
        batch_size:
          type: integer
          description: The most events one delivery carries.
        flush_interval:
          type: integer
          description: Seconds the sink waits between deliveries once it has caught up.
        enabled:
          type: boolean
        health:
          $ref: "#/components/schemas/SinkHealth"
        at_risk:
          type: boolean
          description: Whether retention is about to drop events the sink has not delivered.
        lag_seconds:
          type: integer
          format: int64
          nullable: true
          description: The age of the oldest undelivered event; null while the sink is disabled.
        dead_letters:
          type: integer
          description: The dead letters waiting to be redelivered or discarded.
        gaps:
          type: integer
          description: The gaps not yet dismissed.
        stopped_at:
          type: string
          format: date-time
          nullable: true
        warnings:
          type: array
          description: What the last check of the target found wrong without making delivery impossible.
          items:
            type: string
        streams:
          type: array
          description: One per event kind exported once the sink has been enabled; empty before.
          items:
            $ref: "#/components/schemas/SinkStream"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
    SinkWithSecret:
      allOf:
        - $ref: "#/components/schemas/Sink"
        - type: object
          properties:
            secret:
              type: string
              description: |
                A webhook sink's secret, base64url of 32 random bytes, the
                key of every signature under the sink. Shown once, by the
                operation that issued it: it is stored sealed and never
                answered again. Absent for the other kinds.
    SinkClickHouseInput:
      type: object
      description: |
        A ClickHouse sink's configuration as it is written. Required, and
        refused `invalid_sink` when absent: `url`, `database`, `username`
        and, when creating, `password`.
      properties:
        url:
          type: string
        database:
          type: string
        table_prefix:
          type: string
          description: "`flagnetic` when empty."
        username:
          type: string
        password:
          type: string
          description: Sealed on arrival. `***` or absent keeps the stored password when editing, unless `url`, `username` or `tls_skip_verify` changes, and then it must be sent again.
        tls_skip_verify:
          type: boolean
        create_tables:
          type: boolean
          description: True when absent.
        settings:
          type: object
          additionalProperties:
            type: string
    SinkObjectStorageInput:
      type: object
      description: |
        An object storage sink's configuration as it is written. Required,
        and refused `invalid_sink` when absent: `bucket`, `access_key_id` and,
        when creating, `secret_access_key`.
      properties:
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        access_key_id:
          type: string
        secret_access_key:
          type: string
          description: Sealed on arrival. `***` or absent keeps the stored key when editing, unless `endpoint` or `access_key_id` changes, and then it must be sent again.
        path_style:
          type: boolean
        format:
          type: string
          description: "`jsonl` when empty."
        compression:
          type: string
          description: "`gzip` for `jsonl` and `zstd` for `parquet` when empty."
    SinkWebhookInput:
      type: object
      description: A webhook sink's configuration as it is written. `url` is required.
      properties:
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
    SinkEnable:
      type: object
      properties:
        start_from:
          type: string
          format: date-time
          description: |
            Where the streams this call creates start, a time within retention:
            the first event received at or after it is the first delivered.
            Absent, they start at the horizon. A stream the sink already has
            keeps its place.
    SinkTest:
      type: object
      description: |
        The configuration to test in place of the stored one: the sub-object of
        the sink's kind, which replaces it whole. Nothing is stored.
      properties:
        clickhouse:
          $ref: "#/components/schemas/SinkClickHouseInput"
        object_storage:
          $ref: "#/components/schemas/SinkObjectStorageInput"
        webhook:
          $ref: "#/components/schemas/SinkWebhookInput"
    SinkTestResult:
      type: object
      required: [ok, class, status, code, warnings]
      properties:
        ok:
          type: boolean
          description: Whether the target answered and can take a batch.
        class:
          allOf:
            - $ref: "#/components/schemas/SinkFailureClass"
          nullable: true
          description: Why not, when it did not.
        status:
          type: integer
          nullable: true
          description: The HTTP status the target answered, when it did.
        code:
          type: string
          nullable: true
          description: The protocol's own error code, when the target speaks one.
        warnings:
          type: array
          description: What is wrong with the target that does not stop delivery, such as a column missing from a table.
          items:
            type: string
    SinkSample:
      type: object
      properties:
        event_kinds:
          type: array
          description: The event kinds to send samples of; empty or absent for every kind the sink exports.
          items:
            type: string
    SinkSampleResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SinkSampleKindResult"
    SinkSampleKindResult:
      type: object
      required: [event_kind, ok, class, status, code]
      properties:
        event_kind:
          type: string
        ok:
          type: boolean
          description: Whether the target acknowledged the sample.
        class:
          allOf:
            - $ref: "#/components/schemas/SinkFailureClass"
          nullable: true
          description: Why not, when it did not.
        status:
          type: integer
          nullable: true
          description: The HTTP status the target answered, when it did.
        code:
          type: string
          nullable: true
          description: The protocol's own error code, when the target speaks one.
    SinkReplay:
      type: object
      required: [from]
      properties:
        from:
          type: string
          format: date-time
          description: |
            Where the replay starts, a time within retention: the first event
            received at or after it is the first sent again.
        to:
          type: string
          format: date-time
          description: |
            Where it ends: the last event received at or before it is the last
            sent again. Absent, the replay runs on into the live stream.
        event_kinds:
          type: array
          description: The event kinds to replay; empty or absent for every kind the sink exports.
          items:
            type: string
    SinkCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          description: "`clickhouse`, `object_storage` or `webhook`."
        clickhouse:
          $ref: "#/components/schemas/SinkClickHouseInput"
        object_storage:
          $ref: "#/components/schemas/SinkObjectStorageInput"
        webhook:
          $ref: "#/components/schemas/SinkWebhookInput"
        event_kinds:
          type: array
          description: Empty or absent for every event kind.
          items:
            type: string
        environments:
          type: array
          description: The keys of the environments whose events to export; empty or absent for every one.
          items:
            type: string
        batch_size:
          type: integer
          description: The kind's default when absent.
        flush_interval:
          type: integer
          description: Seconds; the kind's default when absent.
    SinkPatch:
      type: object
      description: The properties to change; each absent one is left as it is.
      properties:
        name:
          type: string
        kind:
          type: string
          description: May be left out; naming a kind other than the sink's own is refused `kind_immutable`.
        clickhouse:
          $ref: "#/components/schemas/SinkClickHouseInput"
        object_storage:
          $ref: "#/components/schemas/SinkObjectStorageInput"
        webhook:
          $ref: "#/components/schemas/SinkWebhookInput"
        event_kinds:
          type: array
          items:
            type: string
        environments:
          type: array
          items:
            type: string
        batch_size:
          type: integer
        flush_interval:
          type: integer
        enabled:
          type: boolean
          description: "`false` only: a sink is enabled with its own operation."
    SinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Sink"
    SinkDeadLetterStatus:
      type: string
      enum: [pending, redelivered, expired]
      description: |
        `pending` waits to be redelivered or discarded; `redelivered` was
        acknowledged by the target after a redelivery; `expired` lost every
        row to retention.
    SinkDeadLetter:
      type: object
      description: |
        A batch of one event kind the target rejected, set aside so the stream
        could go on. Cursors are never exposed: the batch is told by how many
        rows it held and when the first and the last of them were received.
      required: [id, event_kind, rows, first_received_at, last_received_at, attempts, last_failure, status, created_at, redelivered_at]
      properties:
        id:
          type: string
          format: uuid
        event_kind:
          $ref: "#/components/schemas/SinkEventKind"
        rows:
          type: integer
          description: How many rows the batch held when it was set aside, those of deleted environments included.
        first_received_at:
          type: string
          format: date-time
        last_received_at:
          type: string
          format: date-time
        attempts:
          type: integer
          description: How many times the target rejected the batch, redeliveries included.
        last_failure:
          $ref: "#/components/schemas/SinkFailure"
        status:
          $ref: "#/components/schemas/SinkDeadLetterStatus"
        created_at:
          type: string
          format: date-time
        redelivered_at:
          type: string
          format: date-time
          nullable: true
    SinkDeadLetterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SinkDeadLetter"
    SinkGap:
      type: object
      description: |
        Rows of one event kind that retention dropped before the sink
        delivered them. The sink's stream went on after them. Cursors are
        never exposed: the loss is told by how many rows and when they were
        received.
      required: [id, event_kind, rows, period_start, period_end, dropped_at, dismissed_at]
      properties:
        id:
          type: string
          format: uuid
        event_kind:
          $ref: "#/components/schemas/SinkEventKind"
        rows:
          type: integer
          format: int64
          minimum: 1
          description: The rows lost that the sink's project and environments admit.
        period_start:
          type: string
          format: date-time
          description: When the first row lost was received.
        period_end:
          type: string
          format: date-time
          description: When the last row lost was received.
        dropped_at:
          type: string
          format: date-time
          description: When retention dropped them.
        dismissed_at:
          type: string
          format: date-time
          nullable: true
          description: When a member dismissed the gap; null while it counts.
    SinkGapList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SinkGap"
    WebhookDeliveryStatus:
      type: string
      description: |
        `pending` waits for its next attempt; `succeeded` was accepted by the
        receiver; `failed` was refused in a way a retry would not change;
        `exhausted` ran out of attempts; `dropped` was left unsent because
        the platform disabled the subscription.
      enum: [pending, succeeded, failed, exhausted, dropped]
    WebhookDeliveryAttempt:
      type: object
      description: One call made to the receiver.
      required: [n, at, status_code, latency_ms, response_snippet, error]
      properties:
        n:
          type: integer
          description: The attempt's number, from 1.
        at:
          type: string
          format: date-time
        status_code:
          type: integer
          nullable: true
          description: The receiver's status code; null when no answer came.
        latency_ms:
          type: integer
          format: int64
        response_snippet:
          type: string
          nullable: true
          description: The start of the receiver's answer.
        error:
          type: string
          nullable: true
          description: Why no answer came, such as a timeout.
    WebhookDelivery:
      type: object
      description: One event sent, or to be sent, to the subscription.
      required: [id, event_id, event_type, status, attempts, next_attempt_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          description: The event's `id`, which every delivery of the event carries.
        event_type:
          type: string
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDeliveryAttempt"
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: When a pending delivery is next attempted; null otherwise.
        created_at:
          type: string
          format: date-time
    WebhookDeliveryList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last.
    ImportResult:
      type: object
      description: What an import did, or with a dry run what it would do.
      required: [project, mode, source, dry_run, changes, warnings]
      properties:
        project:
          $ref: "#/components/schemas/DocumentProject"
        mode:
          type: string
          enum: [create, merge, replace]
        source:
          type: string
          enum: [document, firebase]
        dry_run:
          type: boolean
        changes:
          $ref: "#/components/schemas/ImportChanges"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ImportWarning"
    FirebaseImportResult:
      description: |
        What an import of a Remote Config template did, or with a dry run would
        do: an `ImportResult` with the flags of the template as the project
        stores them in the target environment and the attributes it declared.
      allOf:
        - $ref: "#/components/schemas/ImportResult"
        - type: object
          required: [flags, attributes]
          properties:
            flags:
              type: array
              description: One per parameter of the template, by key.
              items:
                $ref: "#/components/schemas/FirebaseFlag"
            attributes:
              type: array
              description: The attributes the translation declared, by key.
              items:
                $ref: "#/components/schemas/FirebaseAttribute"
    FirebaseFlag:
      type: object
      description: A flag of the template as the project stores it in the target environment.
      required: [key, type, description, tags, variations, "on", off_variation, fallthrough, rules]
      properties:
        key:
          type: string
        type:
          type: string
          description: "`boolean`, `string`, `number` or `json`."
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        variations:
          type: array
          items:
            $ref: "#/components/schemas/DocumentVariation"
        "on":
          type: boolean
        off_variation:
          type: string
        fallthrough:
          type: string
        rules:
          type: array
          description: In the order the template's conditions come.
          items:
            $ref: "#/components/schemas/DocumentRule"
    FirebaseAttribute:
      type: object
      required: [key, type]
      properties:
        key:
          type: string
        type:
          type: string
          description: "`string`, `number` or `semver`."
    ImportChanges:
      type: object
      description: The keys of the entities an import created, updated and deleted, by kind. Standard attributes are never in it.
      required: [environments, unit_types, attributes, segments, flags, experiments]
      properties:
        environments:
          $ref: "#/components/schemas/ImportKindChanges"
        unit_types:
          $ref: "#/components/schemas/ImportKindChanges"
        attributes:
          $ref: "#/components/schemas/ImportKindChanges"
        segments:
          $ref: "#/components/schemas/ImportKindChanges"
        flags:
          $ref: "#/components/schemas/ImportKindChanges"
        experiments:
          $ref: "#/components/schemas/ImportKindChanges"
    ImportKindChanges:
      type: object
      required: [created, updated, deleted]
      properties:
        created:
          type: array
          items:
            type: string
        updated:
          type: array
          items:
            $ref: "#/components/schemas/ImportUpdate"
        deleted:
          type: array
          items:
            type: string
    ImportUpdate:
      type: object
      required: [key, patch]
      properties:
        key:
          type: string
        patch:
          type: array
          description: An RFC 6902 JSON Patch turning the entity as it was into the entity as it is, over its entry of the document.
          items:
            $ref: "#/components/schemas/JsonPatchOperation"
    JsonPatchOperation:
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace, move, copy, test]
        path:
          type: string
        from:
          type: string
        value: {}
    ImportWarning:
      type: object
      description: Something an import did differently from what the document asks, or could not do, without refusing it.
      required: [code, pointer, detail]
      properties:
        code:
          type: string
          description: "Stable name of the warning, such as `owner_replaced`."
        pointer:
          type: string
          description: A JSON Pointer into the document, empty for the document as a whole.
        detail:
          type: string
        params:
          type: object
          additionalProperties: true
          description: The values a client explains the warning with, such as the `email` of an owner replaced.
    ProjectDocument:
      type: object
      description: |
        A project's whole configuration, versioned apart from this API: it
        has its own `schema_version`, a server imports every version it ever
        exported, and within a version a document changes only additively
        (a new optional field or section). A field it does not define is
        refused naming its JSON Pointer. Identity is the key: no entity
        identifier travels, except rule ids and rollout salts.
      required: [schema_version, project, environments, unit_types, attributes, segments, flags, experiments]
      properties:
        schema_version:
          type: integer
          enum: [1]
        project:
          $ref: "#/components/schemas/DocumentProject"
        environments:
          type: array
          description: In their sort order, which the array's order is.
          items:
            $ref: "#/components/schemas/DocumentEnvironment"
        unit_types:
          type: array
          description: By key.
          items:
            $ref: "#/components/schemas/DocumentUnitType"
        attributes:
          type: array
          description: By key. The standard attributes are never listed.
          items:
            $ref: "#/components/schemas/DocumentAttribute"
        segments:
          type: array
          description: By key.
          items:
            $ref: "#/components/schemas/DocumentSegment"
        flags:
          type: array
          description: By key.
          items:
            $ref: "#/components/schemas/DocumentFlag"
        experiments:
          type: array
          description: By key, whatever their status.
          items:
            $ref: "#/components/schemas/DocumentExperiment"
    DocumentProject:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
    DocumentEnvironment:
      type: object
      required: [key, name, protected]
      properties:
        key:
          type: string
        name:
          type: string
        protected:
          type: boolean
    DocumentUnitType:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
    DocumentAttribute:
      type: object
      required: [key, type, name]
      properties:
        key:
          type: string
        type:
          type: string
          description: "`string`, `number`, `boolean`, `semver` or `date`."
        name:
          type: string
        description:
          type: string
    DocumentSegment:
      type: object
      required: [key, name, private, conditions]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        private:
          type: boolean
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/DocumentCondition"
    DocumentCondition:
      type: object
      description: |
        One comparison inside a rule or a segment. An `attribute` condition
        names an `attribute`, an operator (`op`) and a `value` (none for
        `exists`, `not_exists` and `is_empty`); `in_segment` and
        `not_in_segment` name a `segment`; `prerequisite` names a `flag` and
        one of its `variation`s.
      required: [kind]
      properties:
        kind:
          type: string
        attribute:
          type: string
        op:
          type: string
        value:
          description: A string, number, boolean or list, as the operator needs.
          nullable: true
        segment:
          type: string
        flag:
          type: string
        variation:
          type: string
    DocumentFlag:
      type: object
      required: [key, type, name, lifetime, variations, configurations]
      properties:
        key:
          type: string
        type:
          type: string
          description: "`boolean`, `string`, `number` or `json`; never changes."
        name:
          type: string
        description:
          type: string
        owner:
          type: string
          description: The email address of the flag's owner.
        tags:
          type: array
          items:
            type: string
        lifetime:
          type: string
          description: "`temporary` or `permanent`."
        expected_removal_at:
          type: string
          format: date-time
          nullable: true
          description: When a temporary flag is expected to be removed; null for a permanent one.
        automatic_exposure:
          type: boolean
        archived:
          type: boolean
        variations:
          type: array
          description: In the order the flag lists them, the first being the default of a flag that is not boolean.
          items:
            $ref: "#/components/schemas/DocumentVariation"
        configurations:
          type: object
          description: The flag's configuration in each environment, keyed by environment key.
          additionalProperties:
            $ref: "#/components/schemas/DocumentConfiguration"
    DocumentVariation:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          description: JSON of the flag's type.
        name:
          type: string
        description:
          type: string
    DocumentConfiguration:
      type: object
      required: ["on", off_variation, fallthrough, rules]
      properties:
        "on":
          type: boolean
        off_variation:
          type: string
        fallthrough:
          type: string
        prerequisites:
          type: array
          description: By flag.
          items:
            $ref: "#/components/schemas/DocumentPrerequisite"
        overrides:
          type: array
          description: By unit type, then unit ID.
          items:
            $ref: "#/components/schemas/DocumentOverride"
        rules:
          type: array
          description: In the order they are checked.
          items:
            $ref: "#/components/schemas/DocumentRule"
    DocumentPrerequisite:
      type: object
      required: [flag, variation]
      properties:
        flag:
          type: string
        variation:
          type: string
    DocumentOverride:
      type: object
      required: [unit_type, unit_id, variation]
      properties:
        unit_type:
          type: string
        unit_id:
          type: string
        variation:
          type: string
        note:
          type: string
          description: Why the unit is pinned. Who pinned it does not travel.
    DocumentRule:
      type: object
      required: [conditions, serve]
      properties:
        id:
          type: string
          format: uuid
          description: Kept across instances so that an SDK's rule id stays stable; minted on import when absent.
        description:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/DocumentCondition"
        serve:
          $ref: "#/components/schemas/DocumentServe"
    DocumentServe:
      type: object
      description: |
        What a matching rule serves. `variation` serves `variation`; `rollout`
        serves `variation` to `percentage` (basis points, 0 to 10,000) of the
        units of `unit_type`, bucketed by `salt`; `experiment` serves the
        experiment `experiment` of the flag.
      required: [kind]
      properties:
        kind:
          type: string
          description: "`variation`, `rollout` or `experiment`."
        variation:
          type: string
        experiment:
          type: string
        unit_type:
          type: string
        percentage:
          type: integer
        salt:
          type: string
          description: A rollout's salt, 16 lower-case letters and digits; it decides which units fall in the share, so it travels. Minted on import when absent.
    DocumentExperiment:
      type: object
      required: [key, name, flag, unit_type, variations, traffic_allocation, status]
      properties:
        key:
          type: string
        name:
          type: string
        hypothesis:
          type: string
        owner:
          type: string
          description: The email address of the experiment's owner.
        tags:
          type: array
          items:
            type: string
        flag:
          type: string
          description: The key of the flag whose variations are compared.
        unit_type:
          type: string
        variations:
          type: array
          description: In the order that fixes the cumulative bucket ranges.
          items:
            $ref: "#/components/schemas/DocumentExperimentVariation"
        traffic_allocation:
          type: integer
          description: The share of units included, in basis points.
        inclusion_salt:
          type: string
        variation_salt:
          type: string
        status:
          type: string
          description: "`draft`, `running`, `stopped` or `archived`."
        expected_end_at:
          type: string
          format: date
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        stopped_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        decision:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DocumentDecision"
    DocumentExperimentVariation:
      type: object
      required: [variation, weight]
      properties:
        variation:
          type: string
        weight:
          type: integer
          description: The share of the allocated traffic, in basis points.
    DocumentDecision:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          description: "`winner` or `removed`."
        winner_variation:
          type: string
        note:
          type: string
