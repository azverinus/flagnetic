version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    govet:
      enable-all: true
      disable:
        # Field order follows meaning, not padding.
        - fieldalignment
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    # The layer rules of ARCHITECTURE.md: dependencies point inwards.
    depguard:
      rules:
        # The evaluator is published for every Go program to import, and
        # adds no dependency to any of them.
        eval:
          list-mode: strict
          files:
            - "**/eval/**"
          allow:
            - $gostd
            - github.com/azverinus/flagnetic/eval
        domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/azverinus/flagnetic/internal/app
              desc: the domain layer must not depend on the application layer
            - pkg: github.com/azverinus/flagnetic/internal/infra
              desc: the domain layer must not depend on infrastructure
            - pkg: github.com/azverinus/flagnetic/internal/pkg
              desc: the domain layer uses only the standard library, eval and shared
            - pkg: github.com/jackc/pgx
              desc: persistence belongs in infra/out/postgres
            - pkg: database/sql
              desc: persistence belongs in infra/out/postgres
            - pkg: net/http
              desc: transport belongs in infra
            - pkg: os/exec
              desc: the domain layer performs no I/O
        # Application tests are external packages that wire the real
        # PostgreSQL repositories, since repositories are never faked; the rule
        # therefore covers the handlers and not their tests.
        app:
          files:
            - "**/internal/app/**"
            - "!$test"
          deny:
            - pkg: github.com/azverinus/flagnetic/internal/infra
              desc: the application layer declares ports; infra implements them
            - pkg: github.com/jackc/pgx
              desc: persistence belongs in infra/out/postgres; use the Transactor port
            - pkg: database/sql
              desc: persistence belongs in infra/out/postgres
            - pkg: net/http
              desc: transport belongs in infra
        # The kernel every layer imports, the domain included, so it may use
        # the standard library and itself only.
        shared:
          files:
            - "**/internal/shared/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/azverinus/flagnetic/internal/shared
        pkg:
          files:
            - "**/internal/pkg/**"
          deny:
            - pkg: github.com/azverinus/flagnetic/internal/domain
              desc: pkg knows nothing about Flagnetic
            - pkg: github.com/azverinus/flagnetic/internal/app
              desc: pkg knows nothing about Flagnetic
            - pkg: github.com/azverinus/flagnetic/internal/infra
              desc: pkg knows nothing about Flagnetic
            - pkg: github.com/azverinus/flagnetic/internal/shared
              desc: pkg knows nothing about Flagnetic
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [bodyclose, gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/azverinus/flagnetic
